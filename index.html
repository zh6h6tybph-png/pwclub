<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>暖光陪玩俱乐部</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--text);background:var(--bg);transition:all .3s;overflow:hidden}
body::before{content:'';position:fixed;inset:-10%;z-index:-1;background:radial-gradient(circle at 20% 10%,rgba(255,206,168,.6),transparent 40%),radial-gradient(circle at 80% 80%,rgba(214,231,255,.6),transparent 40%);filter:blur(30px)}
:root{--bg:#f5f2eb;--primary:#c08c65;--primary-soft:rgba(192,140,101,.15);--card-bg:rgba(255,255,255,.65);--card-border:1px solid rgba(255,255,255,.8);--blur:blur(20px);--text:#4a4038;--text-sub:#a89b8f;--line:rgba(192,140,101,.2);--radius:24px;--shadow:0 8px 30px rgba(0,0,0,.06);--btn-text:#fff}
body[data-theme="y2k"]{--bg:#ffeef6;--primary:#ff5c8a;--primary-soft:rgba(255,92,138,.15);--card-bg:#fff;--card-border:3px solid #1a1a1a;--blur:none;--text:#111;--text-sub:#888;--line:#1a1a1a;--radius:6px;--shadow:5px 5px 0 #1a1a1a;--btn-text:#111}
#app{height:100%;position:relative;z-index:1;overflow:hidden;display:flex;flex-direction:column}
.screen{height:100%;display:flex;flex-direction:column;overflow:hidden}
.content{flex:1;overflow-y:auto;padding:10px 0 30px}
.content::-webkit-scrollbar{width:0}
.topbar{padding:20px 18px 10px;display:flex;align-items:center;gap:10px}
.tb-title{font-size:19px;font-weight:700;flex:1}
.tb-back{width:36px;height:36px;border-radius:50%;background:var(--card-bg);display:grid;place-items:center;cursor:pointer;border:var(--card-border);box-shadow:var(--shadow)}
.card{background:var(--card-bg);border:var(--card-border);border-radius:var(--radius);backdrop-filter:var(--blur);box-shadow:var(--shadow);padding:18px;margin:0 16px 14px}
.card-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.tiny{font-size:12px;color:var(--text-sub);line-height:1.6}
.muted{color:var(--text-sub)}
.input,.select,textarea.input{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.8);font-size:14px;color:var(--text);outline:none;font-family:inherit}
body[data-theme="y2k"] .input,body[data-theme="y2k"] .select,body[data-theme="y2k"] textarea.input{border:2px solid var(--line);background:#fff}
.field{margin-bottom:14px}
.field-label{font-size:12px;color:var(--text-sub);margin-bottom:6px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:14px;border:none;font-size:14px;font-weight:600;cursor:pointer;background:var(--primary-soft);color:var(--text);transition:transform .1s;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--primary);color:var(--btn-text)}
body[data-theme="y2k"] .btn{border:2px solid var(--line);border-radius:4px;box-shadow:3px 3px 0 var(--line)}
body[data-theme="y2k"] .btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.block{width:100%;margin-top:12px}
.btn.sm{padding:8px 12px;font-size:12px;border-radius:10px}
.btn.danger{background:rgba(220,80,80,.15);color:#d05c5c}
.seg{display:flex;background:var(--primary-soft);border-radius:14px;padding:4px;margin:0 16px 14px}
.seg-item{flex:1;text-align:center;padding:10px;border-radius:10px;font-size:13px;font-weight:600;color:var(--text-sub);cursor:pointer}
.seg-item.active{background:var(--card-bg);color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.tabbar{display:flex;padding:8px 6px 20px;background:var(--card-bg);border-top:1.5px solid var(--line);backdrop-filter:var(--blur)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--text-sub);cursor:pointer;font-weight:600}
.tab span{font-size:20px;filter:grayscale(1)}
.tab.active{color:var(--primary)}
.tab.active span{filter:none;transform:translateY(-2px)}
.pick{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);margin-bottom:8px;cursor:pointer;font-size:14px}
.pick.active{border-color:var(--primary);background:var(--primary-soft)}
.pick .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:10px;color:transparent}
.pick.active .dot{background:var(--primary);border-color:var(--primary);color:#fff}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick-btn{display:flex;align-items:center;gap:8px;padding:16px;border-radius:16px;background:var(--primary-soft);font-weight:600;font-size:14px;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--primary-soft);padding:14px;border-radius:16px}
.stat b{font-size:18px;display:block;color:var(--primary)}
.stat span{font-size:11px;color:var(--text-sub)}
.rec{padding:14px;border-radius:16px;background:var(--primary-soft);margin-bottom:10px;border-left:4px solid transparent}
.rec.settled{border-left-color:#6fbf8b;background:rgba(120,190,140,.1)}
.rec-head{display:flex;justify-content:space-between;margin-bottom:6px;font-weight:700;font-size:14px}
.rec-meta{font-size:12px;color:var(--text-sub);line-height:1.6}
.tag{padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700}
.tag.ok{background:#e8f5e9;color:#4caf50}
.tag.warn{background:#fff3e0;color:#ff9800}
.foldbar{border-radius:14px;background:var(--primary-soft);margin-bottom:12px;overflow:hidden}
.foldbar-head{padding:14px;display:flex;justify-content:space-between;font-size:14px;font-weight:600;cursor:pointer}
.foldbar-body{display:none;padding:0 14px 14px}
.foldbar.open .foldbar-body{display:block}
.numgrid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.numgrid b{width:36px;height:36px;display:grid;place-items:center;background:var(--card-bg);border-radius:10px;cursor:pointer}
.numgrid b.active{background:var(--primary);color:#fff}
.empty{text-align:center;padding:40px 20px;color:var(--text-sub);font-size:13px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg);border-radius:24px;padding:24px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.auth-inner{padding:80px 30px;text-align:center}
.brand{font-size:60px;margin-bottom:20px}
</style>
</head>
<body data-theme="glass">
<div id="app"></div>
<script>
// ---------------- 数据与状态 ----------------
const S = { screen: 'login', nav: 'home', sub: null, form: {}, tabs: {}, modal: null };
let session = JSON.parse(localStorage.getItem('pw_session') || 'null');
let DB = JSON.parse(localStorage.getItem('pw_db') || 'null');

function initDB() {
  if (DB) return;
  const now = Date.now(), C = 'c1';
  DB = {
    clubs: [{ id: C, name: '暖光俱乐部', playerCode: 'PW-8K2M', staffCode: 'ST-3F9Q', ownerId: 'u1', createdAt: now, settings: { base: 20, dispatch: 10, direct: 5, topBonus: 15, topPlayers: ['u4'], tiers: [{min:10, reduce:1}, {min:20, reduce:2}], externalPrices: {'宣陪':5, '软件流量':2}, externalTiers: [{id:'t1', name:'小档', volume:100}, {id:'t2', name:'中档', volume:500}], popup: { title: '恭喜通过审核 🎉', content: '欢迎加入暖光！请前往设置输入陪玩绑定码解锁权限。' }, requirements: { '王者荣耀': [{title:'基本要求', items:['星耀以上', '有麦']}] } } }],
    users: [
      { id: 'u1', username: 'admin', password: '123456', nickname: '管理员', avatar: '👑', currentClubId: C, theme: 'glass', roles: [{ clubId: C, role: 'admin', joinedAt: now - 100*86400000 }] },
      { id: 'u2', username: 'player', password: '123456', nickname: '小星', avatar: '⭐', currentClubId: C, theme: 'glass', roles: [{ clubId: C, role: 'player', joinedAt: now - 50*86400000 }] },
      { id: 'u3', username: 'staff', password: '123456', nickname: '阿派', avatar: '📋', currentClubId: C, theme: 'glass', roles: [{ clubId: C, role: 'staff', jobs: ['派单'], joinedAt: now - 30*86400000 }] },
      { id: 'u4', username: 'leader', password: '123456', nickname: '团长', avatar: '🛡️', currentClubId: C, theme: 'glass', roles: [{ clubId: C, role: 'leader', joinedAt: now - 80*86400000 }] },
      { id: 'u5', username: 'pending', password: '123456', nickname: '新人', avatar: '🌱', currentClubId: C, theme: 'glass', roles: [{ clubId: C, role: 'pending', joinedAt: now - 2*86400000 }] }
    ],
    games: [{ id: 'g1', clubId: C, name: '王者荣耀', projects: [{ id: 'p1', name: '排位上分', durations: [{ id: 'd1', name: '1小时', price: 30 }, { id: 'd2', name: '2小时', price: 55 }] }] }],
    orders: Array.from({length: 25}).map((_, i) => {
      const isSettled = i % 3 === 0;
      const gross = 30 + (i%5)*10;
      const net = gross * 0.8;
      return { id: 'o'+i, clubId: C, playerId: 'u2', playerName: '小星', gameName: '王者荣耀', projectName: '排位上分', durationName: '1小时', gross, net, commissionRate: 20, settled: isSettled, createdAt: now - i*3600000, remark: i%4===0?'客人很满意':'' };
    }),
    promotions: [], fines: [], applications: [{ id: 'a1', clubId: C, userId: 'u5', userName: '新人', game: '王者荣耀', position: '打野', status: 'waiting', createdAt: now }], notices: [], authCodes: [{ id: 'ac1', code: 'A3K9-F2M8', used: false }]
  };
  save();
}
function save() { localStorage.setItem('pw_db', JSON.stringify(DB)); }
function me() { return session ? DB.users.find(u => u.id === session.userId) : null; }
function curRole() { const u = me(); return u ? u.roles.find(r => r.clubId === u.currentClubId) : null; }
function curClub() { const u = me(); return u ? DB.clubs.find(c => c.id === u.currentClubId) : null; }
function isAdmin() { const r = curRole(); return r && r.role === 'admin'; }
function isReadOnly() { const r = curRole(); return r && ['leader', 'vice_leader'].includes(r.role); }
function isPlayer() { const r = curRole(); return r && r.role === 'player'; }
function isPending() { const r = curRole(); return r && r.role === 'pending'; }
function fmtDate(t) { const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()}`; }

// ---------------- 渲染框架 ----------------
function render() {
  const u = me();
  document.body.dataset.theme = (u && u.theme) || 'glass';
  let html = '';
  if (!session) {
    if (S.screen === 'register') html = pageRegister();
    else html = pageLogin();
  } else {
    if (S.sub) html = renderSub();
    else html = renderMain();
  }
  if (S.modal) html += `<div class="mask" data-act="closeModal">${S.modal}</div>`;
  document.getElementById('app').innerHTML = html;
}

function renderMain() {
  const pages = { home: pageHome, review: pageReview, pending: pagePending, finance: pageFinance, ranking: pageRanking, settings: pageSettings };
  let content = (pages[S.nav] || pageHome)();
  let tabs = '';
  if (isAdmin() || isReadOnly() || curRole().role === 'staff') {
    tabs = `<div class="tabbar">
      <div class="tab ${S.nav==='home'?'active':''}" data-act="nav" data-v="home"><span>🏠</span>主页</div>
      <div class="tab ${S.nav==='review'?'active':''}" data-act="nav" data-v="review"><span>✅</span>审核</div>
      <div class="tab ${S.nav==='finance'?'active':''}" data-act="nav" data-v="finance"><span>📊</span>流水</div>
      <div class="tab ${S.nav==='ranking'?'active':''}" data-act="nav" data-v="ranking"><span>🏆</span>榜单</div>
      <div class="tab ${S.nav==='settings'?'active':''}" data-act="nav" data-v="settings"><span>⚙️</span>设置</div>
    </div>`;
  } else {
    tabs = `<div class="tabbar">
      <div class="tab ${S.nav==='home'?'active':''}" data-act="nav" data-v="home"><span>🏠</span>主页</div>
      <div class="tab ${S.nav==='pending'?'active':''}" data-act="nav" data-v="pending"><span>📝</span>待审</div>
      <div class="tab ${S.nav==='finance'?'active':''}" data-act="nav" data-v="finance"><span>📊</span>流水</div>
      <div class="tab ${S.nav==='ranking'?'active':''}" data-act="nav" data-v="ranking"><span>🏆</span>榜单</div>
      <div class="tab ${S.nav==='settings'?'active':''}" data-act="nav" data-v="settings"><span>⚙️</span>设置</div>
    </div>`;
  }
  return `<div class="screen">${content}${tabs}</div>`;
}

function renderSub() {
  const subs = { report: pageReport, claim: pageClaim, promote: pagePromote, fine: pageFine, records: pageRecords };
  return `<div class="screen">${(subs[S.sub] || (() => '<div class="empty">开发中</div>'))()}</div>`;
}

function topbar(title, back = false) {
  return `<div class="topbar">${back ? '<div class="tb-back" data-act="back">←</div>' : ''}<div class="tb-title">${title}</div></div>`;
}

// ---------------- 页面 ----------------
function pageLogin() {
  return `<div class="screen auth-inner">
    <div class="brand">🌸</div>
    <div style="font-size:24px;font-weight:800;margin-bottom:8px">暖光陪玩</div>
    <div class="tiny" style="margin-bottom:30px">温暖相伴，从这一次登录开始。</div>
    <div class="card">
      <input class="input" id="lUser" placeholder="账号 (如 admin)" value="admin" style="margin-bottom:12px">
      <input class="input" id="lPass" type="password" placeholder="密码 123456" value="123456">
      <button class="btn primary block" data-act="login">登录</button>
      <div class="tiny" style="margin-top:16px;color:var(--primary);cursor:pointer" data-act="toReg">去注册</div>
    </div>
  </div>`;
}

function pageHome() {
  const u = me(), r = curRole(), c = curClub();
  if (!r) return '<div class="empty">无权限</div>';
  const mStart = new Date().setDate(1);
  const myOrders = DB.orders.filter(o => o.clubId === c.id && o.playerId === u.id && o.createdAt >= mStart);
  const net = myOrders.reduce((s, o) => s + o.net, 0);
  const isTop = (c.settings.topPlayers || []).includes(u.id);
  const days = Math.floor((Date.now() - r.joinedAt) / 86400000) + 1;

  let quickBtns = '';
  if (isAdmin() || isReadOnly() || r.role === 'staff') {
    quickBtns = `
      <div class="quick-btn" data-act="openSub" data-v="report">🎮 陪玩报备</div>
      <div class="quick-btn" data-act="openSub" data-v="claim">🤝 直属/派单</div>
      <div class="quick-btn" data-act="openSub" data-v="promote">📣 外宣录入</div>
      ${isAdmin() ? '<div class="quick-btn" data-act="openSub" data-v="fine">⚠️ 罚款</div>' : ''}
    `;
  } else {
    quickBtns = `<div class="quick-btn" data-act="openSub" data-v="report" style="grid-column:span 2">🎮 陪玩报备</div>`;
  }

  return `${topbar('主页')}
  <div class="content">
    <div class="card">
      <div style="display:flex;gap:14px;align-items:center">
        <div style="width:50px;height:50px;border-radius:50%;background:var(--primary-soft);display:grid;place-items:center;font-size:24px">${u.avatar}</div>
        <div>
          <div style="font-size:16px;font-weight:800">${u.nickname}</div>
          <div class="tiny">${c.name} · ${r.role}</div>
        </div>
      </div>
      <div class="tiny" style="margin-top:14px">今天是你在俱乐部发光的第 <b>${days}</b> 天✨</div>
    </div>

    <div class="card">
      <div class="card-title">个人总结</div>
      <div class="stats">
        <div class="stat"><b>¥${net.toFixed(2)}</b><span>本月流水净赚</span></div>
        <div class="stat"><b>${isTop?'是🌟':'否'}</b><span>本月头牌</span></div>
        <div class="stat"><b>${myOrders.length}</b><span>本月单量</span></div>
        <div class="stat"><b>¥0.00</b><span>本月奖励</span></div>
      </div>
      <div class="tiny" style="margin-top:10px">本月已完成 ${myOrders.length} 单，辛苦啦～</div>
    </div>

    <div class="card">
      <div class="quick-grid">${quickBtns}</div>
    </div>

    ${(isPlayer()||isPending()) ? `
    <div class="card">
      <div class="card-title">我的报备记录</div>
      ${myOrders.slice(0, 5).map(o => `
        <div class="rec ${o.settled?'settled':''}">
          <div class="rec-head">
            <span>${o.gameName} · ${o.projectName}</span>
            <span class="tag ${o.settled?'ok':'warn'}">${o.settled?'已结':'未结'}</span>
          </div>
          <div class="rec-meta">总价 ¥${o.gross} · 实得 <b style="color:var(--primary)">¥${o.net}</b></div>
          ${o.remark ? `<div class="tiny" style="margin-top:6px;background:rgba(255,255,255,.5);padding:6px;border-radius:8px">📝 ${o.remark}</div>` : ''}
        </div>
      `).join('') || '<div class="empty">暂无记录</div>'}
    </div>` : ''}
  </div>`;
}

function pageReport() {
  const c = curClub(), u = me();
  const isTop = (c.settings.topPlayers || []).includes(u.id);
  const myOrders = DB.orders.filter(o => o.clubId === c.id && o.playerId === u.id).sort((a,b)=>b.createdAt-a.createdAt);
  const f = S.form;

  const gross = (30 + (f.rExtra||0)) * ((f.rDisc||10)/10); // 简单演示公式

  return `${topbar('陪玩报备', true)}
  <div class="content">
    ${isTop ? '<div class="card" style="background:rgba(255,220,150,.4)">🌟 本月头牌加成中，单价上浮 15%</div>' : ''}
    <div class="card">
      <div class="tiny" style="margin-bottom:12px">认真填好每一笔报备，安心收获属于你的收入。</div>
      <div class="field">
        <div class="field-label">游戏项目</div>
        <select class="select"><option>王者荣耀 - 排位上分 - 1小时 (¥30)</option></select>
      </div>
      
      <div class="foldbar ${S.tabs.f1?'open':''}">
        <div class="foldbar-head" data-act="toggleFold" data-k="f1">
          <span>➕ 加价</span><span>${f.rExtra ? '+¥'+f.rExtra : '无'}</span>
        </div>
        <div class="foldbar-body">
          <div class="numgrid">${[0,5,10,15,20].map(n => `<b class="${f.rExtra===n?'active':''}" data-act="setExtra" data-v="${n}">${n}</b>`).join('')}</div>
        </div>
      </div>

      <div class="foldbar ${S.tabs.f2?'open':''}">
        <div class="foldbar-head" data-act="toggleFold" data-k="f2">
          <span>🏷 折扣</span><span>${f.rDisc===8?'8折':(f.rDisc===9?'9折':'无')}</span>
        </div>
        <div class="foldbar-body">
          <div class="numgrid">${[10,9,8,7,5].map(n => `<b class="${(f.rDisc||10)===n?'active':''}" data-act="setDisc" data-v="${n}">${n}</b>`).join('')}</div>
        </div>
      </div>

      <div class="field">
        <div class="field-label">备注</div>
        <textarea class="input" data-model="rRemark" data-act="input"></textarea>
      </div>

      <div class="pick ${f.rSettled?'active':''}" data-act="toggleSettled">
        <div class="dot">✓</div><div>此单已结</div>
      </div>

      <div style="background:var(--primary-soft);padding:14px;border-radius:14px;margin-top:10px">
        <div style="display:flex;justify-content:space-between"><span>预估总价</span><b style="color:var(--primary);font-size:18px">¥${gross.toFixed(2)}</b></div>
      </div>
      <button class="btn primary block" data-act="submitReport">提交报备</button>
    </div>

    <div class="card">
      <div class="card-title">历史报备</div>
      ${myOrders.map(o => `
        <div class="rec ${o.settled?'settled':''}">
          <div class="rec-head"><span>${o.gameName}</span><span class="tag ${o.settled?'ok':'warn'}">${o.settled?'已结':'未结'}</span></div>
          <div class="rec-meta">总价 ¥${o.gross} · 实得 ¥${o.net}</div>
          ${o.remark ? `<div class="tiny" style="margin-top:6px">📝 ${o.remark}</div>` : ''}
        </div>
      `).join('') || '<div class="empty">暂无记录</div>'}
    </div>
  </div>`;
}

function pageSettings() {
  const u = me(), c = curClub(), r = curRole();
  const editable = isAdmin();
  return `${topbar('设置')}
  <div class="content">
    <div class="card">
      <div class="card-title">账号资料</div>
      <div class="field"><div class="field-label">用户名(只读)</div><input class="input" readonly value="${u.username}" style="opacity:.6"></div>
      <div class="field"><div class="field-label">昵称</div><input class="input" value="${u.nickname}" data-model="sNick" data-act="input"></div>
      ${editable ? '<button class="btn primary block" data-act="saveNick">保存昵称</button>' : ''}
    </div>

    <div class="card">
      <div class="card-title">身份/俱乐部</div>
      <div class="tiny" style="margin-bottom:10px">当前：${c.name} · ${r.role}</div>
      <div class="tiny">切换身份页面会刷新，不用紧张哈。</div>
    </div>

    ${!editable ? `
    <div class="card">
      <div class="card-title">俱乐部信息（只读）</div>
      <div class="tiny">名称：${c.name}</div>
      <div class="tiny">陪玩码：${c.playerCode}</div>
      <div class="tiny">员工码：${c.staffCode}</div>
    </div>` : `
    <div class="card">
      <div class="card-title">👑 管理员设置区</div>
      <div class="field"><div class="field-label">基础抽成 %</div><input class="input" type="number" value="${c.settings.base}" data-model="sBase" data-act="input"></div>
      <button class="btn primary block" data-act="saveBiz">保存设置</button>
    </div>`}

    <div class="card">
      <div class="card-title">公共设置</div>
      <div style="display:flex;gap:10px;margin-bottom:14px">
        ${['glass','y2k'].map(t => `<button class="btn sm ${u.theme===t?'primary':''}" data-act="setTheme" data-v="${t}">${t==='glass'?'毛玻璃':'Y2K'}</button>`).join('')}
      </div>
      <button class="btn block danger" data-act="logout">退出登录</button>
    </div>
  </div>`;
}

function pageFinance() {
  const c = curClub();
  const orders = DB.orders.filter(o => o.clubId === c.id);
  const totalGross = orders.reduce((s, o) => s + o.gross, 0);
  const totalNet = orders.reduce((s, o) => s + o.net, 0);
  return `${topbar('流水')}
  <div class="seg">
    <div class="seg-item active">流水统计</div>
    <div class="seg-item">工资表</div>
  </div>
  <div class="content">
    <div class="card">
      <div class="card-title">流水统计</div>
      <div class="stats">
        <div class="stat"><b>${orders.length}</b><span>总单数</span></div>
        <div class="stat"><b>¥${totalGross}</b><span>总流水</span></div>
        <div class="stat"><b>¥${(totalGross-totalNet).toFixed(2)}</b><span>团抽成</span></div>
        <div class="stat"><b>¥0</b><span>员工抽成</span></div>
      </div>
    </div>
  </div>`;
}

function pageRanking() {
  return `${topbar('榜单')}
  <div class="seg"><div class="seg-item active">日榜</div><div class="seg-item">周榜</div><div class="seg-item">月榜</div></div>
  <div class="content"><div class="card"><div class="empty">暂无榜单数据</div></div></div>`;
}

function pageReview() {
  const apps = DB.applications.filter(a => a.clubId === curClub().id && a.status === 'waiting');
  return `${topbar('审核')}
  <div class="content">
    <div class="card">
      <div class="tiny" style="margin-bottom:10px">严谨审核，是给每一位伙伴最好的保障。</div>
      ${apps.map(a => `<div class="rec"><div class="rec-head">${a.userName}</div><div class="rec-meta">申请：${a.game}</div><button class="btn sm primary mt8" data-act="passApp" data-id="${a.id}">通过</button></div>`).join('') || '<div class="empty">暂无待审</div>'}
    </div>
  </div>`;
}

function pagePending() {
  return `${topbar('待审专区')}
  <div class="content">
    <div class="card">
      <div class="tiny" style="margin-bottom:12px">资料已收到，请耐心等候，我们尽快处理。</div>
      <div class="field"><div class="field-label">选择游戏</div><input class="input" placeholder="如：王者荣耀"></div>
      <div class="field"><div class="field-label">微信号（必填）</div><input class="input" placeholder="方便联系"></div>
      <button class="btn primary block" data-act="submitApp">提交审核</button>
    </div>
  </div>`;
}

function pageRegister() {
  return `<div class="screen auth-inner">
    <div class="brand">🌸</div>
    <div style="font-size:20px;font-weight:800;margin-bottom:20px">加入/创建俱乐部</div>
    <div class="card">
      <input class="input" placeholder="用户名" style="margin-bottom:12px">
      <input class="input" placeholder="密码" type="password" style="margin-bottom:12px">
      <button class="btn primary block" data-act="back">返回登录</button>
    </div>
  </div>`;
}

function pageClaim() {
  return `${topbar('派单/直属', true)}<div class="content"><div class="card"><div class="empty">搜索陪玩拉单功能</div></div></div>`;
}
function pagePromote() {
  return `${topbar('外宣录入', true)}<div class="content"><div class="card"><div class="empty">外宣录入表单</div></div></div>`;
}
function pageFine() {
  return `${topbar('罚款', true)}<div class="content"><div class="card"><div class="empty">下发罚款单</div></div></div>`;
}
function pageRecords() {
  return `${topbar('全部记录', true)}<div class="content"><div class="card"><div class="empty">所有报备记录</div></div></div>`;
}

// ---------------- 事件绑定 ----------------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const u = me(), c = curClub();

  if (act === 'login') {
    const un = document.getElementById('lUser').value.trim();
    const pw = document.getElementById('lPass').value;
    const user = DB.users.find(x => x.username === un && x.password === pw);
    if (!user) return alert('账号或密码错误');
    session = { userId: user.id };
    localStorage.setItem('pw_session', JSON.stringify(session));
    S.nav = 'home'; render();
  }
  else if (act === 'logout') {
    session = null; localStorage.removeItem('pw_session'); render();
  }
  else if (act === 'nav') {
    S.nav = el.dataset.v; S.sub = null; render();
  }
  else if (act === 'openSub') {
    S.sub = el.dataset.v; render();
  }
  else if (act === 'back') {
    S.sub = null; render();
  }
  else if (act === 'setTheme') {
    u.theme = el.dataset.v; save(); render();
  }
  else if (act === 'toggleFold') {
    const k = el.dataset.k;
    S.tabs[k] = !S.tabs[k]; render();
  }
  else if (act === 'setExtra') {
    S.form.rExtra = Number(el.dataset.v); render();
  }
  else if (act === 'setDisc') {
    S.form.rDisc = Number(el.dataset.v); render();
  }
  else if (act === 'toggleSettled') {
    S.form.rSettled = !S.form.rSettled; render();
  }
  else if (act === 'submitReport') {
    DB.orders.unshift({
      id: 'o'+Date.now(), clubId: c.id, playerId: u.id, playerName: u.nickname,
      gameName: '王者荣耀', projectName: '排位上分', durationName: '1小时',
      gross: 30, net: 24, settled: !!S.form.rSettled, remark: S.form.rRemark || '',
      createdAt: Date.now()
    });
    save(); S.form = {}; alert('报备成功'); render();
  }
  else if (act === 'passApp') {
    const app = DB.applications.find(a => a.id === el.dataset.id);
    if (app) { app.status = 'passed'; save(); render(); }
  }
  else if (act === 'saveNick') {
    if (S.form.sNick) u.nickname = S.form.sNick;
    save(); alert('已保存'); render();
  }
  else if (act === 'saveBiz') {
    if (S.form.sBase) c.settings.base = Number(S.form.sBase);
    save(); alert('已保存'); render();
  }
});

document.addEventListener('input', e => {
  if (e.target.dataset.model) {
    S.form[e.target.dataset.model] = e.target.value;
  }
});

// 启动
initDB();
if (session && !me()) { session = null; localStorage.removeItem('pw_session'); }
render();
</script>
</body>
</html>
