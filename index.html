<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>俱乐部管理系统</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;background:#d9d3c8;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:14px;color:#4a423a;}
@media(max-width:520px){body{padding:0;}}
.phone{width:100%;max-width:400px;height:min(820px,calc(100dvh - 28px));min-height:560px;position:relative;overflow:hidden;border-radius:36px;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.25);background:var(--bg);transition:background .3s;}
@media(max-width:520px){.phone{max-width:100%;height:100dvh;border-radius:0;box-shadow:none;}}
:root{--bg:#f5f2eb;--card:rgba(255,255,255,.66);--card-border:rgba(255,255,255,.92);--text:#4a423a;--text-sub:#8b8178;--text-mute:#b3aaa1;--primary:#c08c65;--primary-soft:rgba(192,140,101,.13);--line:rgba(0,0,0,.06);--shadow:0 10px 30px rgba(180,160,140,.14);--radius:26px;--input-bg:rgba(255,255,255,.78);}
.phone.theme-y2k{--bg:#ffe8f0;--card:#fff;--card-border:#000;--text:#111;--text-sub:#555;--text-mute:#888;--primary:#ff5c8a;--primary-soft:rgba(255,92,138,.16);--line:rgba(0,0,0,.12);--shadow:5px 5px 0 #000;--radius:14px;--input-bg:#fff;background-color:#ffe8f0;background-image:linear-gradient(rgba(255,92,138,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(255,92,138,.16) 1px,transparent 1px);background-size:24px 24px;}
.phone.theme-pixel{--bg:#2e2018;--card:#f7e7c8;--card-border:#5c3a21;--text:#2d1f14;--text-sub:#6b4f36;--text-mute:#a08464;--primary:#8f563b;--primary-soft:#ead7b3;--line:#d8c3a0;--shadow:5px 5px 0 #4a2f1b;--radius:0px;--input-bg:#fffaf0;background-color:#2e2018;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 2px,transparent 2px 4px),repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 4px);border-radius:10px;font-family:"Courier New",Courier,monospace;}
.orbs{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.orbs i{position:absolute;border-radius:50%;filter:blur(58px);opacity:.75;}
.orbs i:nth-child(1){width:280px;height:280px;background:#f3d9c4;top:-70px;left:-70px;}
.orbs i:nth-child(2){width:250px;height:250px;background:#e7dfd2;bottom:90px;right:-90px;}
.orbs i:nth-child(3){width:200px;height:200px;background:#f8e9d9;bottom:-60px;left:20px;}
.phone.theme-y2k .orbs,.phone.theme-pixel .orbs{display:none;}
.screen{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-height:0;}
.topbar{display:flex;align-items:center;height:56px;padding:0 12px;flex-shrink:0;gap:6px;}
.tb-back{width:34px;height:34px;border-radius:50%;border:1px solid var(--card-border);background:var(--card);color:var(--text);font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding-bottom:4px;}
.tb-back.ghost{visibility:hidden;}
.tb-title{flex:1;text-align:center;font-size:15.5px;font-weight:600;letter-spacing:.5px;}
.tb-right{min-width:34px;display:flex;justify-content:flex-end;}
.tb-btn{border:none;background:var(--primary);color:#fff;font-size:11.5px;padding:7px 11px;border-radius:12px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.pending-topbar{display:flex;gap:6px;padding:0 12px;height:56px;align-items:center;flex-shrink:0;}
.pt-tab{flex:1;border:1px solid var(--card-border);background:var(--card);color:var(--text-sub);padding:8px 0;border-radius:12px;font-size:12px;cursor:pointer;font-family:inherit;}
.pt-tab.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700;}
.app{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 13px 24px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.app::-webkit-scrollbar{display:none;}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:15px;margin-bottom:13px;box-shadow:var(--shadow);}
.card-title{font-size:13.5px;font-weight:600;margin-bottom:11px;letter-spacing:.4px;}
.sec-title{font-size:12.5px;color:var(--text-sub);font-weight:600;margin:15px 4px 9px;letter-spacing:.4px;}
.tabbar{display:flex;height:62px;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--card-border);}
.tab{flex:1;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--text-mute);font-family:inherit;}
.tab.on{color:var(--primary);}
.tab-ico{font-size:17px;line-height:1;}
.tab-txt{font-size:10px;letter-spacing:.4px;}
.tab.on .tab-txt{font-weight:700;}
.login{min-height:100%;display:flex;flex-direction:column;position:relative;padding:38px 4px 78px;}
.login-hero{text-align:center;margin-bottom:22px;}
.login-logo{width:76px;height:76px;margin:0 auto 13px;border-radius:25px;background:linear-gradient(140deg,#f0d3ba,#e3c1a5);display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 14px 30px rgba(192,140,101,.28);}
.login-hero h1{margin:0 0 7px;font-size:21px;font-weight:600;letter-spacing:2px;}
.login-hero p{margin:0;font-size:11px;color:var(--text-sub);letter-spacing:1.4px;}
.login-register{text-align:center;font-size:12px;color:var(--text-mute);margin-top:12px;cursor:pointer;}
.login-register b{color:var(--primary);}
.chip{border:1px solid var(--card-border);background:var(--card);color:var(--text-sub);padding:7px 12px;border-radius:20px;font-size:11px;cursor:pointer;font-family:inherit;}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600;}
.lock{position:absolute;right:0;bottom:18px;width:42px;height:42px;border-radius:50%;border:1px solid var(--card-border);background:rgba(255,255,255,.45);font-size:16px;opacity:.55;cursor:pointer;}
.input{width:100%;border:1px solid transparent;background:var(--input-bg);border-radius:13px;padding:11px 13px;font-size:13.5px;color:var(--text);font-family:inherit;outline:none;margin-bottom:9px;}
.input:focus{border-color:var(--primary);}
select.input{appearance:none;-webkit-appearance:none;}
textarea.input{min-height:64px;resize:none;line-height:1.6;}
.field{margin-bottom:9px;}
.field-label{font-size:10.5px;color:var(--text-mute);margin:0 4px 5px;letter-spacing:.5px;}
.hint{font-size:10.5px;color:var(--text-mute);text-align:center;margin-top:9px;line-height:1.6;}
.prompt{font-size:11px;color:var(--primary);text-align:center;margin:10px 0;padding:8px;background:var(--primary-soft);border-radius:10px;}
.btn{border:none;border-radius:15px;padding:12px 16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.4px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-ghost{background:var(--primary-soft);color:var(--primary);}
.btn-block{width:100%;display:block;}
.btn-sm{padding:8px 13px;font-size:11.5px;border-radius:11px;}
.seg{display:flex;background:var(--card);border-radius:15px;padding:3px;margin-bottom:12px;border:1px solid var(--card-border);}
.seg-item{flex:1;text-align:center;padding:8px 0;font-size:12px;color:var(--text-sub);border-radius:11px;cursor:pointer;font-weight:500;}
.seg-item.on{background:var(--primary);color:#fff;font-weight:600;}
.profile{display:flex;align-items:center;gap:13px;}
.avatar{width:54px;height:54px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:25px;background:linear-gradient(140deg,#f6e2cf,#ecd0b6);flex-shrink:0;}
.avatar.sm{width:40px;height:40px;font-size:19px;border-radius:13px;}
.profile-main{flex:1;min-width:0;}
.profile-name{font-size:15.5px;font-weight:600;margin-bottom:4px;}
.profile-meta{font-size:11px;color:var(--text-sub);}
.badge{font-size:9.5px;padding:5px 9px;border-radius:20px;background:var(--primary-soft);color:var(--primary);font-weight:700;white-space:nowrap;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.stat{background:var(--primary-soft);border-radius:15px;padding:11px;text-align:center;}
.stat-num{font-size:16.5px;font-weight:700;color:var(--primary);margin-bottom:3px;}
.stat-lbl{font-size:10px;color:var(--text-sub);letter-spacing:.3px;}
.rect-list{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.rect-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:100%;border:1px solid var(--card-border);background:var(--primary-soft);border-radius:16px;padding:16px 10px;cursor:pointer;font-family:inherit;color:var(--text);font-size:13px;text-align:center;}
.rect-ico{font-size:20px;line-height:1;}
.rect-txt{font-weight:600;}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:12.5px;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap;}
.row:last-child{border-bottom:none;}
.row span{color:var(--text-sub);}
.row b{font-weight:600;text-align:right;}
.calc-box{background:var(--primary-soft);border-radius:15px;padding:11px 13px;margin:6px 0 13px;}
.calc-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--text-sub);}
.calc-row b{color:var(--text);font-weight:600;}
.calc-row.total{border-top:1px dashed var(--line);margin-top:5px;padding-top:8px;font-size:13.5px;}
.calc-row.total b{color:var(--primary);font-size:16.5px;}
.fold-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:9px;background:var(--input-bg);border:1px solid transparent;border-radius:13px;cursor:pointer;font-size:13px;}
.fold-bar .fb-label{flex:1;color:var(--text);font-weight:600;}
.fold-bar .fb-val{color:var(--primary);font-weight:700;font-size:12.5px;}
.fold-bar .fb-arrow{color:var(--text-mute);font-size:12px;transition:.2s;}
.fold-bar.open .fb-arrow{transform:rotate(180deg);}
.fold-body{padding:10px 12px 12px;background:var(--primary-soft);border-radius:13px;margin-bottom:9px;display:flex;gap:10px;align-items:center;}
.num-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:1;}
.num-pick button{border:1px solid var(--card-border);background:var(--card);color:var(--text);padding:8px 0;border-radius:9px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;}
.num-pick button.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.check-line{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--input-bg);border-radius:13px;margin-bottom:9px;cursor:pointer;font-size:12.5px;}
.check-box{width:19px;height:19px;border-radius:6px;border:2px solid var(--text-mute);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0;}
.check-box.on{background:var(--primary);border-color:var(--primary);}
.rec-item{padding:11px 12px;border-radius:13px;margin-bottom:8px;background:var(--input-bg);border-left:3px solid transparent;}
.rec-item.settled{border-left-color:#5a9e6f;background:rgba(90,158,111,.07);}
.rec-line{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px;}
.rec-title{font-size:12.5px;font-weight:600;}
.rec-net{font-size:13.5px;font-weight:700;color:var(--primary);}
.rec-meta{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--text-mute);flex-wrap:wrap;}
.rec-tag{font-size:9.5px;padding:3px 7px;border-radius:8px;font-weight:700;}
.rec-tag.ok{background:rgba(90,158,111,.18);color:#3d7a4f;}
.rec-tag.no{background:rgba(192,140,101,.18);color:var(--primary);}
.rec-note{font-size:11px;color:var(--text-sub);margin-top:5px;line-height:1.5;}
.rec-imgs{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
.rec-img{width:40px;height:40px;border-radius:8px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:15px;overflow:hidden;}
.rec-img img{width:100%;height:100%;object-fit:cover;}
.audit-head{display:flex;align-items:center;gap:11px;margin-bottom:10px;}
.audit-name{font-size:13.5px;font-weight:600;margin-bottom:2px;}
.audit-sub{font-size:10.5px;color:var(--text-sub);}
.tag{font-size:9.5px;padding:4px 8px;border-radius:11px;background:var(--primary-soft);color:var(--primary);font-weight:700;margin-left:auto;white-space:nowrap;}
.audit-actions{display:flex;gap:9px;}
.audit-actions .btn{flex:1;}
.panel{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);margin-bottom:11px;overflow:hidden;}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 15px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;}
.panel-arrow{color:var(--text-mute);transition:.2s;font-size:11px;}
.panel.open .panel-arrow{transform:rotate(180deg);}
.panel-body{padding:0 15px 15px;border-top:1px solid var(--line);padding-top:13px;}
.code-item{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.code-item:last-child{border-bottom:none;}
.code-val{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:700;color:var(--primary);letter-spacing:1px;}
.code-status{font-size:9.5px;padding:3px 7px;border-radius:9px;background:var(--primary-soft);color:var(--primary);margin-left:auto;}
.code-status.used{background:rgba(0,0,0,.06);color:var(--text-mute);}
.empty{text-align:center;color:var(--text-mute);font-size:11.5px;padding:24px 0;}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,14px);background:rgba(50,44,38,.93);color:#fff;font-size:12px;padding:10px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:999;max-width:78%;text-align:center;line-height:1.5;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.loading{text-align:center;padding:40px 0;color:var(--text-mute);font-size:12px;}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-right:6px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin-bottom:15px;padding-top:20px;}
.podium-item{display:flex;flex-direction:column;align-items:center;gap:5px;}
.podium-avatar{width:40px;height:40px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;color:var(--primary);}
.podium-item:nth-child(1) .podium-avatar{width:56px;height:56px;font-size:22px;border:2px solid #ffd700;}
.podium-item:nth-child(2) .podium-avatar{width:48px;height:48px;font-size:18px;border:2px solid #c0c0c0;}
.podium-item:nth-child(3) .podium-avatar{width:48px;height:48px;font-size:18px;border:2px solid #cd7f32;}
.search-box{display:flex;gap:8px;margin-bottom:10px;}
.search-box input{flex:1;margin-bottom:0;}
.modal-mask{position:absolute;inset:0;background:rgba(30,24,20,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:10%;}
.modal-box{width:100%;height:80%;background:var(--card);border-radius:22px;padding:20px;display:flex;flex-direction:column;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--card-border);}
.modal-title{font-size:15px;font-weight:700;margin-bottom:12px;text-align:center;}
.modal-content{flex:1;font-size:12.5px;line-height:1.9;color:var(--text-sub);}
.modal-actions{display:flex;gap:9px;margin-top:14px;}
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="orbs"><i></i><i></i><i></i></div>
  <div class="screen">
    <header class="topbar" id="topbar"></header>
    <main class="app" id="app"></main>
    <nav class="tabbar" id="tabbar"></nav>
  </div>
  <div id="modalRoot"></div>
</div>

<script>
const SUPABASE_URL = 'https://thoaduhgtghskretxfut.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_rM9DsjFSuDd7PmnD4LP9rQ_CdvbkrD5';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var ROLE_LABEL={admin:'管理员',leader:'团长',vice_leader:'副团',staff:'员工',player:'陪玩',pending:'待审陪'};

var S={
  theme: localStorage.getItem('theme') || 'glass',
  user: null, clubs: [], currentClub: null, currentRole: null,
  page: 'login', history: [], params: {},
  regTab: 'join', auditTab: 'hall', pageIdx: 0,
  panels: {}, folds: {extra:false, discount:false, cInfo:false, cBiz:false, cGame:false, cMem:false, staff:false, playerSel:false, topSelect:false, tiered:false, reward:false},
  selPlayer: null, selOrders: [], genCodes: [], allClubs: [],
  modal: null, pendingTab: 'audit', appStatus: 'none',
  extraVal: 0, discountVal: 10, orderSettled: false,
  commission: {}, gameTree: [], finTab: 'stat', rankTab: 'gross',
  orders: [], audits: [], fines: [], promos: [], notices: [], members: [],
  searchQuery: '', topSearchQuery: '', loading: false,
  searchResultPlayer: null
};

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function card(html,cls){return '<div class="card '+(cls||'')+'">'+html+'</div>';}
function secTitle(t){return '<div class="sec-title">'+t+'</div>';}
function field(label,ph,val,id,type){return '<div class="field"><div class="field-label">'+label+'</div><input class="input" type="'+(type||'text')+'" id="'+(id||'')+'" placeholder="'+ph+'" value="'+(val||'')+'"></div>';}
function rowEl(l,v,cls){return '<div class="row '+(cls||'')+'"><span>'+l+'</span><b>'+v+'</b></div>';}
function prompt(msg){return '<div class="prompt">'+msg+'</div>';}
function applyTheme(){var p=$('#phone');if(p)p.className='phone'+(S.theme==='y2k'?' theme-y2k':S.theme==='pixel'?' theme-pixel':'');}

var toastTimer;
function toast(msg){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2500);}
function genCode(){var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';function pick(){var s='';for(var i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}return pick()+'-'+pick()+'-'+pick()+'-'+pick();}

/* ================= 核心数据交互 ================= */

async function login(username, password){
  S.loading = true; render();
  try{
    const { data, error } = await db.from('profiles').select('*').eq('username', username).eq('password', password).maybeSingle();
    if(error) throw error;
    if(!data){ toast('用户名或密码错误'); S.page = 'login'; return false; }
    S.user = data; localStorage.setItem('uid', data.id); 
    S.theme = data.theme || 'glass';
    await bootUser(); 
    return true;
  }catch(e){ 
    toast('登录失败：' + e.message); 
    S.page = 'login';
    return false; 
  } finally { 
    S.loading = false; 
    render(); 
  }
}

async function loadCurrentUser(){
  const uid = localStorage.getItem('uid'); if(!uid) return false;
  const { data, error } = await db.from('profiles').select('*').eq('id', uid).maybeSingle();
  if(error || !data) return false;
  S.user = data; S.theme = data.theme || 'glass'; return await bootUser();
}

async function bootUser(){
  if(!S.user) return false;
  const roles = S.user.roles || []; const clubIds = roles.map(r => r.club_id).filter(Boolean);
  
  if(clubIds.length === 0){
    S.clubs = []; S.currentClub = null; S.currentRole = 'pending';
    S.page = 'pending-audit'; return true;
  }
  
  const { data: clubs } = await db.from('clubs').select('*').in('id', clubIds);
  S.clubs = clubs || []; 
  const activeId = S.user.current_club_id || (S.clubs[0] && S.clubs[0].id);
  S.currentClub = S.clubs.find(c => c.id === activeId) || S.clubs[0] || null;
  
  if (S.currentClub) {
    const activeRole = roles.find(r => r.club_id === S.currentClub.id);
    S.currentRole = S.user.active_role || activeRole?.role || 'player';
    S.commission = S.currentClub.commission || { 
      base: 20, top_bonus: 15, dispatch_rate: 8, direct_rate: 5, 
      top_players: [], gameTree: [], tiered_commission: [], rewards: {}, promo_tiers: [] 
    };
    S.gameTree = S.commission.gameTree || [{name:'王者荣耀', items:[{name:'排位', durations:[{hours:1, price:30}]}]}];
  }
  
  S.page = 'home'; await loadHomeData(); return true;
}

async function loadHomeData(){
  if(!S.currentClub || !S.user) return;
  S.loading = true; render();
  try {
    const { data: ordersData } = await db.from('orders').select('*').eq('club_id', S.currentClub.id).order('created_at', { ascending: false });
    S.orders = ordersData || [];

    const { data: auditData } = await db.from('applications').select('*').eq('club_id', S.currentClub.id).order('created_at', { ascending: false });
    S.audits = auditData || [];

    const { data: allProfiles } = await db.from('profiles').select('id,username,nick,roles');
    S.members = (allProfiles || []).filter(p => (p.roles || []).some(r => r.club_id === S.currentClub.id));

    S.fines = S.orders.filter(o => o.type === '罚款');
    S.promos = S.orders.filter(o => o.type === '外宣');
  } catch(e) {
    console.warn('数据加载异常:', e);
  } finally {
    S.loading = false; render();
  }
}

function switchClub(clubId, role) {
  db.from('profiles').update({ current_club_id: clubId, active_role: role }).eq('id', S.user.id).then(() => {
    window.location.reload(); // 重新加载页面
  });
}

/* ================= 路由与渲染 ================= */

function go(page,params){
  S.history.push({page:S.page,params:S.params});
  S.page=page; S.params=params||{}; S.pageIdx=0;
  if(page === 'super-console') loadSuperData().then(render);
  else if(page === 'finance' || page === 'rank') loadHomeData();
  else render();
}
function back(){
  var h=S.history.pop();
  if(h){ S.page=h.page; S.params=h.params; }
  else{ S.page = S.user ? 'home' : 'login'; }
  S.pageIdx=0; render();
}
function switchTab(k){
  S.history=[]; S.page=k; S.pageIdx=0;
  if(k === 'finance' || k === 'rank' || k === 'home') loadHomeData();
  else render();
}

function tabsFor(role){
  if(role==='player') return [['home','主页','🏠'],['pending-hub','待审','⏳'],['finance','流水','💰'],['rank','榜单','🏆'],['settings','设置','⚙️']];
  if(role==='pending') return []; // 待审没有底栏
  return [['home','主页','🏠'],['audit','审核','🔍'],['finance','流水','💰'],['rank','榜单','🏆'],['settings','设置','⚙️']];
}

function render(){
  applyTheme();
  var p=PAGES[S.page]||PAGES.home;
  var tb=$('#topbar');

  if(p.bare){
    tb.style.display='none';tb.innerHTML='';tb.className='topbar';
  } else if (S.currentRole==='pending' && S.page.startsWith('pending-')) {
    tb.style.display='flex';tb.className='pending-topbar';
    var ptMap={audit:'审核',standard:'标准',notice:'通知',settings:'设置'};
    tb.innerHTML=['audit','standard','notice','settings'].map(k=>'<button class="pt-tab '+(S.pendingTab===k?'on':'')+'" data-act="pending-tab" data-v="'+k+'">'+ptMap[k]+'</button>').join('');
  } else {
    tb.style.display='flex';tb.className='topbar';
    tb.innerHTML=(p.back?'<button class="tb-back" data-act="back">‹</button>':'<div class="tb-back ghost"></div>')+'<div class="tb-title">'+(p.title||'')+'</div>'+'<div class="tb-right">'+(p.right?p.right():'')+'</div>';
  }

  var app=$('#app');app.innerHTML=p.render();app.scrollTop=0;

  var tbEl=$('#tabbar');
  if(p.bare||!S.user||!S.currentClub||S.currentRole==='pending'){
    tbEl.style.display='none';tbEl.innerHTML='';
  }else{
    tbEl.style.display='flex';var tt=tabsFor(S.currentRole);var tHtml='';
    for(var m=0;m<tt.length;m++){var t=tt[m];var on=(S.page===t[0])?'on':'';tHtml+='<button class="tab '+on+'" data-act="tab" data-v="'+t[0]+'"><span class="tab-ico">'+t[2]+'</span><span class="tab-txt">'+t[1]+'</span></button>';}
    tbEl.innerHTML=tHtml;
  }

  if(p.after)p.after();
  renderModal();
}

function renderModal(){
  var root=$('#modalRoot');
  if(!S.modal){root.innerHTML='';return;}
  root.innerHTML='<div class="modal-mask" data-act="close-modal"><div class="modal-box" onclick="event.stopPropagation()">'+
    '<div class="modal-title">'+S.modal.title+'</div><div class="modal-content">'+S.modal.content+'</div>'+
    '<div class="modal-actions"><button class="btn btn-ghost btn-block" data-act="close-modal">关闭</button></div></div></div>';
}

function recItem(o, showDelete, isAdmin) {
  var timeStr = o.created_at ? new Date(o.created_at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
  var netDisplay = Number(o.net) < 0 ? '-¥'+Math.abs(o.net).toFixed(2) : '¥'+(Number(o.net)||0).toFixed(2);
  var targetName = '';
  if (o.type === '罚款' || (isAdmin && o.user_id)) {
    var t = S.members.find(m=>m.id===o.user_id);
    if(t) targetName = ' ['+t.nick+']';
  }
  
  var imgsHtml = '';
  if (o.images && o.images.length > 0) {
    imgsHtml = '<div class="rec-imgs">' + o.images.map(i => '<div class="rec-img"><img src="'+i+'"></div>').join('') + '</div>';
  }

  var bgStyle = o.settled ? 'background: rgba(90,158,111,0.1); border: 1px solid rgba(90,158,111,0.3);' : '';

  return '<div class="rec-item '+(o.settled?'settled':'')+'" style="'+bgStyle+'"><div class="rec-line"><span class="rec-title">'+esc(o.game||'')+' · '+esc(o.type||'报备')+targetName+'</span><span class="rec-net" style="color:'+(Number(o.net)<0?'#d9534f':'var(--primary)')+'">'+netDisplay+'</span></div>'+
    '<div class="rec-meta"><span class="rec-tag '+(o.settled?'ok':'no')+'">'+(o.settled?'✓ 已结算':'未结算')+'</span><span>'+timeStr+'</span></div>'+
    (o.note?'<div class="rec-note">📝 '+esc(o.note)+'</div>':'')+
    imgsHtml +
    (showDelete && isAdmin ?'<div class="rec-del" style="margin-top:10px"><button class="btn btn-ghost btn-sm" data-act="del-record" data-v="'+o.id+'">删除记录</button></div>':'')+'</div>';
}

window.handleImageUpload = function(input) {
  if (input.files && input.files[0]) {
    var reader = new FileReader();
    reader.onload = function(e) {
      window.uploadedImages.push(e.target.result);
      document.getElementById('rp-img-preview').innerHTML += '<div class="rec-img"><img src="'+e.target.result+'"></div>';
    }
    reader.readAsDataURL(input.files[0]);
  }
}

window.rpCalc=function(){
  var box=document.getElementById('rp-calc');if(!box)return;
  var gross=parseFloat(document.getElementById('rp-gross').value)||0;
  var extra=S.extraVal,disc=S.discountVal;
  var isTop = (S.commission.top_players || []).indexOf(S.user.nick) >= 0;
  var topRate = isTop ? (S.commission.top_bonus || 15) : 0;
  var finalGross = +((gross + extra) * (disc/10) * (1 + topRate/100)).toFixed(2);
  var rate = (S.commission && S.commission.base) || 20; 
  var net = +(finalGross*(1-rate/100)).toFixed(2);
  
  box.innerHTML='<div class="calc-row"><span>折后加价总价</span><b>¥'+finalGross.toFixed(2)+'</b></div>'+
    (isTop?'<div class="calc-row" style="color:#d9534f"><span>头牌加成</span><b>+'+topRate+'%</b></div>':'')+
    '<div class="calc-row"><span>基础抽成率</span><b>'+rate+'%</b></div>'+
    '<div class="calc-row total"><span>预计实得 Net</span><b>¥'+net.toFixed(2)+'</b></div>';
}

    var total=0;for(var i=0;i<chosen.length;i++)total+=Number(chosen[i].gross);
    var wage=+(total*(isDirect?((S.commission?.direct_rate||5)/100):((S.commission?.dispatch_rate||8)/100))).toFixed(2);
    
    var chips=S.members.filter(m=>m.id !== S.user.id).map(m=>'<button class="chip '+(sel===m.id?'on':'')+'" data-act="pick-player" data-v="'+m.id+'">'+esc(m.nick||m.username)+'</button>').join('');

    var selectedPlayerCard = sel ? card('<div class="card-title">已选择陪玩: ' + esc(S.members.find(m=>m.id===sel)?.nick) + '</div>' +

        '<div class="calc-box"><div class="calc-row"><span>已选单数</span><b>'+chosen.length+' 单</b></div><div class="calc-row"><span>抽成比例</span><b>'+(isDirect?S.commission?.direct_rate:S.commission?.dispatch_rate)+'%</b></div><div class="calc-row total"><span>我的工资</span><b>¥'+wage.toFixed(2)+'</b></div></div>'+

        prompt('确认后收益会入账，记得抽空核对哦。')+

PAGES.finance={title:'流水',back:true,render:function(){
  var isAdmin = S.currentRole === 'admin';
  var myOrders = isAdmin ? S.orders : S.orders.filter(o => o.user_id === S.user.id || o.operator_id === S.user.id);
  
  var tabs = '<div class="seg"><div class="seg-item '+(S.finTab==='stat'?'on':'')+'" data-act="fin-tab" data-v="stat">流水统计</div><div class="seg-item '+(S.finTab==='wage'?'on':'')+'" data-act="fin-tab" data-v="wage">工资表</div></div>';
  var periods = '<div class="hscroll"><button class="hchip on">日报</button><button class="hchip">周报</button><button class="hchip">月报</button><input type="date" class="hchip" style="background:transparent;border:1px solid var(--line)"></div>';
  
  if(S.finTab === 'stat'){
    var totalGross = myOrders.reduce((s,o)=>s+Number(o.gross||0),0);
    var totalNet = myOrders.reduce((s,o)=>s+Number(o.net||0),0);
    return tabs + periods + prompt('一串数字背后，藏着所有人默默的努力。') +
      card('<div class="stat-grid"><div class="stat"><div class="stat-num">'+myOrders.length+'</div><div class="stat-lbl">总单数</div></div><div class="stat"><div class="stat-num">¥'+totalGross.toFixed(0)+'</div><div class="stat-lbl">总流水</div></div><div class="stat"><div class="stat-num">¥'+(totalGross-totalNet).toFixed(0)+'</div><div class="stat-lbl">总抽成</div></div><div class="stat"><div class="stat-num">¥0</div><div class="stat-lbl">无主单归属</div></div></div>')+
      card('<div class="card-title">按类型统计</div>'+rowEl('陪玩单', '¥'+totalGross.toFixed(2))+rowEl('罚款', '¥'+(-myOrders.filter(o=>o.type==='罚款').reduce((s,o)=>s+Number(o.net||0),0)).toFixed(2)));
  } else {
    var membersHtml = S.members.map(m => {
      var mOrders = myOrders.filter(o => o.user_id === m.id);
      var mNet = mOrders.reduce((s,o)=>s+Number(o.net||0),0);
      var settled = mOrders.filter(o=>o.settled).reduce((s,o)=>s+Number(o.net||0),0);
      if(mNet === 0 && settled === 0) return '';
      return '<div class="row"><span>'+esc(m.nick||m.username)+'</span><b>应发 ¥'+(mNet-settled).toFixed(2)+'</b></div>';
    }).join('');
    
    var totalAll = myOrders.reduce((s,o)=>s+Number(o.net||0),0);
    return tabs + periods + prompt('账目清晰分明，不辜负每一份汗水。') +
      card('<div class="stat-grid"><div class="stat"><div class="stat-num">¥'+totalAll.toFixed(0)+'</div><div class="stat-lbl">陪玩应发</div></div><div class="stat"><div class="stat-num">¥0</div><div class="stat-lbl">员工应发</div></div></div>'+
      '<div style="display:flex; gap:10px; margin:15px 0;"><button class="btn btn-ghost" style="flex:1">导出明细</button><button class="btn btn-primary" style="flex:1">导出汇总</button></div>'+
      prompt('导出文件后，可以发给伙伴核对收入。')+
      '<div class="card-title" style="margin-top:10px">明细列表</div>'+(membersHtml || '<div class="empty">还没有记录，期待写下你的第一条呀。</div>'));
  }
}};

PAGES.rank={title:'榜单',back:true,render:function(){
  var types = [
    {k:'gross', n:'流水榜'}, {k:'count', n:'单量榜'}, {k:'net', n:'实得榜'}, {k:'gift', n:'礼物榜'},
    {k:'top', n:'头牌榜'}, {k:'progress', n:'进步榜'}, {k:'fine', n:'罚款榜'}, {k:'active', n:'活跃榜'}
  ];
  
  var typeHtml = '<div class="hscroll" style="padding-bottom:10px;">' + types.map(t => '<button class="hchip '+(S.rankTab===t.k?'on':'')+'" data-act="rank-tab" data-v="'+t.k+'">'+t.n+'</button>').join('') + '</div>';
  var periodHtml = '<div class="hscroll"><button class="hchip on">日榜</button><button class="hchip">周榜</button><button class="hchip">月榜</button><input type="date" class="hchip" style="background:transparent;border:1px solid var(--line)"></div>';

  var ranks = S.members.map(m => {
    var mOrders = S.orders.filter(o => o.user_id === m.id);
    var gross = mOrders.filter(o=>o.type!=='罚款').reduce((s,o)=>s+Number(o.gross||0),0);
    var net = mOrders.reduce((s,o)=>s+Number(o.net||0),0);
    var count = mOrders.filter(o=>o.type!=='罚款').length;
    var fine = Math.abs(mOrders.filter(o=>o.type==='罚款').reduce((s,o)=>s+Number(o.net||0),0));
    return { nick: m.nick, id: m.id, gross, net, count, fine };
  });

  if(S.rankTab === 'gross') ranks.sort((a,b) => b.gross - a.gross);
  else if(S.rankTab === 'net') ranks.sort((a,b) => b.net - a.net);
  else if(S.rankTab === 'count') ranks.sort((a,b) => b.count - a.count);
  else if(S.rankTab === 'fine') ranks.sort((a,b) => b.fine - a.fine);
  else ranks.sort((a,b) => b.gross - a.gross);

  var podiumHtml = '<div class="podium">';
  if(ranks[1]) podiumHtml += '<div class="podium-item"><div class="podium-avatar">2</div><div>'+esc(ranks[1].nick)+'</div><div class="badge">'+ (S.rankTab==='count'?ranks[1].count+'单':(S.rankTab==='fine'?'-¥'+ranks[1].fine:'¥'+ranks[1].gross)) +'</div></div>';
  if(ranks[0]) podiumHtml += '<div class="podium-item"><div class="podium-avatar">👑</div><div>'+esc(ranks[0].nick)+'</div><div class="badge">'+ (S.rankTab==='count'?ranks[0].count+'单':(S.rankTab==='fine'?'-¥'+ranks[0].fine:'¥'+ranks[0].gross)) +'</div></div>';
  if(ranks[2]) podiumHtml += '<div class="podium-item"><div class="podium-avatar">3</div><div>'+esc(ranks[2].nick)+'</div><div class="badge">'+ (S.rankTab==='count'?ranks[2].count+'单':(S.rankTab==='fine'?'-¥'+ranks[2].fine:'¥'+ranks[2].gross)) +'</div></div>';
  podiumHtml += '</div>';

  var listHtml = ranks.slice(3, 20).map((r, i) => {
    var val = S.rankTab==='count'? r.count+'单' : (S.rankTab==='fine'? '-¥'+r.fine : '¥'+r.gross);
    return '<div class="row"><span>'+(i+4)+'. '+esc(r.nick)+'</span><b>'+val+'</b></div>';
  }).join('');

  var myRank = ranks.findIndex(r => r.id === S.user.id) + 1;
  var myInfo = myRank > 0 ? '<div class="row" style="background:var(--primary-soft); border-radius:10px; padding:10px; margin-top:10px;"><span>我的排名</span><b>第 '+myRank+' 名</b></div>' + prompt('稳住脚步慢慢走，下一次上榜的就是你。') : '';

  return typeHtml + periodHtml + prompt('名次只是参考，你的努力我们全都看在眼里。') + card(podiumHtml + (listHtml || '<div class="empty">还没有记录，期待写下你的第一条呀。</div>') + myInfo);
}};

PAGES['super-console']={title:'控制台',back:true,render:function(){
  var totalCodes = S.genCodes.length;
  var unusedCodes = S.genCodes.filter(c=>!c.used).length;
  var clubCount = S.allClubs.length;
  
  var statCard = card('<div class="stat-grid" style="grid-template-columns:1fr 1fr 1fr;"><div class="stat"><div class="stat-num" style="color:#333;">'+totalCodes+'</div><div class="stat-lbl">总授权码</div></div><div class="stat"><div class="stat-num" style="color:#22c55e;">'+unusedCodes+'</div><div class="stat-lbl">未使用</div></div><div class="stat"><div class="stat-num" style="color:#3b82f6;">'+clubCount+'</div><div class="stat-lbl">俱乐部数</div></div></div>');
  
  var genBtnCard = card('<div class="card-title">🔑 授权码管理</div>'+ prompt('守住规则，守护整个平台的安稳。') + '<div class="hint" style="text-align:left; margin-bottom:10px;">新俱乐部注册时需要授权码。每个授权码只能用一次。</div><button class="btn btn-primary btn-block" data-act="gen-code">+ 生成新授权码</button>');
  
  var clubHtml = S.allClubs.map(c=>'<div class="row"><span>'+esc(c.name)+'</span></div>').join('') || '<div class="empty">还没有记录，期待写下你的第一条呀。</div>';
  var clubCard = card('<div class="card-title">🏛️ 所有俱乐部 <span class="badge">'+clubCount+' 个</span></div>'+ prompt('规范管理，及时清理违规俱乐部。') + clubHtml);
  
  var codeHtml = S.genCodes.map(c=>{
    return '<div class="code-item"><span class="code-val">'+c.code+'</span><span class="code-status '+(c.used?'used':'')+'">'+(c.used?'已使用':'未使用')+'</span></div>';
  }).join('') || '<div class="empty">还没有记录，期待写下你的第一条呀。</div>';
  var codeCard = card('<div class="card-title">📋 授权码列表</div>'+codeHtml);
  
  return statCard + genBtnCard + clubCard + codeCard;
}};

/* ================= 事件与逻辑 ================= */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el) return;
  var a = el.dataset.act, v = el.dataset.v;
  
  switch(a){
    case 'goto': go(el.dataset.page); break;
    case 'back': back(); break;
    case 'tab': switchTab(v); break;
    case 'fin-tab': S.finTab=v; render(); break;
    case 'rank-tab': S.rankTab=v; render(); break;
    case 'regtab': S.regTab=v; render(); break;
    case 'theme': S.theme=v; localStorage.setItem('theme', v); applyTheme(); render(); break;
    case 'logout': localStorage.removeItem('uid'); window.location.reload(); break;
    
    case 'switch-club': {
      var cid = el.dataset.club, role = el.dataset.role;
      switchClub(cid, role);
      break;
    }

    case 'do-login': {
      var u=document.getElementById('login-user').value.trim();
      var p=document.getElementById('login-pass').value;
      login(u,p);
      break;
    }
    
    case 'do-new-club': {
      var uname = document.getElementById('reg-u').value.trim();
      var upass = document.getElementById('reg-p').value;
      var unick = document.getElementById('reg-n').value.trim();
      var cname = document.getElementById('reg-c').value.trim();
      var ccode = document.getElementById('reg-code').value.trim();
      
      if(!uname || !upass || !unick || !cname || !ccode) { toast('请填写完整信息'); break; }
      
      db.from('auth_codes').select('*').eq('code', ccode).eq('used', false).then(async res => {
        if(res.error || !res.data || res.data.length === 0) { toast('授权码无效或已被使用'); return; }
        
        var { error: cErr, data: cData } = await db.from('clubs').insert({ name: cname }).select().single();
        if(cErr) { toast('俱乐部创建失败: ' + cErr.message); return; }
        
        var { error: pErr } = await db.from('profiles').insert({
            username: uname, password: upass, nick: unick, roles: [{ club_id: cData.id, role: 'admin' }], current_club_id: cData.id, active_role: 'admin'
        });
        if(pErr) { toast('账号创建失败: ' + pErr.message); return; }
        
        await db.from('auth_codes').update({ used: true }).eq('id', res.data[0].id);
        
        toast('创建成功，正在登录...');
        login(uname, upass);
      }).catch(err => toast('网络请求失败: ' + err.message));
      break;
    }
    
    case 'do-join': {
      var uname = document.getElementById('reg-u').value.trim();
      var upass = document.getElementById('reg-p').value;
      var unick = document.getElementById('reg-n').value.trim();
      var cname = document.getElementById('reg-c').value.trim();
      
      if(!uname || !upass || !unick || !cname) { toast('请填写完整信息'); break; }
      
      db.from('clubs').select('id').eq('name', cname).then(async res => {
        if(res.error || !res.data || res.data.length === 0) { toast('找不到该俱乐部，请核对名称'); return; }
        var clubId = res.data[0].id;
        
        var { error: pErr } = await db.from('profiles').insert({
            username: uname, password: upass, nick: unick, roles: [{ club_id: clubId, role: 'player' }], current_club_id: clubId, active_role: 'player'
        });
        
        if(pErr) { toast('加入失败: ' + pErr.message); return; }
        toast('加入成功，正在登录...');
        login(uname, upass);
      }).catch(err => toast('网络请求失败: ' + err.message));
      break;
    }
    
    case 'bind-code': {
      var code = document.getElementById('pending-bind-code').value.trim();
      if(!code) { toast('请输入绑定码'); break; }
      // 假设绑定码是 PW-xxxxxx
      var clubCode = code.replace('PW-', '');
      var targetClub = S.clubs.find(c => c.id.startsWith(clubCode));
      if(targetClub) {
        var newRoles = [...(S.user.roles||[]), { club_id: targetClub.id, role: 'player' }];
        db.from('profiles').update({ roles: newRoles, current_club_id: targetClub.id, active_role: 'player' }).eq('id', S.user.id).then(() => {
          toast('绑定成功，正在登录...'); setTimeout(()=>window.location.reload(), 1000);
        });
      } else {
        toast('绑定码无效');
      }
      break;
    }

    case 'pending-tab': S.pendingTab=v; S.page='pending-'+v; render(); break;
    case 'audittab': S.auditTab=v; render(); break;
    case 'toggle-fold': S.folds[v]=!S.folds[v]; render(); break;
    case 'pick-num': if(el.dataset.target==='extra') S.extraVal=+v; else S.discountVal=+v; render(); break;
    case 'toggle-settled': S.orderSettled=!S.orderSettled; render(); break;
    case 'pick-player': S.selPlayer=v; S.searchResultPlayer=null; render(); break;
    case 'toggle-order': { var i=S.selOrders.indexOf(v); if(i>=0)S.selOrders.splice(i,1); else S.selOrders.push(v); render(); break; }
    
    case 'do-search-staff': {
      var q = document.getElementById('staff-search').value.trim();
      if(!q) { S.searchResultPlayer = null; render(); break; }
      var found = S.members.find(m => (m.nick||'').includes(q) || (m.username||'').includes(q));
      S.searchResultPlayer = found;
      render();
      break;
    }
    case 'do-search-all': {
      S.searchQuery = document.getElementById('all-search').value.trim();
      render();
      break;
    }

    case 'submit-player-report': {
      var grossInput = parseFloat(document.getElementById('rp-gross').value) || 0;
      if(!grossInput) { toast('请填写金额'); break; }
      
      var isTop = (S.commission.top_players || []).indexOf(S.user.nick) >= 0;
      var topRate = isTop ? (S.commission.top_bonus || 15) : 0;
      var finalGross = +((grossInput + S.extraVal) * (S.discountVal/10) * (1 + topRate/100)).toFixed(2);
      var rate = (S.commission && S.commission.base) || 20;
      var net = +(finalGross*(1-rate/100)).toFixed(2);

      db.from('orders').insert({ 
        club_id: S.currentClub.id, user_id: S.user.id, type: '陪玩单', 
        game: document.getElementById('rp-game').value, 
        gross: finalGross, net: net, settled: S.orderSettled, 
        note: document.getElementById('rp-note').value,
        images: window.uploadedImages
      }).then(res => {
        if(res.error) return toast('报备失败: ' + res.error.message);
        toast('报备成功'); S.orderSettled=false; window.uploadedImages=[]; loadHomeData();
      });
      break;
    }
    
    case 'submit-staff-report': {
      var kind = el.dataset.kind;
      if(!S.selOrders.length){ toast('请勾选单子'); break; }
      var chosen = S.orders.filter(o=>S.selOrders.includes(o.id));
      var total = chosen.reduce((s,o)=>s+Number(o.gross||0),0);
      var rate = (kind==='direct' ? (S.commission?.direct_rate||5) : (S.commission?.dispatch_rate||8)) / 100;
      var wage = +(total * rate).toFixed(2);
      
      db.from('orders').insert({ 
        club_id: S.currentClub.id, user_id: S.user.id, operator_id: S.user.id,
        type: kind==='direct'?'直属提成':'派单提成', gross: total, net: wage, 
        note: document.getElementById('staff-note').value 
      }).then(res => {
        if(res.error) return toast('拉单失败: ' + res.error.message);
        toast('拉单成功'); S.selOrders=[]; loadHomeData();
      });
      break;
    }
    
    case 'submit-promo': {
      var note = document.getElementById('promo-note').value.trim();
      var tier = document.getElementById('promo-tier').value;
      if(!note) { toast('请填写数据'); break; }
      db.from('orders').insert({
        club_id: S.currentClub.id, user_id: S.user.id, type: '外宣', gross: 0, net: 0, note: tier + ' - ' + note
      }).then(res => {
        if(res.error) return toast('录入失败: ' + res.error.message);
        toast('录入成功'); document.getElementById('promo-note').value=''; loadHomeData();
      });
      break;
    }
    
    case 'submit-fine': {
      var fnUser = document.getElementById('fn-player').value;
      var amt = parseFloat(document.getElementById('fn-amount').value)||0;
      var rsn = document.getElementById('fn-reason').value;
      if(!amt) { toast('金额不能为空'); break; }
      db.from('orders').insert({ club_id: S.currentClub.id, user_id: fnUser, operator_id: S.user.id, type: '罚款', gross: 0, net: -amt, note: rsn }).then(res => {
        if(res.error) return toast('罚款下发失败: ' + res.error.message);
        toast('罚款已下发'); loadHomeData();
      });
      break;
    }
    
    case 'audit-take': db.from('applications').update({status:'reviewing'}).eq('id', v).then(()=>loadHomeData()); break;
    case 'audit-pass': db.from('applications').update({status:'passed'}).eq('id', v).then(()=>loadHomeData()); break;
    case 'audit-reject': db.from('applications').update({status:'rejected'}).eq('id', v).then(()=>loadHomeData()); break;
    
    case 'submit-pending-app': {
      toast('已提交审核，请耐心等待');
      S.appStatus = 'waiting'; render();
      break;
    }
    
    case 'save-nickname': {
      var newNick = document.getElementById('nick-input').value;
      if(!newNick) { toast('昵称不能为空'); break; }
      db.from('profiles').update({nick: newNick}).eq('id', S.user.id).then(res => {
        if(res.error) return toast('保存失败: ' + res.error.message);
        toast('已保存'); S.user.nick=newNick; render();
      });
      break;
    }

    case 'update-comm': {
      var field = el.dataset.field;
      var val = parseFloat(el.value);
      if(isNaN(val)) return;
      S.commission[field] = val;
      db.from('clubs').update({ commission: S.commission }).eq('id', S.currentClub.id).then(()=>toast('已保存'));
      break;
    }

    case 'open-top-select': {
      var content = S.members.map(m=>'<div class="check-line" data-act="toggle-top-player" data-v="'+m.nick+'"><span class="check-box '+((S.commission.top_players||[]).includes(m.nick)?'on':'')+'">'+((S.commission.top_players||[]).includes(m.nick)?'✓':'')+'</span><span>'+esc(m.nick)+'</span></div>').join('');
      S.modal = { title: '选择头牌', content: '<input class="input" placeholder="搜索..." oninput="filterTopSearch(this.value)">' + '<div id="top-list">'+content+'</div>' };
      renderModal();
      break;
    }

    case 'toggle-top-player': {
      var n = v;
      var arr = S.commission.top_players || [];
      if(arr.includes(n)) arr = arr.filter(x=>x!==n); else arr.push(n);
      S.commission.top_players = arr;
      db.from('clubs').update({ commission: S.commission }).eq('id', S.currentClub.id).then(()=>{
        var content = S.members.map(m=>'<div class="check-line" data-act="toggle-top-player" data-v="'+m.nick+'"><span class="check-box '+(arr.includes(m.nick)?'on':'')+'">'+(arr.includes(m.nick)?'✓':'')+'</span><span>'+esc(m.nick)+'</span></div>').join('');
        S.modal.content = '<input class="input" placeholder="搜索..." oninput="filterTopSearch(this.value)">' + '<div id="top-list">'+content+'</div>';
        renderModal();
      });
      break;
    }

    case 'open-tiered-config': {
      var t = S.commission.tiered_commission || [];
      var content = t.map((x, i)=>'<div class="row"><span>满 '+x.min_orders+' 单减 '+x.reduce_rate+'%</span><button class="btn btn-ghost btn-sm" data-act="del-tier" data-v="'+i+'">删除</button></div>').join('');
      content += '<div style="display:flex;gap:5px;margin-top:10px;"><input type="number" class="input" id="new-tier-orders" placeholder="单量" style="flex:1"><input type="number" class="input" id="new-tier-rate" placeholder="减抽成%" style="flex:1"><button class="btn btn-primary" data-act="add-tier">添加</button></div>';
      S.modal = { title: '配置阶梯抽成', content: content };
      renderModal();
      break;
    }

    case 'add-tier': {
      var o = parseFloat(document.getElementById('new-tier-orders').value);
      var r = parseFloat(document.getElementById('new-tier-rate').value);
      if(!o || !r) return toast('请输入完整');
      S.commission.tiered_commission = S.commission.tiered_commission || [];
      S.commission.tiered_commission.push({min_orders:o, reduce_rate:r});
      db.from('clubs').update({ commission: S.commission }).eq('id', S.currentClub.id).then(()=>{ S.modal=null; render(); toast('已添加'); });
      break;
    }

    case 'del-tier': {
      S.commission.tiered_commission.splice(+v, 1);
      db.from('clubs').update({ commission: S.commission }).eq('id', S.currentClub.id).then(()=>{ S.modal=null; render(); toast('已删除'); });
      break;
    }

    case 'open-reward-config': {
      S.modal = { title: '配置流水奖励', content: '<div class="empty">复杂配置已预留接口，数据结构在 S.commission.rewards 中，可依此扩展。</div>' };
      renderModal();
      break;
    }

    case 'add-game-item': {
      var gname = prompt('请输入游戏名称：');
      if(!gname) break;
      var iname = prompt('请输入项目名称（自定义名字）：');
      if(!iname) break;
      var price = parseFloat(prompt('请输入价格（元/小时）：')) || 30;
      
      S.gameTree = S.gameTree || [];
      var g = S.gameTree.find(x=>x.name===gname);
      if(!g) { g = {name:gname, items:[]}; S.gameTree.push(g); }
      g.items.push({name:iname, durations:[{hours:1, price:price}]});
      S.commission.gameTree = S.gameTree;
      db.from('clubs').update({ commission: S.commission }).eq('id', S.currentClub.id).then(()=>{ render(); toast('已添加'); });
      break;
    }

    case 'open-pending-config': {
      S.modal = { title: '配置待审内容', content: '<div class="empty">弹窗内容与游戏要求配置已预留位置。</div>' };
      renderModal();
      break;
    }

    case 'close-modal': S.modal = null; renderModal(); break;

    case 'super-login': 
      if(document.getElementById('super-pass').value !== '846467554jxjsjsisjidbdgujwqkjsuxhv；@') { toast('密码错误'); break; }
      go('super-console'); break;
      
    case 'gen-code':
      db.from('auth_codes').insert({ code: genCode() }).then(res => {
        if(res.error) { toast('生成失败: ' + res.error.message); return; }
        loadSuperData().then(()=>{ render(); toast('生成成功'); });
      });
      break;
  }
});

// 补充的搜索过滤
window.filterTopSearch = function(val) {
  var list = S.members.filter(m => (m.nick||'').includes(val));
  var arr = S.commission.top_players || [];
  var content = list.map(m=>'<div class="check-line" data-act="toggle-top-player" data-v="'+m.nick+'"><span class="check-box '+(arr.includes(m.nick)?'on':'')+'">'+(arr.includes(m.nick)?'✓':'')+'</span><span>'+esc(m.nick)+'</span></div>').join('');
  document.getElementById('top-list').innerHTML = content;
}

document.addEventListener('input', function(e) {
  if(e.target.id === 'rp-gross') rpCalc();
  if(e.target.dataset.act === 'manual-extra') { S.extraVal = parseFloat(e.target.value)||0; rpCalc(); }
  if(e.target.dataset.act === 'manual-discount') { S.discountVal = parseFloat(e.target.value)||10; rpCalc(); }
});

(async function init(){ 
  applyTheme(); 
  var ok = await loadCurrentUser(); 
  if(!ok) S.page = 'login'; 
  render(); 
})();
</script>
