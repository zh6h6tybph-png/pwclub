<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>俱乐部管理系统</title>
<script>
  window.onerror = function(msg, url, line) {
    document.body.innerHTML = `
      <div style="padding:20px; font-family:sans-serif; background:#fff; color:#d9534f; min-height:100vh;">
        <h2>⚠️ 网页发生崩溃</h2>
        <p><b>错误信息：</b>${msg}</p>
        <p><b>所在行号：</b>第 ${line} 行</p>
        <p style="color:#666; font-size:12px; margin-top:20px;">常见原因：<br>1. 手机复制代码时少复制了一部分。<br>2. 网络加载 Supabase 失败。<br>3. 文件里存在两段重复代码。</p>
        <p>请把这张截图发给我。</p>
      </div>`;
    return false;
  };
</script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;background:#d9d3c8;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:14px;color:var(--text)}
.phone{width:100%;max-width:430px;height:100dvh;max-height:920px;position:relative;overflow:hidden;border-radius:36px;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.2);background:var(--bg);transition:background .3s}
@media(max-width:430px){.phone{border-radius:0;max-height:none}body{padding:0}}
:root{--bg:#f5f2eb;--card:rgba(255,255,255,.66);--card-border:rgba(255,255,255,.92);--text:#4a423a;--text-sub:#8b8178;--text-mute:#b3aaa1;--primary:#c08c65;--primary-soft:rgba(192,140,101,.13);--line:rgba(0,0,0,.06);--shadow:0 10px 30px rgba(180,160,140,.14);--radius:26px;--input-bg:rgba(255,255,255,.78)}
.theme-y2k{--bg:#ffe8f0;--card:#fff;--card-border:#000;--text:#111;--text-sub:#555;--text-mute:#888;--primary:#ff5c8a;--primary-soft:rgba(255,92,138,.16);--line:rgba(0,0,0,.12);--shadow:5px 5px 0 #000;--radius:14px;--input-bg:#fff}
.theme-pixel{--bg:#2e2018;--card:#f7e7c8;--card-border:#5c3a21;--text:#2d1f14;--text-sub:#6b4f36;--text-mute:#a08464;--primary:#8f563b;--primary-soft:#ead7b3;--line:#d8c3a0;--shadow:5px 5px 0 #4a2f1b;--radius:0px;--input-bg:#fffaf0;font-family:"Courier New",Courier,monospace}
.orbs{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}

.orbs i:nth-child(1){width:280px;height:280px;background:#f3d9c4;top:-70px;left:-70px}
.orbs i:nth-child(2){width:250px;height:250px;background:#e7dfd2;bottom:90px;right:-90px}
.orbs i:nth-child(3){width:200px;height:200px;background:#f8e9d9;bottom:-60px;left:20px}
.theme-y2k .orbs,.theme-pixel .orbs{display:none}
.screen{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;height:58px;padding:0 14px;flex-shrink:0;gap:6px}
.tb-back{width:34px;height:34px;border-radius:50%;border:1px solid var(--card-border);background:var(--card);color:var(--text);font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding-bottom:4px}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--primary-soft);border-radius:16px;padding:12px;text-align:center}

.rect-list{display:flex;flex-direction:column;gap:10px}
.rect-btn{display:flex;align-items:center;gap:11px;width:100%;border:1px solid var(--card-border);background:var(--primary-soft);border-radius:18px;padding:14px 15px;cursor:pointer;font-family:inherit;color:var(--text);font-size:13.5px;text-align:left}
.rect-ico{font-size:18px;line-height:1;width:22px;text-align:center}
.rect-txt{flex:1;font-weight:600;letter-spacing:.3px}
.rect-arrow{color:var(--text-mute);font-size:16px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:13px;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
.row:last-child{border-bottom:none}
.row span{color:var(--text-sub)}
.row b{font-weight:600;text-align:right}
.calc-box{background:var(--primary-soft);border-radius:16px;padding:12px 14px;margin:6px 0 14px}
.calc-row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;color:var(--text-sub)}

.fold-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:10px;background:var(--input-bg);border:1px solid transparent;border-radius:14px;cursor:pointer;font-size:13px}
.fold-bar .fb-label{flex:1;color:var(--text);font-weight:600}
.fold-bar .fb-val{color:var(--primary);font-weight:700;font-size:12.5px}
.fold-bar .fb-arrow{color:var(--text-mute);font-size:12px;transition:.2s}
.fold-bar.open .fb-arrow{transform:rotate(180deg)}
.fold-body{padding:10px 12px 12px;background:var(--primary-soft);border-radius:14px;margin-bottom:10px}
.num-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px}
.num-pick button{border:1px solid var(--card-border);background:var(--card);color:var(--text);padding:8px 0;border-radius:9px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600}
.num-pick button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.check-line{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--input-bg);border-radius:14px;margin-bottom:10px;cursor:pointer;font-size:13px}
.check-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--text-mute);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0}
.check-box.on{background:var(--primary);border-color:var(--primary)}
.upload-wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.upload-btn{border:1px dashed var(--card-border);background:var(--input-bg);color:var(--text-sub);padding:10px 14px;border-radius:11px;font-size:12px;cursor:pointer;font-family:inherit}
.img-chip{width:52px;height:52px;border-radius:11px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;overflow:hidden}
.img-chip img{width:100%;height:100%;object-fit:cover}
.img-chip .del{position:absolute;right:-4px;top:-4px;width:16px;height:16px;border-radius:50%;background:#d9534f;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.rec-item{padding:11px 12px;border-radius:13px;margin-bottom:8px;background:var(--input-bg);border-left:3px solid transparent}
.rec-item.settled{border-left-color:#5a9e6f;background:rgba(90,158,111,.07)}
.rec-line{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.rec-title{font-size:12.5px;font-weight:600}
.rec-net{font-size:13.5px;font-weight:700;color:var(--primary)}
.rec-meta{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--text-mute);flex-wrap:wrap}
.rec-tag{font-size:9.5px;padding:3px 7px;border-radius:8px;font-weight:700}
.rec-tag.ok{background:rgba(90,158,111,.18);color:#3d7a4f}
.rec-tag.no{background:rgba(192,140,101,.18);color:var(--primary)}
.rec-note{font-size:11px;color:var(--text-sub);margin-top:5px;line-height:1.5}
.rec-imgs{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.rec-img{width:34px;height:34px;border-radius:8px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:15px;overflow:hidden}
.rec-img img{width:100%;height:100%;object-fit:cover}
.rec-del{margin-top:7px}
.audit-head{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.audit-name{font-size:13.5px;font-weight:600;margin-bottom:2px}
.audit-sub{font-size:10.5px;color:var(--text-sub)}
.tag{font-size:9.5px;padding:4px 8px;border-radius:11px;background:var(--primary-soft);color:var(--primary);font-weight:700;margin-left:auto;white-space:nowrap}
.audit-row{font-size:11.5px;color:var(--text-sub);margin-bottom:7px}
.audit-shot{background:var(--primary-soft);border-radius:12px;padding:14px;text-align:center;font-size:11px;color:var(--text-mute);margin-bottom:11px}
.audit-actions{display:flex;gap:9px}
.audit-actions .btn{flex:1}
.podium{display:flex;align-items:flex-end;gap:8px;padding:6px 0 14px}
.pod{flex:1;background:var(--primary-soft);border-radius:18px;padding:12px 6px;text-align:center}
.pod1{padding-top:26px;padding-bottom:20px}
.pod-av{font-size:22px;margin-bottom:6px}
.pod-name{font-size:12px;font-weight:600;margin-bottom:3px}
.pod-val{font-size:11px;color:var(--primary);font-weight:600}
.rank-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rank-row:last-child{border-bottom:none}
.rank-no{width:24px;font-size:13px;font-weight:700;color:var(--text-mute);text-align:center}

.banner{background:var(--primary-soft);border-radius:16px;padding:11px 14px;font-size:11.5px;color:var(--primary);margin-bottom:14px;line-height:1.6}
.banner b{font-weight:700}

.tbl th{text-align:left;color:var(--text-mute);font-weight:500;padding:8px 4px;border-bottom:1px solid var(--line);font-size:11px}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--line);color:var(--text)}
.tbl tr:last-child td{border-bottom:none}
.tbl td.r,.tbl th.r{text-align:right}
.panel{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;font-size:13.5px;font-weight:600;cursor:pointer;user-select:none}
.panel-arrow{color:var(--text-mute);transition:.2s;font-size:12px}

.modal-title{font-size:15px;font-weight:700;margin-bottom:12px;text-align:center}

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const card = (html, cls='') => `<div class="card ${cls}">${html}</div>`;

const softNote = t => `<div class="soft-note">${t}</div>`;
const field = (label, ph, val='') => `<div class="field"><div class="field-label">${label}</div><input class="input" placeholder="${ph}" value="${esc(val)}"></div>`;
const numField = (label, id, val) => `<div class="field"><div class="field-label">${label}</div><input class="input" id="${id}" type="number" value="${val}"></div>`;
const rowEl = (l, v) => `<div class="row"><span>${l}</span><b>${v}</b></div>`;

let toastTimer;
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2000);
}

function genCode(){
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const pick = () => Array.from({length:4}, ()=>c[Math.floor(Math.random()*c.length)]).join('');
  return pick() + '-' + pick();
}

function applyTheme(){
  const phone = $('#phone');
  if(phone) phone.className = 'phone' + (S.theme === 'y2k' ? ' theme-y2k' : S.theme === 'pixel' ? ' theme-pixel' : '');
}

async function login(username, password){
  S.loading = true; render();
  try{
    const { data, error } = await db.from('profiles').select('*').eq('username', username).maybeSingle();
    if(error) throw error;
    if(!data){ toast('用户名或密码错误'); return false; }
    if(data.password && data.password !== password){ toast('用户名或密码错误'); return false; }
    S.user = data;
    localStorage.setItem('uid', data.id);
    await bootUser();
    return true;
  }catch(e){ toast('登录失败：' + e.message); return false; }
  finally{ S.loading = false; }
}

async function register(username, password, nick){
  if(!username || !password || !nick){ toast('请填写完整'); return false; }
  S.loading = true; render();
  try{
    const id = crypto.randomUUID();
    const base = { id, username, nick, roles: [], current_club_id: null, active_role: 'pending', staff_roles: [] };
    let { error } = await db.from('profiles').insert({...base, password});
    if(error && /password/i.test(error.message)){
      ({ error } = await db.from('profiles').insert(base));
    }
    if(error) throw error;
    toast('注册成功，请登录');
    return true;
  }catch(e){ toast('注册失败：' + e.message); return false; }
  finally{ S.loading = false; render(); }
}

async function logout(){
  S.user = null; S.clubs = []; S.currentClub = null; S.currentRole = null;
  S.page = 'login'; S.history = [];
  localStorage.removeItem('uid');
  render();
  toast('已退出登录');
}

async function loadCurrentUser(){
  const uid = localStorage.getItem('uid');
  if(!uid) return false;
  const { data, error } = await db.from('profiles').select('*').eq('id', uid).maybeSingle();
  if(error || !data) return false;
  S.user = data;
  return await bootUser();
}

async function bootUser(){
  if(!S.user) return false;
  const roles = S.user.roles || [];
  const clubIds = roles.map(r => r.club_id).filter(Boolean);

  if(clubIds.length === 0){
    S.clubs = [];
    S.currentClub = null;
    S.currentRole = S.user.active_role || null;
    if(S.currentRole === 'pending'){
      S.page = 'pending-audit';
      S.pendingTab = 'audit';
    } else {
      S.page = 'home';
    }
    return true;
  }

  const { data: clubs } = await db.from('clubs').select('*').in('id', clubIds);
  S.clubs = clubs || [];
  const activeId = S.user.current_club_id || (S.clubs[0] && S.clubs[0].id);
  S.currentClub = S.clubs.find(c => c.id === activeId) || S.clubs[0] || null;

  const activeRole = roles.find(r => r.club_id === S.currentClub?.id);
  S.currentRole = S.user.active_role || activeRole?.role || null;

  if(S.currentClub){
    S.commission = S.currentClub.commission || {
      base: 20, tiered: [], top_bonus: 15, top_players: [], dispatch_rate: 8, direct_rate: 5
    };
  }

  S.page = 'home';
  await loadHomeData();
  return true;
}

async function loadHomeData(){
  if(!S.currentClub || !S.user) return;
  await Promise.all([loadOrders(), loadApplications()]);
  S.members = await loadMembers();
}

async function loadOrders(){
  if(!S.currentClub) return;
  const per = 10;
  const from = S.pageIdx * per;
  const { data, error } = await db
    .from('orders').select('*')
    .eq('club_id', S.currentClub.id)
    .order('created_at', { ascending: false })
    .range(from, from + per - 1);
  if(!error) S.orders = data || [];
}

async function loadApplications(){
  const { data, error } = await db
    .from('applications').select('*')
    .order('created_at', { ascending: false })
    .limit(50);
  if(!error) S.applications = data || [];
}

async function loadMembers(){
  if(!S.currentClub) return [];
  const { data, error } = await db.from('profiles').select('id,username,nick,roles,staff_roles');
  if(error) return [];
  return (data || []).filter(p => (p.roles || []).some(r => r.club_id === S.currentClub.id));
}

function go(page, params={}){
  S.history.push({page:S.page, params:S.params});
  S.page = page; S.params = params; S.pageIdx = 0; render();
}
function back(){
  const h = S.history.pop();
  if(h){ S.page = h.page; S.params = h.params; }
  else { S.page = S.user ? 'home' : 'login'; }
  S.pageIdx = 0; render();
}
function switchTab(k){
  S.history = []; S.page = k; S.pageIdx = 0;
  if(k === 'finance' || k === 'rank') loadOrders().then(()=>render());
  else render();
}

function tabsFor(role){
  if(role === 'player'){
    return [['home','主页','🏠'],['pending-hub','待审','⏳'],['finance','流水','💰'],['rank','榜单','🏆'],['settings','设置','⚙️']];
  }
  return [['home','主页','🏠'],['audit','审核','🔍'],['finance','流水','💰'],['rank','榜单','🏆'],['settings','设置','⚙️']];
}

function render(){
  applyTheme();
  const p = PAGES[S.page] || PAGES.home;
  const tb = $('#topbar');

  if(p.bare){
    tb.style.display = 'none'; tb.innerHTML = ''; tb.className = 'topbar';
  } else if(S.user && S.currentRole === 'pending'){
    tb.style.display = 'flex'; tb.className = 'pending-topbar';
    const map = {audit:'审核', standard:'标准', notice:'通知', settings:'设置'};
    tb.innerHTML = ['audit','standard','notice','settings'].map(k =>
      `<button class="pt-tab ${S.pendingTab === k ? 'on' : ''}" data-act="pending-tab" data-v="${k}">${map[k]}</button>`
    ).join('');
  } else {
    tb.style.display = 'flex'; tb.className = 'topbar';
    tb.innerHTML =
      (p.back ? `<button class="tb-back" data-act="back">‹</button>` : `<div class="tb-back ghost"></div>`) +
      `<div class="tb-title">${p.title || ''}</div>` +
      `<div class="tb-right">${p.right ? p.right() : ''}</div>`;
  }

  const app = $('#app');
  app.innerHTML = p.render();
  app.scrollTop = 0;

  const tbEl = $('#tabbar');
  if(p.bare || !S.user || !S.currentClub || S.currentRole === 'pending'){
    tbEl.style.display = 'none'; tbEl.innerHTML = '';
  } else {
    tbEl.style.display = 'flex';
    tbEl.innerHTML = tabsFor(S.currentRole).map(([k, label, icon]) => {
      const on = (S.page === k) ? 'on' : '';
      return `<button class="tab ${on}" data-act="tab" data-v="${k}"><span class="tab-ico">${icon}</span><span class="tab-txt">${label}</span></button>`;
    }).join('');
  }

  renderModal();
  if(p.after) p.after();
}

function renderModal(){
  const root = $('#modalRoot');
  if(!root) return;
  if(S.topPickerOpen){
    const q = (S.topPickerQuery || '').trim();
    const all = (S.members || []).map(m => m.nick || m.username);
    const list = q ? all.filter(n => n.indexOf(q) >= 0) : all;
    const chips = list.map(n => {
      const on = S.topPickerTemp.includes(n) ? 'on' : '';
      return `<button class="chip ${on}" data-act="toggle-top-temp" data-v="${esc(n)}">${esc(n)}</button>`;
    }).join('');
    root.innerHTML = `<div class="modal-mask" data-act="close-top-picker"><div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-title">选择本月头牌（可多选）</div>
      <input class="input" id="top-picker-search" placeholder="搜索陪玩名字" value="${esc(q)}">
      <div class="top-picker-list">${chips || '<div class="empty">暂无成员</div>'}</div>
      <div class="modal-actions"><button class="btn btn-ghost btn-block" data-act="close-top-picker">取消</button><button class="btn btn-primary btn-block" data-act="confirm-top-picker">确认（${S.topPickerTemp.length}人）</button></div>
    </div></div>`;
    return;
  }
  if(!S.modal){ root.innerHTML = ''; return; }
  root.innerHTML = `<div class="modal-mask" data-act="close-modal"><div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title">${S.modal.title}</div>
    <div class="modal-content">${S.modal.content}</div>
    <div class="modal-actions"><button class="btn btn-ghost btn-block" data-act="close-modal">我知道了</button>
    ${S.modal.action ? `<button class="btn btn-primary btn-block" data-act="${S.modal.action}">${S.modal.actionText}</button>` : ''}
    </div></div></div>`;
}

  return `<div class="rec-item ${settled?'settled':''}">
    <div class="rec-line">
      <span class="rec-title">${esc(o.type||'报备')} · ${esc(o.game||'')} ${o.hours?('· '+o.hours+'h'):''}</span>
      <span class="rec-net">¥${(o.net||0).toFixed(2)}</span>

    <div class="rec-meta">

}

      ${card(S.orders.filter(o=>o.user_id===S.user.id).slice(0,6).map(o=>recItem(o)).join('') || '<div class="empty">还没有记录，期待写下你的第一条呀。</div>')}
    `;
  },
  after(){ rpCalc(); }
};

function rpCalc(){
  const box = document.getElementById('rp-calc');
  if(!box) return;
  const gross = parseFloat(document.getElementById('rp-gross')?.value) || 0;
  const extra = S.extraVal;
  const disc = S.discountVal;
  const finalGross = +(((gross + extra) * (disc/10)).toFixed(2));
  const rate = S.commission.base || 20;
  const net = +(finalGross * (1 - rate/100)).toFixed(2);
  box.innerHTML = `
    <div class="calc-row"><span>加价</span><b>+${extra} 元</b></div>
    <div class="calc-row"><span>折扣</span><b>${disc} 折</b></div>
    <div class="calc-row"><span>最终流水</span><b>¥${finalGross.toFixed(2)}</b></div>
    <div class="calc-row"><span>抽成率</span><b>${rate}%</b></div>
    <div class="calc-row total"><span>实得 Net</span><b>¥${net.toFixed(2)}</b></div>`;
}

async function handleAction(a, d){
  switch(a){
    case 'goto': go(d.page); break;
    case 'back': back(); break;
    case 'tab': switchTab(d.v); break;
    case 'theme': S.theme = d.v; localStorage.setItem('theme', d.v); applyTheme(); render(); break;

    case 'do-login': {
      const u = document.getElementById('login-user')?.value.trim();
      const p = document.getElementById('login-pass')?.value;
      if(!u || !p){ toast('请填写用户名和密码'); break; }
      await login(u, p);
      if(S.user){ render(); toast('登录成功'); }
      break;
    }
    case 'do-register': {
      const inputs = document.querySelectorAll('#app .input');
      const u = inputs[0]?.value.trim();
      const n = inputs[1]?.value.trim();
      const p = inputs[2]?.value;
      if(await register(u, p, n)) go('login');
      break;
    }
    case 'logout': await logout(); break;

    case 'panel': S.panels[d.v] = !S.panels[d.v]; render(); break;
    case 'toggle-fold': S.folds[d.v] = !S.folds[d.v]; render(); break;
    case 'pick-num': if(d.target==='extra') S.extraVal=+d.v; else S.discountVal=+d.v; render(); break;
    case 'toggle-settled': S.orderSettled = !S.orderSettled; render(); break;

    case 'pending-tab': S.pendingTab = d.v; S.page = 'pending-' + d.v; render(); break;
    case 'player-pending-tab': S.playerPendingTab = d.v; render(); break;
    case 'audittab': S.auditTab = d.v; render(); break;
    case 'submit-pending-app': {
      const game = document.querySelectorAll('#app .input')[0]?.value;
      const skill = document.querySelectorAll('#app .input')[1]?.value;
      const wechat = document.querySelectorAll('#app .input')[2]?.value;
      const intro = document.getElementById('pa-intro')?.value;
      if(!game || !wechat){ toast('游戏和微信必填'); break; }
      const { error } = await db.from('applications').insert({
        user_id: S.user.id, game, skill, wechat_id: wechat, intro, status: 'waiting'
      });
      if(error){ toast('提交失败：'+error.message); break; }
      S.appStatus = 'waiting'; render(); toast('审核资料已提交'); 
      break;
    }
    case 'audit-take': {
      await db.from('applications').update({status:'reviewing', reviewer_id: S.user.id}).eq('id', d.v);
      await loadApplications(); render(); toast('已接单'); break;
    }
    case 'audit-pass': {
      await db.from('applications').update({status:'passed'}).eq('id', d.v);
      await loadApplications(); render(); toast('已通过'); break;
    }
    case 'audit-reject': {
      await db.from('applications').update({status:'rejected'}).eq('id', d.v);
      await loadApplications(); render(); toast('已拒绝'); break;
    }

    case 'fintab': S.finTab = d.v; render(); break;

    case 'pick-player': S.selPlayer = d.v; S.selOrders = []; render(); break;
    case 'toggle-order': {
      const i = S.selOrders.indexOf(d.v);
      if(i>=0) S.selOrders.splice(i,1); else S.selOrders.push(d.v);
      render(); break;
    }
    case 'submit-staff-report': {
      if(!S.selOrders.length){ toast('请先勾选至少一单'); break; }
      const chosen = S.orders.filter(o => S.selOrders.includes(o.id));
      const totalGross = chosen.reduce((s,o)=>s+(o.gross||0),0);
      const rate = d.v === 'direct' ? (S.commission.direct_rate||5) : (S.commission.dispatch_rate||8);
      const wage = +(totalGross * (rate/100)).toFixed(2);
      
      const { error } = await db.from('orders').insert({
        club_id: S.currentClub.id, user_id: S.user.id,
        type: d.v === 'direct' ? '直属提成' : '派单提成',
        amount: totalGross, gross: totalGross, net: wage,
        commission: 0, note: `拉了${chosen.length}单`,
        settled: false, created_at: new Date().toISOString()
      });
      if(error){ toast('拉单失败：'+error.message); break; }
      toast(`拉单成功，工资 ¥${wage}`); S.selOrders=[]; await loadOrders(); render();
      break;
    }
    case 'submit-player-report': {
      const grossInput = document.getElementById('rp-gross')?.value;
      const hoursInput = document.getElementById('rp-hours')?.value;
      const gross = parseFloat(grossInput) || 0;
      const hours = parseFloat(hoursInput) || 1;
      if(!gross){ toast('请填写流水总额'); break; }
      const note = document.getElementById('rp-note')?.value || '';
      const game = document.querySelectorAll('#app .input')[0]?.value || '';
      
      let rate = S.commission.base || 20;
      (S.commission.tiered || []).forEach(t => { 
        if(S.orders.filter(o => o.user_id === S.user.id).length >= t.count) rate -= t.reduce; 
      });
      
      const net = +(gross * (1 - rate/100)).toFixed(2);
      
      const { error } = await db.from('orders').insert({
        club_id: S.currentClub.id, user_id: S.user.id,
        type: '报备', game, hours, amount: gross, gross,
        commission: +(gross - net).toFixed(2), net,
        settled: S.orderSettled, note,
        created_at: new Date().toISOString()
      });
      if(error){ toast('提交失败：' + error.message); break; }
      toast('报备成功'); S.orderSettled=false; S.notes.rp=''; await loadOrders(); render();
      break;
    }
    case 'submit-promo': toast('外宣数据已录入'); break;
    case 'submit-fine': toast('罚款单已下发'); break;

    case 'save-nickname': {
      const nick = document.querySelectorAll('#app .input')[1]?.value;
      if(!nick){ toast('请填写昵称'); break; }
      const { error } = await db.from('profiles').update({nick}).eq('id', S.user.id);
      if(error){ toast('保存失败'); break; }
      S.user.nick = nick; toast('已保存'); render(); break;
    }
    case 'toggle-post': {
      const list = S.user.staff_roles || [];
      const i = list.indexOf(d.v);
      if(i>=0) list.splice(i,1); else list.push(d.v);
      S.user.staff_roles = list; render(); break;
    }
    case 'save-post': {
      await db.from('profiles').update({staff_roles: S.user.staff_roles}).eq('id', S.user.id);
      toast('岗位已保存'); break;
    }
    case 'switch-club': {
      if(S.clubs.length < 2){ toast('暂无其他俱乐部'); break; }
      const next = S.clubs[(S.clubs.findIndex(c=>c.id===S.currentClub.id)+1) % S.clubs.length];
      S.currentClub = next; S.user.current_club_id = next.id;
      await db.from('profiles').update({current_club_id: next.id}).eq('id', S.user.id);
      await bootUser(); render(); toast('已切换俱乐部'); break;
    }

    case 'super-login': {
      const p = document.getElementById('super-pass')?.value;
      if(p !== '846467554jxjsjsisjidbdgujwqkjsuxhv；@'){ toast('密码错误'); break; }
      S.page = 'super-console'; render(); break;
    }
    case 'gen-code': {
      S.genCodes.push({code: genCode(), used:false}); render(); toast('已生成授权码'); break;
    }
    case 'del-code': S.genCodes.splice(+d.v,1); render(); break;

    case 'close-modal': S.modal = null; render(); break;
    default: break;
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  handleAction(el.dataset.act, {
    v: el.dataset.v, page: el.dataset.page, role: el.dataset.role, target: el.dataset.target
  });
});

document.addEventListener('input', e => {
  const id = e.target.id || '';
  if(id === 'rp-gross' || id === 'rp-hours') rpCalc();
  if(id === 'all-search'){ S.allQuery = e.target.value; render(); }
  if(id === 'top-picker-search'){ S.topPickerQuery = e.target.value; renderModal(); }
});

(async function init(){
  try {
    applyTheme();
    const ok = await loadCurrentUser();
    if(!ok){ S.page = 'login'; }
    render();
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="card" style="color:#d9534f;font-size:12px;word-break:break-all;">
      <b>启动失败：</b><br>${e.message}<br>
      <small style="color:var(--text-sub)">通常是因为 CDN 未加载成功，或者网络请求被拦截。</small>
    </div>`;
  }
})();
</script>
</body>
</html>
