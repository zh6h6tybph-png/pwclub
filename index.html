<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>陪玩俱乐部</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;font-size:14px;color:var(--text);background:var(--bg);font-weight:var(--fw,400);transition:background .35s,color .35s}

/* 三套主题 */
:root[data-theme="glass"]{
  --bg:#f5f2eb; --card:rgba(255,255,255,.60); --card2:rgba(255,255,255,.40);
  --text:#3a332c; --sub:#a49a8c; --line:rgba(192,140,101,.16);
  --primary:#c08c65; --primary-ink:#fff; --danger:#e0736b; --ok:#7aa95c;
  --radius:26px; --radius-sm:15px; --shadow:0 10px 34px rgba(170,150,125,.15);
  --blur:blur(20px); --border:1px solid rgba(255,255,255,.75); --fw:400;
}
:root[data-theme="y2k"]{
  --bg:#ffe6f0; --card:#ffffff; --card2:#fff;
  --text:#111; --sub:#777; --line:#111;
  --primary:#ff5c8a; --primary-ink:#fff; --danger:#ff2d55; --ok:#00b894;
  --radius:6px; --radius-sm:4px; --shadow:6px 6px 0 #111;
  --blur:none; --border:2.5px solid #111; --fw:600;
}
:root[data-theme="pixel"]{
  --bg:#2b2118; --card:#f4e4c1; --card2:#e8d5ad;
  --text:#3b2f1e; --sub:#7a6748; --line:#6b5433;
  --primary:#7aa95c; --primary-ink:#fff; --danger:#c0563f; --ok:#5c9a3f;
  --radius:3px; --radius-sm:2px; --shadow:4px 4px 0 #1a140e;
  --blur:none; --border:3px solid #6b5433; --fw:600;
}
:root[data-theme="glass"] body{background:radial-gradient(120% 80% at 8% 0%,#fff7ea 0%,transparent 58%),radial-gradient(110% 70% at 95% 8%,#f4e9ff 0%,transparent 55%),radial-gradient(130% 90% at 50% 100%,#e9f3ff 0%,transparent 62%),#f5f2eb;background-attachment:fixed}
:root[data-theme="y2k"] body{background-color:#ffe6f0;background-image:linear-gradient(rgba(255,92,138,.26) 1px,transparent 1px),linear-gradient(90deg,rgba(255,92,138,.26) 1px,transparent 1px);background-size:22px 22px;background-attachment:fixed}
:root[data-theme="pixel"] body{background:#2b2118}

#app{max-width:520px;margin:0 auto;min-height:100vh;padding:14px 14px 96px;position:relative}
.card{background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card.tight{padding:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.t-title{font-size:15px;font-weight:600;margin:0 0 10px}
.t-sub{font-size:11px;color:var(--sub)}
.t-body{font-size:13px}
.mono{font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;font-family:inherit;font-weight:600;font-size:13px;padding:11px 16px;border-radius:var(--radius-sm);background:var(--primary);color:var(--primary-ink);box-shadow:0 6px 16px rgba(192,140,101,.28);transition:transform .12s,opacity .2s}
:root[data-theme="y2k"] .btn{border:2.5px solid #111;box-shadow:4px 4px 0 #111}
.btn:active{transform:scale(.97)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:var(--card2);color:var(--text);border:var(--border);box-shadow:none}
.btn.sm{padding:8px 12px;font-size:12px}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled,.btn.readonly{opacity:.45;pointer-events:none}
.btn-rect{display:flex;width:100%;text-align:left;justify-content:flex-start;padding:14px 18px;border-radius:8px;margin-bottom:8px}

input,textarea,select{width:100%;font-family:inherit;font-size:14px;color:var(--text);background:var(--card2);border:var(--border);border-radius:var(--radius-sm);padding:12px;outline:none;transition:.2s}
:root[data-theme="y2k"] input,:root[data-theme="y2k"] textarea,:root[data-theme="y2k"] select{border:2.5px solid #111}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
textarea{resize:vertical;min-height:76px}
label.fld{display:block;margin-bottom:10px}
label.fld>span{display:block;font-size:11px;color:var(--sub);margin-bottom:5px}
input:disabled,textarea:disabled,select:disabled{opacity:.7;background:transparent;border-color:transparent;padding-left:0;box-shadow:none}

/* 底栏 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));pointer-events:none}
.tabbar-inner{pointer-events:auto;display:flex;width:100%;max-width:500px;background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:var(--border);border-radius:22px;box-shadow:var(--shadow);padding:6px}
.tab{flex:1;text-align:center;padding:9px 4px;border-radius:16px;font-size:11px;color:var(--sub);cursor:pointer;transition:.2s}
.tab.on{background:var(--primary);color:var(--primary-ink);font-weight:700}
:root[data-theme="y2k"] .tab.on{box-shadow:3px 3px 0 #111}

/* 顶栏与徽章 */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:2px 4px}
.topbar h1{font-size:17px;margin:0;font-weight:700}
.back{font-size:20px;cursor:pointer;padding:0 8px 0 0;line-height:1}
.badge{display:inline-block;font-size:10px;padding:3px 9px;border-radius:99px;background:var(--primary);color:var(--primary-ink);font-weight:700}
.badge.gray{background:var(--card2);color:var(--sub);border:var(--border)}
.badge.ok{background:var(--ok);color:#fff}
.badge.warn{background:var(--danger);color:#fff}

/* 列表项 */
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.li:last-child{border-bottom:none}
.li-l{min-width:0;flex:1}
.li-t{font-size:13px;font-weight:600;white-space:normal;line-height:1.4}
.li-s{font-size:11px;color:var(--sub);margin-top:4px}
.li-done{background:rgba(122,169,92,.08);border-radius:8px;padding:11px 12px;margin:0 -12px;border-bottom:none;margin-bottom:8px;}
.li-unsettled{background:rgba(224,115,107,.08);border-radius:8px;padding:11px 12px;margin:0 -12px;border-bottom:none;margin-bottom:8px;}

/* 控件与折叠 */
.seg{display:flex;background:var(--card2);border:var(--border);border-radius:var(--radius-sm);padding:4px;gap:4px}
.seg>div{flex:1;text-align:center;padding:8px 4px;border-radius:calc(var(--radius-sm) - 2px);font-size:12px;color:var(--sub);cursor:pointer;transition:.2s}
.seg>div.on{background:var(--primary);color:var(--primary-ink);font-weight:700}
.long-bar{border:var(--border);border-radius:8px;background:var(--card);overflow:hidden;margin-bottom:10px}
.long-bar-h{display:flex;justify-content:space-between;padding:12px;font-size:13px;font-weight:600;cursor:pointer}
.long-bar-b{display:none;padding:12px;border-top:var(--border)}
.long-bar.open .long-bar-b{display:block}
.num-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.num-item{width:calc(20% - 6px);text-align:center;padding:8px 0;background:var(--card2);border-radius:6px;font-size:12px;cursor:pointer}
.num-item.on{background:var(--primary);color:#fff}

/* 搜索框下拉 */
.search-box{position:relative;margin-bottom:12px}
.search-list{position:absolute;top:100%;left:0;right:0;background:var(--card);border:var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);z-index:10;max-height:200px;overflow:auto;display:none}
.search-item{padding:10px 14px;cursor:pointer;border-bottom:1px dashed var(--line);font-size:13px}
.search-item:active{background:var(--card2)}

/* 弹窗与提示 */
.mask{position:fixed;inset:0;background:rgba(30,24,18,.45);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:100%;max-width:420px;max-height:82vh;overflow:auto;background:var(--card);backdrop-filter:var(--blur);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
:root[data-theme="y2k"] .modal{background:#fff}
.fab{position:fixed;right:18px;bottom:110px;z-index:60;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;background:var(--card);border:var(--border);box-shadow:var(--shadow);opacity:.55}
#toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-20px);z-index:999;background:rgba(40,32,24,.9);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--sub);font-size:12px;padding:28px 0}
.hr{height:1px;background:var(--line);margin:12px 0;border:none}
table{width:100%; border-collapse:collapse; font-size:12px; text-align:center;}
th{padding:8px 4px; text-align:center; border-bottom:1px solid var(--line); color:var(--sub); font-weight:normal;}
td{padding:10px 4px; border-bottom:1px dashed var(--line);}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
const CONFIG = {
  SUPABASE_URL: 'https://thoaduhgtghskretxfut.supabase.co',
  SUPABASE_KEY: 'sb_publishable_rM9DsjFSuDd7PmnD4LP9rQ_CdvbkrD5',
  BUCKET: 'images',
  SUPER_PASS: '846467554jxjsjsisjidbdgujwqkjsuxhv；@',
  PAGE_SIZE: 10
};

const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
const $ = s => document.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now() + Math.random().toString(36).slice(2, 8));
const n = v => (v === null || v === undefined || v === '') ? 0 : Number(v) || 0;
const r2 = v => Math.round(n(v) * 100) / 100;
const fmt = v => r2(v).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
const money = v => '¥' + fmt(v);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function ymd(d = new Date()) { const p = x => String(x).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
function hmz(ts) { if (!ts) return ''; const d = new Date(Number(ts)), p = x => String(x).padStart(2, '0'); return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function rangeOf(mode, dateStr) {
  const d = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  if (mode === 'day') { const s = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); return [s, s + 86400000]; }
  if (mode === 'week') { const dow = (d.getDay() + 6) % 7; const s = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow).getTime(); return [s, s + 7 * 86400000]; }
  return [new Date(d.getFullYear(), d.getMonth(), 1).getTime(), new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime()];
}
const genCode = (len = 6) => Array.from({ length: len }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
const genAuthCode = () => genCode(4) + '-' + genCode(4);
let toastTimer = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2200); }

const S = { me: null, club: null, role: null, roles: [], staffRoles: {}, theme: 'glass', route: 'home', seg: {}, cache: {} };
const SUPER_KEY = 'pc_super_ok';
const SESSION_KEY = 'pc_session';

// 解决历史版本JSON结构问题
function fixClubData(c) {
  if (!c) return;
  if (!Array.isArray(c.tier_settings)) {
    const old = c.tier_settings || {};
    const arr = [];
    if (n(old.tier1_count)) arr.push({ count: n(old.tier1_count), discount: n(old.tier1_discount) });
    if (n(old.tier2_count)) arr.push({ count: n(old.tier2_count), discount: n(old.tier2_discount) });
    c.tier_settings = { enabled: c.tier_enabled !== false, tiers: arr };
  }
  if (!c.reward_config) c.reward_config = { enabled: false, basis: 'net', period: 'month', tiers: { player: [], director: [], dispatcher: [] } };
  if (!c.reward_config.tiers || Array.isArray(c.reward_config.tiers)) c.reward_config.tiers = { player: [], director: [], dispatcher: [] };
  if (!c.wage_settings) c.wage_settings = { reception: { enabled: false, base: 0, hourly: 0 }, after_sale: { enabled: false, base: 0, hourly: 0, piece: 0 }, audit: { piece: 0 } };
}

const Calc = {
  tierCut(monthCount, club) {
    if (!club || !club.tier_settings || club.tier_settings.enabled === false) return 0;
    let cut = 0;
    (club.tier_settings.tiers || []).forEach(t => { if (monthCount >= n(t.count)) cut = Math.max(cut, n(t.discount)); });
    return cut;
  },
  report({ amount, tip, discount, baseRate, isStar, starBonus, monthCount, club }) {
    const unit = isStar ? n(amount) * (1 + n(starBonus) / 100) : n(amount);
    const gross = r2((unit + n(tip)) * ((n(discount) || 10) / 10));
    const cut = Calc.tierCut(monthCount, club);
    const rate = Math.max(0, n(baseRate) - cut);
    const commission = r2(gross * rate / 100);
    return { gross, rate, commission, net: r2(gross - commission), tierCut: cut, unit };
  },
  staffCut(gross, pct) { return r2(n(gross) * n(pct) / 100); },
  reward(tiers, value) {
    let best = 0;
    (tiers || []).forEach(t => { if (n(value) >= n(t.min)) best = Math.max(best, n(t.amount)); });
    return best;
  }
};
/* ==================================================================
 * 2. 数据访问 API（补全）
 * ================================================================== */
const api = {
  async login(username, password) {
    const { data, error } = await sb.from('profiles').select('*').eq('username', username).limit(1);
    if (error) throw error;
    if (!data || !data.length) throw new Error('该用户名不存在');
    if (data[0].password && data[0].password !== password) throw new Error('密码错误');
    return data[0];
  },
  async findClubByName(name) { const { data } = await sb.from('clubs').select('*').eq('name', name).limit(1); return data && data[0]; },
  async clubById(id) { if (!id) return null; const { data } = await sb.from('clubs').select('*').eq('id', id).maybeSingle(); return data; },
  async joinClub({ username, password, nick, clubName, code }) {
    const club = await api.findClubByName(clubName);
    if (!club) throw new Error('俱乐部不存在');
    let role = null, isAuditor = false;
    if (club.staff_code && club.staff_code === code) role = 'staff';
    else if (club.auditor_code && club.auditor_code === code) { role = 'staff'; isAuditor = true; }
    else if (club.code && club.code === code) role = 'pending';
    else throw new Error('绑定码不正确');
    const { data: exist } = await sb.from('profiles').select('id').eq('username', username).limit(1);
    if (exist && exist.length) throw new Error('用户名已被占用');
    const id = uid();
    const { data, error } = await sb.from('profiles').insert({
      id, username, password, nick: nick || username, role, club_id: club.id,
      roles: [{ club_id: club.id, role }], current_club_id: club.id, active_role: role,
      staff_roles: { dispatcher: false, director: false, auditor: isAuditor, promoter: false, reception: false, after_sale: false },
      theme: 'glass', created_at: Date.now()
    }).select('*').single();
    if (error) throw error;
    return data;
  },
  async createClub({ username, password, nick, clubName, authCode }) {
    const code = (authCode || '').trim().toUpperCase();
    const { data: codes } = await sb.from('auth_codes').select('*').eq('code', code).limit(1);
    if (!codes || !codes.length || codes[0].used) throw new Error('授权码无效或已使用');
    const { data: exist } = await sb.from('profiles').select('id').eq('username', username).limit(1);
    if (exist && exist.length) throw new Error('用户名已被占用');
    
    const clubId = uid();
    await sb.from('clubs').insert({ id: clubId, name: clubName, code: genCode(), staff_code: genCode(), auditor_code: genCode(), owner_id: null, created_at: Date.now() });
    const id = uid();
    const { data, error } = await sb.from('profiles').insert({
      id, username, password, nick: nick || username, role: 'admin', club_id: clubId,
      roles: [{ club_id: clubId, role: 'admin' }], current_club_id: clubId, active_role: 'admin',
      staff_roles: { dispatcher: false, director: false, auditor: false, promoter: false, reception: false, after_sale: false }, theme: 'glass', created_at: Date.now()
    }).select('*').single();
    if (error) throw error;
    await sb.from('clubs').update({ owner_id: id }).eq('id', clubId);
    await sb.from('auth_codes').update({ used: true, used_by_club_id: clubId }).eq('id', codes[0].id);
    return data;
  },
  async profile(id) { const { data } = await sb.from('profiles').select('*').eq('id', id).maybeSingle(); return data; },
  async saveProfile(patch) { await sb.from('profiles').update(patch).eq('id', S.me.id); Object.assign(S.me, patch); },
  async saveClub(patch) { await sb.from('clubs').update(patch).eq('id', S.club.id); Object.assign(S.club, patch); },
  async orders(clubId, from, to, extra) {
    let q = sb.from('orders').select('*').eq('club_id', clubId).gte('created_at', from).lt('created_at', to);
    if (extra?.userId) q = q.eq('user_id', extra.userId);
    if (extra?.dispatchUserId) q = q.eq('dispatch_user_id', extra.dispatchUserId);
    const { data } = await q.order('created_at', { ascending: false }).limit(3000);
    return data || [];
  },
  async ordersPage(clubId, page, extra) {
    let q = sb.from('orders').select('*').eq('club_id', clubId);
    if (extra?.userId) q = q.eq('user_id', extra.userId);
    const { data } = await q.order('created_at', { ascending: false }).range(page * CONFIG.PAGE_SIZE, (page + 1) * CONFIG.PAGE_SIZE - 1);
    return data || [];
  },
  async members(clubId) {
    const { data: all } = await sb.from('profiles').select('id,username,nick,active_role,roles,staff_roles').limit(1000);
    return (all || []).filter(p => p.current_club_id === clubId || (Array.isArray(p.roles) && p.roles.some(r => r.club_id === clubId)));
  },
  async stars(clubId, month) {
    let q = sb.from('monthly_stars').select('*').eq('club_id', clubId);
    if (month) q = q.eq('month', month);
    const { data } = await q;
    return data || [];
  },
  async uploadImage(file) {
    const ext = (file.name || 'img.png').split('.').pop();
    const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
    const { error } = await sb.storage.from(CONFIG.BUCKET).upload(path, file);
    if (error) throw error;
    const { data } = sb.storage.from(CONFIG.BUCKET).getPublicUrl(path);
    return data.publicUrl;
  }
};

function applyTheme() { document.documentElement.dataset.theme = S.theme || 'glass'; }
async function loadContext() {
  const p = S.me; S.roles = Array.isArray(p.roles) ? p.roles.slice() : []; S.staffRoles = p.staff_roles || {}; S.theme = p.theme || 'glass'; applyTheme();
  let clubId = p.current_club_id;
  if (!clubId || !S.roles.some(r => r.club_id === clubId)) clubId = S.roles[0]?.club_id;
  S.club = clubId ? await api.clubById(clubId) : null;
  if (S.club) fixClubData(S.club);
  const roleInClub = clubId ? S.roles.find(r => r.club_id === clubId) : null;
  S.role = (p.active_role && roleInClub && p.active_role === roleInClub.role) ? p.active_role : (roleInClub ? roleInClub.role : (p.role || 'player'));
}
function defaultRoute() { return S.role === 'pending' ? 'audit' : 'home'; }
const ROLE_NAME = { admin: '管理员', leader: '团长', vice_leader: '副团长', staff: '员工', player: '陪玩', pending: '待审陪' };

// 极简表格记录渲染组件
function renderOrderItem(o, showOp = true) {
  // 24小时判断
  const canOp = showOp && o.user_id === S.me.id && (Date.now() - o.created_at < 24 * 3600 * 1000);
  const canSettle = canOp && !o.settled;

  return `
    <div class="li ${o.settled ? 'li-done' : 'li-unsettled'}">
      <div class="li-l">
        <div class="li-t">${esc(o.title || '报备')} ${o.settled ? '<span class="badge ok" style="margin-left:4px">已结</span>' : '<span class="badge warn" style="margin-left:4px">未结</span>'}</div>
        <div class="li-s">${hmz(o.created_at)} · 流水 ${money(o.gross)} · 抽成 ${o.rate}%</div>
        ${o.note ? `<div class="t-sub" style="margin-top:4px;color:var(--text)">备注：${esc(o.note)}</div>` : ''}
        ${o.image ? `<img src="${esc(o.image)}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;margin-top:6px" />` : ''}
        ${canOp ? `
        <div class="row" style="margin-top:8px;gap:8px;">
          ${canSettle ? `<button class="btn sm ghost" data-act="settle-order" data-v="${o.id}">标记已结</button>` : ''}
          <button class="btn sm danger" data-act="del-my-order" data-v="${o.id}">删除</button>
        </div>` : ''}
      </div>

/* ==================================================================
 * 4. 渲染前预取数据
 * ================================================================== */
async function prepare() {
  if (!S.me) return;

  S.cache.clubNames = S.cache.clubNames || {};
  const roleClubIds = [...new Set((S.roles || []).map(x => x.club_id).filter(Boolean))];
  for (const id of roleClubIds) {
    if (!S.cache.clubNames[id]) {
      const cl = await api.clubById(id);
      S.cache.clubNames[id] = cl ? cl.name : '（已失效）';
    }
  }

  if (S.role === 'pending') {
    if (['audit', 'requirements', 'notice'].includes(S.route)) {
      const { data } = await sb.from('applications').select('*').eq('user_id', S.me.id);
      S.cache.myApply = data || [];
    }
    return;
  }

  const clubId = S.club && S.club.id;
  if (!clubId) return;

  const r = S.route;
  const [ms, me] = rangeOf('month');

  /* 主页与记录预取 */
  if (r === 'home' || r === 'report') {
    const lite = await api.orders(clubId, ms, me);
    const mine = lite.filter(o => o.user_id === S.me.id);
    
    // 把罚款和客诉拆分出来给陪玩端展示
    S.cache.myFines = lite.filter(o => o.user_id === S.me.id && o.type === 'fine');
    S.cache.myAppeals = lite.filter(o => o.user_id === S.me.id && o.type === 'appeal'); // 假设客诉也存在 orders 表里，类型为 appeal
    
    S.cache.summary = {
      count: mine.filter(o => o.type === 'peiwan').length,
      net: r2(mine.filter(o=>o.type==='peiwan').reduce((a, o) => a + n(o.net), 0)),
      gross: r2(mine.filter(o=>o.type==='peiwan').reduce((a, o) => a + n(o.gross), 0)),
      reward: 0,
      isStar: false
    };
    
    const ym = new Date().toISOString().slice(0, 7);
    S.cache.stars = await api.stars(clubId, ym);
    S.cache.summary.isStar = S.cache.stars.some(s => s.user_id === S.me.id);
    
    const rewardCfg = S.club.reward_config || {};
    if (rewardCfg.enabled) {
      const val = rewardCfg.basis === 'gross' ? S.cache.summary.gross : S.cache.summary.net;
      const tiers = rewardCfg.tiers?.player || [];
      S.cache.summary.reward = Calc.reward(tiers, val);
    }

    if (!S.cache.myRecords || S.cache.myRecords.length === 0) {
      S.cache.myRecords = await api.ordersPage(clubId, 0, { userId: S.me.id });
      S.cache.myPage = 0;
    }
    S.cache.monthCount = mine.filter(o => o.type === 'peiwan').length;
  }

  /* 派单、直属、罚款、外宣、售后预取 */
  if (['dispatch', 'direct', 'fine', 'finePage', 'aftersale', 'promote'].includes(r)) {
    if (!S.cache.players) {
      const members = await api.members(clubId);
      S.cache.players = members.filter(m => (m.roles || []).some(x => x.club_id === clubId && x.role === 'player'));
    }
    
    if (r === 'dispatch' || r === 'direct') {
      const all = await api.orders(clubId, ms, me);
      S.cache.mineStaff = all.filter(o => o.dispatch_user_id === S.me.id);
    }
    if (r === 'promote') {
      const all = await api.orders(clubId, ms, me);
      S.cache.minePromote = all.filter(o => o.type === 'custom' && o.user_id === S.me.id);
    }
  }

  /* 全部记录 */
  if (r === 'allrecords') {
    if (!S.cache.allRecords) {
      S.cache.allRecords = await api.ordersPage(clubId, 0);
      S.cache.allPage = 0;
    }
  }

  /* 客诉列表页面 */
  if (r === 'appealList') {
    const dim = S.seg.asDim || 'month';
    const date = S.seg.asDate || ymd();
    const [s, e] = rangeOf(dim, date);
    let q = sb.from('orders').select('*').eq('club_id', clubId).eq('type', 'appeal').gte('created_at', s).lt('created_at', e);
    if (S.seg.asFilterId) q = q.eq('user_id', S.seg.asFilterId);
    const { data } = await q.order('created_at', { ascending: false });
    
    // 关联名字
    const allMembers = await api.members(clubId);
    S.cache.appealList = (data || []).map(a => ({
      ...a,
      target_name: allMembers.find(m => m.id === a.user_id)?.nick || '未知'
    }));
  }

  /* 审核 */
  if (r === 'audit') {
    const isBoss = ['admin', 'leader', 'vice_leader'].includes(S.role);
    const isAuditor = S.staffRoles.auditor;
    if (!isBoss && !isAuditor && S.role !== 'pending') {
       S.seg.auditTab = 'mine';
       const { data } = await sb.from('applications').select('*').eq('user_id', S.me.id);
       S.cache.myApply = data || [];
       return;
    }
    const tab = S.seg.auditTab || 'hall';
    if (tab === 'hall') {
      const { data } = await sb.from('applications').select('*').eq('club_id', clubId).eq('status', 'waiting').order('created_at', { ascending: false }).limit(100);
      S.cache.hall = data || [];
    } else if (tab === 'mine') {
      const { data } = await sb.from('applications').select('*').eq('club_id', clubId).eq('auditor_id', S.me.id).eq('status', 'reviewing').order('created_at', { ascending: false }).limit(100);
      S.cache.myReview = data || [];
    }
  }

  /* 流水与榜单 */
  if (r === 'flow') {
    const dim = S.seg.flowDim || 'month';
    const date = S.seg.flowDate || ymd();
    const [s, e] = rangeOf(dim, date);
    const all = await api.orders(clubId, s, e);
    if (!S.cache.members) S.cache.members = await api.members(clubId);
    S.cache.flowStat = computeFlow(all);
  }

  if (r === 'rank') {
    const dim = S.seg.rankDim || 'month';
    const [s, e] = rangeOf(dim, ymd());
    const all = await api.orders(clubId, s, e);
    if (!S.cache.members) S.cache.members = await api.members(clubId);
    if (!S.cache.stars) S.cache.stars = await api.stars(clubId, new Date().toISOString().slice(0, 7));
    S.cache.rank = computeRank(all, S.cache.members, S.seg.rankType || 'gross');
  }

  if (r === 'settings') {
    if (!S.cache.members) S.cache.members = await api.members(clubId);
  }
}

/* ==================================================================
 * 5. 终极算账逻辑（包含极简表格 + 底薪 + 已结扣减）
 * ================================================================== */
function computeFlow(orders) {
  const st = { count: 0, gross: 0, clubCut: 0, staffCut: 0, orphanCut: 0, byType: {}, playerWages: [], staffWages: [] };
  const dispatchRate = n(S.club && S.club.dispatch_rate);
  
  const playerMap = {};
  const staffMap = {};
  const ws = S.club?.wage_settings || {};

  orders.forEach(o => {
    st.count++; 
    st.gross = r2(st.gross + n(o.gross));
    
    if (o.type === 'peiwan') st.clubCut = r2(st.clubCut + n(o.commission));
    if (o.type === 'peiwan' && !o.dispatch_user_id && n(o.gross) > 0) st.orphanCut = r2(st.orphanCut + Calc.staffCut(o.gross, dispatchRate));
    if (n(o.dispatch_amount) > 0) st.staffCut = r2(st.staffCut + n(o.dispatch_amount));

    const t = o.type || 'other';
    st.byType[t] = st.byType[t] || { count: 0, gross: 0 };
    st.byType[t].count++; st.byType[t].gross = r2(st.byType[t].gross + n(o.gross));

    // ------------------ 算陪玩工资 ------------------
    if (o.user_id && (o.type === 'peiwan' || o.type === 'fine')) {
      const uid = o.user_id;
      playerMap[uid] = playerMap[uid] || { id: uid, count: 0, gross: 0, net: 0, fine: 0, settled: 0, reward: 0 };
      
      if (o.type === 'peiwan') {
        playerMap[uid].count++;
        playerMap[uid].gross = r2(playerMap[uid].gross + n(o.gross));
        playerMap[uid].net = r2(playerMap[uid].net + n(o.net));
        if (o.settled) playerMap[uid].settled = r2(playerMap[uid].settled + n(o.net));
      } else if (o.type === 'fine') {
        playerMap[uid].fine = r2(playerMap[uid].fine + Math.abs(n(o.net)));
      }
    }

    // ------------------ 算员工工资 ------------------
    if (o.dispatch_user_id) {
      const d = o.dispatch_user_id;
      staffMap[d] = staffMap[d] || { id: d, gross: 0, dispatch: 0, external: 0, settled: 0, reward: 0, base: 0, piece: 0 };
      staffMap[d].dispatch = r2(staffMap[d].dispatch + n(o.dispatch_amount));
      if (o.settled) staffMap[d].settled = r2(staffMap[d].settled + n(o.dispatch_amount));
    }
    if (o.type === 'custom' && o.user_id) {
      const d = o.user_id;
      staffMap[d] = staffMap[d] || { id: d, gross: 0, dispatch: 0, external: 0, settled: 0, reward: 0, base: 0, piece: 0 };
      staffMap[d].external = r2(staffMap[d].external + n(o.net));
      if (o.settled) staffMap[d].settled = r2(staffMap[d].settled + n(o.net));
    }
    // 客诉处理算作售后计件 (这里假设客诉处理人是当前填表人，因为没建表，暂时存在 user_id 里)
    if (o.type === 'appeal' && o.user_id) {
      const d = o.user_id;
      staffMap[d] = staffMap[d] || { id: d, gross: 0, dispatch: 0, external: 0, settled: 0, reward: 0, base: 0, piece: 0 };
      staffMap[d].piece = r2(staffMap[d].piece + n(ws.after_sale?.piece || 0));
    }
  });

  const nameOf = id => { const m = (S.cache.members || []).find(x => x.id === id); return m ? (m.nick || m.username) : String(id).slice(0, 6); };

  // 生成极简陪玩表
  st.playerWages = Object.values(playerMap).map(w => {
    // 这里计算流水奖励（如果有开启的话）
    const rewardCfg = S.club?.reward_config;
    let reward = 0;
    if (rewardCfg?.enabled) {
      const val = rewardCfg.basis === 'gross' ? w.gross : w.net;
      reward = Calc.reward(rewardCfg.tiers?.player, val);
    }
    // 实得 = 净赚 - 罚款 - 已结
    const should = r2(w.net - w.fine - w.settled);
    return { name: nameOf(w.id), count: w.count, gross: w.gross, reward, fine: w.fine, settled: w.settled, should };
  }).sort((a, b) => b.should - a.should);

  // 生成极简员工表
  st.staffWages = Object.values(staffMap).map(w => {
    // 判断是否是接待/售后，加上底薪（这里简化为只要设置了就加，实际排班逻辑暂略）
    let base = 0;
    if (ws.reception?.enabled || ws.after_sale?.enabled) {
      base = n(ws.reception?.base) || n(ws.after_sale?.base) || 0; 
    }
    
    const totalEarned = r2(w.dispatch + w.external + w.piece + base + w.reward);
    const should = r2(totalEarned - w.settled);
    return { name: nameOf(w.id), gross: w.gross, base, reward: w.reward, settled: w.settled, should };
  }).sort((a, b) => b.should - a.should);

  return st;
}

function computeRank(orders, members, type) {
  const map = {};
  const nameOf = id => { const m = members.find(x => x.id === id); return m ? (m.nick || m.username) : String(id).slice(0, 6); };
  orders.forEach(o => {
    const id = o.user_id; if (!id) return;
    map[id] = map[id] || { id, name: nameOf(id), gross: 0, count: 0, net: 0, gift: 0, fine: 0, active: 0 };
    map[id].gross = r2(map[id].gross + n(o.gross)); map[id].net = r2(map[id].net + n(o.net)); map[id].active++;
    if (o.type === 'peiwan') map[id].count++;
    if (o.type === 'gift') map[id].gift = r2(map[id].gift + n(o.gross));
    if (o.type === 'fine') map[id].fine = r2(map[id].fine + Math.abs(n(o.net)));
  });
  let list = Object.values(map);
  const starIds = new Set((S.cache.stars || []).map(s => s.user_id));
  if (type === 'star') list = list.filter(x => starIds.has(x.id));
  const k = { gross: 'gross', count: 'count', net: 'net', gift: 'gift', fine: 'fine', active: 'active', progress: 'gross', star: 'gross' }[type] || 'gross';
  list.sort((a, b) => b[k] - a[k]);
  return list.map(x => ({ name: x.name, value: x[k] })).filter(x => x.value > 0).slice(0, 50);
}

    }

    await prepare();
    applyTheme();

    if (S.role === 'pending') { app.innerHTML = View.audit(); return; }

    const subViews = ['report', 'dispatch', 'direct', 'promote', 'fine', 'allrecords', 'reviewList', 'finePage', 'aftersale', 'appealList', 'wageSetting'];
    const titleMap = { report: '陪玩报备', dispatch: '派单报备', direct: '直属报备', promote: '外宣录入', fine: '罚款', allrecords: '全部记录', reviewList: '审核列表', finePage: '罚款管理', aftersale: '售后服务', appealList: '客诉列表', wageSetting: '职位工资设置' };

    if (subViews.includes(S.route)) {
      let body = '';
      if (S.route === 'report') body = View.report();
      else if (S.route === 'dispatch') body = View.pickPlayer('dispatch');
      else if (S.route === 'direct') body = View.pickPlayer('direct');
      else if (S.route === 'promote') body = View.promote();
      else if (S.route === 'fine' || S.route === 'finePage') body = View.fine();
      else if (S.route === 'allrecords') body = View.allRecords();
      else if (S.route === 'reviewList') body = View.reviewList();
      else if (S.route === 'aftersale') body = View.aftersale();
      else if (S.route === 'appealList') body = View.appealList();
      else if (S.route === 'wageSetting') body = View.wageSetting();
      app.innerHTML = View.shell(titleMap[S.route], body, { back: true });

      return;
    }

    let body = '', title = '';
    const r = S.route;
    if (r === 'home') { title = '主页'; body = await View.home(); }
    else if (r === 'audit') { if (S.role==='pending') { app.innerHTML = View.audit(); return; } title = '待审'; body = View.audit(); }
    else if (r === 'flow') { title = '流水'; body = View.flow(); }
    else if (r === 'rank') { title = '榜单'; body = View.rank(); }
    else if (r === 'settings') { title = '设置'; body = View.settings(); }
    else { title = '主页'; body = await View.home(); }

    app.innerHTML = View.shell(title, body);
    bindAccordion();
    bindReportCalc();
  } catch (e) {
    console.error('[render]', e);
    app.innerHTML = `<div class="card" style="text-align:center;padding:34px 20px"><div style="font-size:30px">😵</div><div class="t-title">页面加载失败</div><div class="t-sub" style="color:var(--danger)">${esc(e.message || e)}</div><button class="btn ghost" style="margin-top:16px" onclick="location.reload()">刷新重试</button></div>`;
  }
}

function bindAccordion() {
  document.querySelectorAll('.acc').forEach(el => { if (S.cache['acc_' + el.dataset.acc]) el.classList.add('open'); });
}

function bindReportCalc() {
  if (S.route !== 'report') return;
  
  const gameSel = $('#rp-game'), projSel = $('#rp-project'), durSel = $('#rp-duration');
  const updateProjects = () => {
    if (!gameSel || !projSel || !durSel) return;
    const g = (S.club.game_categories || []).find(x => (typeof x === 'string' ? x : x.name) === gameSel.value);
    projSel.innerHTML = (g?.projects || []).map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('') || '<option value="无">无</option>';
    updateDurations();
  };
  const updateDurations = () => {
    if (!projSel || !durSel) return;
    const g = (S.club.game_categories || []).find(x => (typeof x === 'string' ? x : x.name) === gameSel.value);
    const p = (g?.projects || []).find(x => x.name === projSel.value);
    durSel.innerHTML = (p?.durations || []).map(d => `<option value="${esc(d.name)}" data-price="${n(d.price)}">${esc(d.name)} - ¥${n(d.price)}</option>`).join('') || '<option value="无">无</option>';
    updateAmount();
  };
  const updateAmount = () => {
    const opt = durSel.options[durSel.selectedIndex];
    if (opt && opt.dataset.price && n(opt.dataset.price) > 0) $('#rp-amount').value = opt.dataset.price;
  };

  if (gameSel) gameSel.addEventListener('change', updateProjects);
  if (projSel) projSel.addEventListener('change', updateDurations);
  if (durSel) durSel.addEventListener('change', updateAmount);
  updateProjects();

  const calcNow = () => {
    const btn = document.querySelector('[data-act="submit-report"]');
    const isStar = Number((btn && btn.dataset.v) || 0) === 1;
    const amount = n($('#rp-amount')?.value), tip = n($('#rp-tip')?.value), discount = n($('#rp-discount')?.value) || 10;
    const baseRate = n(S.club?.commission?.peiwan) || 30;
    const starBonus = n(S.club?.star_bonus) || 15;
    const res = Calc.report({ amount, tip, discount, baseRate, isStar, starBonus, monthCount: S.cache.monthCount || 0, club: S.club });
    const netEl = $('#rp-net'); if (netEl) netEl.textContent = money(res.net);
    const summaryEl = $('#rp-extra-summary'); if (summaryEl) summaryEl.textContent = `(折扣: ${discount}折 / 加价: ${tip}元)`;
    document.querySelectorAll('.num-item').forEach(el => el.classList.toggle('on', n(el.dataset.v) === discount));
  };
  ['rp-amount', 'rp-tip', 'rp-discount'].forEach(id => { const el = document.getElementById(id); if (el) el.addEventListener('input', calcNow); });
  calcNow();
}

/* ==================================================================
 * 7. 全局交互事件 (核心功能)
 * ================================================================== */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;

  try {
    /* 登录注册与超管 */
    if (act === 'auth-mode') { S.cache.authMode = v; render(); return; }
    if (act === 'reg-tab')   { S.cache.regTab = v; render(); return; }
    if (act === 'super-open') { openSuperModal(); return; }
    
    if (act === 'do-login') {
      const u = $('#li-user').value.trim(), p = $('#li-pass').value;
      if (!u) return toast('请输入用户名');
      try {
        const prof = await api.login(u, p); S.me = prof; localStorage.setItem(SESSION_KEY, prof.id); S.cache = {};
        await loadContext(); S.route = defaultRoute(); toast('欢迎回来'); render();
      } catch (err) { toast(err.message); } return;
    }
    if (act === 'do-register') {
      const payload = { username: $('#rg-user').value.trim(), password: $('#rg-pass').value, nick: $('#rg-nick').value.trim(), clubName: $('#rg-club').value.trim(), code: $('#rg-code').value.trim() };
      if (!payload.username || !payload.password) return toast('用户名和密码必填');
      if (!payload.clubName || !payload.code) return toast('俱乐部和绑定码必填');
      try {
        let prof = v === 'join' ? await api.joinClub(payload) : await api.createClub({ ...payload, authCode: payload.code });
        S.me = prof; localStorage.setItem(SESSION_KEY, prof.id); S.cache = {};
        await loadContext(); S.route = defaultRoute(); toast('注册成功'); render();
      } catch (err) { toast(err.message); } return;
    }

    /* 导航与基础交互 */
    if (act === 'tab') { S.route = v; if(v==='audit')S.seg.auditTab=S.seg.auditTab||'hall'; render(); return; }
    if (act === 'go') { S.route = v; render(); return; }
    if (act === 'back') { S.route = ['appealList','wageSetting'].includes(S.route) ? 'settings' : (S.route==='aftersale'?'home':(S.role === 'pending' ? 'audit' : 'home')); render(); return; }
    if (act === 'seg') { S.seg[el.dataset.k] = v; render(); return; }
    if (act === 'acc') { el.closest('.acc')?.classList.toggle('open'); return; }
    if (act === 'toggle-bar') { el.closest('.long-bar')?.classList.toggle('open'); return; }
    if (act === 'set-disc') { const inp = $('#rp-discount'); if (inp) { inp.value = v; inp.dispatchEvent(new Event('input')); } return; }
    if (act === 'logout') { localStorage.removeItem(SESSION_KEY); location.reload(); return; }

    /* 切换身份/俱乐部 */
    if (act === 'switch-role') {
      const r = S.roles[Number(v)];
      if (!r) return;
      await api.saveProfile({ current_club_id: r.club_id, active_role: r.role });
      toast('身份已切换，正在刷新...'); setTimeout(() => location.reload(), 500); return;
    }
    if (act === 'join-more') {
      const cn = $('#st-join-club').value.trim(), code = $('#st-join-code').value.trim();
      if (!cn || !code) return toast('请填写完整');
      const club = await api.findClubByName(cn);
      if (!club) return toast('俱乐部不存在');
      let role = code === club.staff_code || code === club.auditor_code ? 'staff' : code === club.code ? 'pending' : null;
      if (!role) return toast('绑定码错误');
      if ((S.roles || []).some(x => x.club_id === club.id)) return toast('已在该俱乐部');
      await api.saveProfile({ roles: [...(S.roles || []), { club_id: club.id, role }] });
      toast('加入成功，正在刷新...'); setTimeout(() => location.reload(), 500); return;
    }

    /* 搜索联动 */
    if (act === 'select-player') { S.cache.pkSelectedUser = v; $('#pk-name').textContent = el.dataset.name; $('#pk-selected').style.display = 'block'; $('#pk-search-list').style.display = 'none'; $('#pk-search').value = el.dataset.name; $('#pk-load-btn').removeAttribute('disabled'); return; }
    if (act === 'select-fine-player') { S.cache.fnSelectedUser = v; $('#fn-name').textContent = el.dataset.name; $('#fn-selected').style.display = 'block'; $('#fn-search-list').style.display = 'none'; $('#fn-search').value = el.dataset.name; return; }
    if (act === 'select-as-player') { S.cache.asSelectedUser = v; $('#as-name').textContent = el.dataset.name; $('#as-selected').style.display = 'block'; $('#as-search-list').style.display = 'none'; $('#as-search').value = el.dataset.name; return; }

    /* 24小时内自主结单与删除 */
    if (act === 'settle-order') {
      if (!confirm('确定这单已经结清了吗？')) return;
      await sb.from('orders').update({ settled: true }).eq('id', v);
      toast('已标记结算'); S.cache.myRecords = null; render(); return;
    }
    if (act === 'del-my-order') {
      if (!confirm('确定删除该记录？删除后不可恢复！')) return;
      const { data: order } = await sb.from('orders').select('user_id, created_at').eq('id', v).maybeSingle();
      if (!order || order.user_id !== S.me.id) return toast('只能删除自己的单子');
      if (Date.now() - order.created_at > 24 * 3600 * 1000) return toast('已超过24小时，无法自行删除');
      
      await sb.from('orders').delete().eq('id', v);
      toast('已删除'); S.cache.myRecords = null; render(); return;
    }

    /* 报备提交 */
    if (act === 'submit-report') {
      const isStar = Number(v) === 1;
      const game = $('#rp-game').value, project = $('#rp-project').value, duration = $('#rp-duration').value;
      const title = [game, project, duration].filter(x=>x&&x!=='无').join(' · ');
      const amount = n($('#rp-amount').value), tip = n($('#rp-tip').value), discount = n($('#rp-discount').value)||10;
      const note = $('#rp-note').value.trim(), settled = $('#rp-settled').checked;
      const res = Calc.report({ amount, tip, discount, baseRate: n(S.club?.commission?.peiwan)||30, isStar, starBonus: n(S.club?.star_bonus)||15, monthCount: S.cache.monthCount||0, club: S.club });
      if (res.gross <= 0) return toast('请填写有效金额');
      
      let image = null; const f = $('#rp-image').files[0];
      if (f) { toast('上传中...'); image = await api.uploadImage(f); }
      
      await sb.from('orders').insert({ id: uid(), club_id: S.club.id, user_id: S.me.id, type: 'peiwan', title, amount, tip, discount, rate: res.rate, gross: res.gross, commission: res.commission, net: res.net, note, image, settled, created_at: Date.now() });
      toast('报备成功'); S.route = 'home'; render(); return;
    }

    /* 派单 / 直属 */
    if (act === 'load-player-orders') {
      const uidX = S.cache.pkSelectedUser;
      if (!uidX) return toast('请先选择陪玩');
      const [s, e] = rangeOf('month');
      const list = await api.orders(S.club.id, s, e, { userId: uidX });
      const rate = n(S.club[v === 'dispatch' ? 'dispatch_rate' : 'direct_rate']);
      const unclaimed = list.filter(o => o.type === 'peiwan' && !o.dispatch_user_id);

      $('#pk-list').innerHTML = unclaimed.length
        ? unclaimed.map(o => `
          <label class="li" style="cursor:pointer">
            <div class="li-l">
              <div class="li-t">${esc(o.title || '单子')}</div>
              <div class="li-s">${hmz(o.created_at)} · 总价 ${money(o.gross)} · 抽成 ${money(Calc.staffCut(o.gross, rate))}</div>
            </div>
            <input type="checkbox" class="pk-chk" value="${o.id}" data-gross="${n(o.gross)}" style="width:20px;height:20px;flex:0 0 auto">
          </label>`).join('') + `
          <div class="hr"></div>
          <div class="between"><span class="t-sub">已选抽成合计</span><span class="mono big" id="pk-sum">¥0</span></div>
          <button class="btn block" style="margin-top:10px" data-act="submit-staff-orders" data-v="${v}" data-rate="${rate}">确认认领</button>`
        : '<div class="empty">该陪玩本月暂无可认领的单子</div>';

      document.querySelectorAll('.pk-chk').forEach(chk => {
        chk.addEventListener('change', () => {
          let sum = 0; document.querySelectorAll('.pk-chk:checked').forEach(x => { sum += Calc.staffCut(x.dataset.gross, rate); });
          const el2 = $('#pk-sum'); if (el2) el2.textContent = money(sum);
        });
      });
      return;
    }

    if (act === 'submit-staff-orders') {
      const rate = n(el.dataset.rate);
      const ids = [...document.querySelectorAll('.pk-chk:checked')].map(x => x.value);
      if (!ids.length) return toast('请先勾选单子');
      let total = 0, okCount = 0;
      for (const oid of ids) {
        const { data: od } = await sb.from('orders').select('id,gross,dispatch_user_id').eq('id', oid).maybeSingle();
        if (!od || od.dispatch_user_id) continue;
        const amt = Calc.staffCut(od.gross, rate);
        const { error } = await sb.from('orders').update({ dispatch_user_id: S.me.id, dispatch_amount: amt }).eq('id', oid).is('dispatch_user_id', null);
        if (!error) { total += amt; okCount++; }
      }
      toast(`认领 ${okCount} 单，抽成 ${money(total)}`); S.route = 'home'; render(); return;
    }

    /* 外宣提交 (带照片) */
    if (act === 'submit-promote') {
      const sel = $('#pm-tier'), tierName = sel.options[sel.selectedIndex].text, amt = n(sel.options[sel.selectedIndex].dataset.price);
      const detail = $('#pm-detail').value.trim();
      if (!detail) return toast('请填写数据详情');
      let image = null; const f = $('#pm-image').files[0];
      if (f) { toast('上传截图...'); image = await api.uploadImage(f); }
      
      await sb.from('orders').insert({ id: uid(), club_id: S.club.id, user_id: S.me.id, type: 'custom', title: tierName, amount: amt, tip: 0, discount: 10, rate: 0, gross: amt, commission: 0, net: amt, note: detail, image, settled: false, created_at: Date.now() });
      toast('外宣已提交'); S.route = 'home'; render(); return;
    }

    /* 售后客诉提交 */
    if (act === 'submit-aftersale') {
      const uidX = S.cache.asSelectedUser, boss = $('#as-boss').value.trim(), type = $('#as-type').value;
      const amount = n($('#as-amount').value), result = $('#as-result').value.trim(), fine = n($('#as-fine').value);
      if (!uidX) return toast('请选择被诉陪玩');
      if (!boss || !result) return toast('请填写完整客诉信息');
      
      let image = null; const f = $('#as-image').files[0];
      if (f) { toast('上传凭证...'); image = await api.uploadImage(f); }
      
      await sb.from('orders').insert({ 
        id: uid(), club_id: S.club.id, user_id: uidX, type: 'appeal', 
        title: `客诉:${type}`, amount, tip: 0, discount: 10, rate: 0, 
        gross: amount, commission: 0, net: -fine, 
        note: `老板:${boss} | 结果:${result}`, image, settled: false, created_at: Date.now() 
      });
      
      // 如果产生罚款，额外记一条罚款单
      if (fine > 0) {
        await sb.from('orders').insert({ id: uid(), club_id: S.club.id, user_id: uidX, type: 'fine', title: '客诉罚款', amount: fine, tip: 0, discount: 10, rate: 0, gross: fine, commission: 0, net: -fine, note: result, image: null, settled: false, created_at: Date.now() });
      }
      
      toast('客诉已处理提交'); S.route = 'home'; render(); return;
    }

    /* 罚款下发 */
    if (act === 'submit-fine') {
      const uidX = S.cache.fnSelectedUser, amt = n($('#fn-amount').value), note = $('#fn-note').value.trim();
      if (!uidX) return toast('请选择陪玩'); if (amt <= 0) return toast('请输入金额'); if (!note) return toast('请填写原因');
      await sb.from('orders').insert({ id: uid(), club_id: S.club.id, user_id: uidX, type: 'fine', title: '罚款：' + note, amount: amt, tip: 0, discount: 10, rate: 0, gross: amt, commission: 0, net: -amt, note, image: null, settled: false, created_at: Date.now() });
      toast('罚款已下发'); S.route = 'home'; render(); return;
    }

    /* 审核动作 */
    if (act === 'claim') { await sb.from('applications').update({ status: 'reviewing', auditor_id: S.me.id }).eq('id', v).eq('status', 'waiting'); toast('已接单'); S.cache.hall = null; render(); return; }
    if (act === 'pass') {
      const { data: app } = await sb.from('applications').select('*').eq('id', v).maybeSingle();
      if (!app) return;
      await sb.from('applications').update({ status: 'passed' }).eq('id', v);
      const { data: prof } = await sb.from('profiles').select('*').eq('id', app.user_id).maybeSingle();
      if (prof) {
        const roles = (prof.roles || []).map(r => r.club_id === app.club_id ? { ...r, role: 'player' } : r);
        if (!roles.some(r => r.club_id === app.club_id)) roles.push({ club_id: app.club_id, role: 'player' });
        await sb.from('profiles').update({ roles, active_role: prof.current_club_id === app.club_id ? 'player' : prof.active_role }).eq('id', app.user_id);
      }
      showModal(`<div class="t-title" style="text-align:center">✅ 审核已通过</div><div class="t-body" style="margin:10px 0;text-align:center;white-space:pre-wrap">${esc(S.club.pending_popup || '请将以下【陪玩绑定码】发送给该用户')}</div><div class="card tight mono" style="font-size:22px;text-align:center;padding:18px">${esc(S.club.code)}</div><div class="grid2" style="margin-top:12px"><button class="btn ghost" data-act="modal-close">关闭</button><button class="btn" data-act="copy" data-v="${esc(S.club.code)}">复制绑定码</button></div>`);
      S.cache.hall = null; render(); return;
    }
    if (act === 'reject') { await sb.from('applications').update({ status: 'rejected' }).eq('id', v); toast('已拒绝'); S.cache.hall = null; render(); return; }
    
    if (act === 'submit-apply') {
      const game = $('#ap-game').value, wechat = $('#ap-wechat').value.trim();
      if (!game || !wechat) return toast('游戏和微信号必填');
      let image = null; const f = $('#ap-image').files[0];
      if (f) { toast('上传中...'); image = await api.uploadImage(f); }
      await sb.from('applications').insert({ id: uid(), club_id: S.club.id, user_id: S.me.id, username: S.me.nick || S.me.username, game, skill: $('#ap-skill').value.trim(), wechat_id: wechat, content: $('#ap-content').value.trim(), image, status: 'waiting', auditor_id: null, created_at: Date.now() });
      toast('已提交，等待审核'); S.cache.myApply = null; render(); return;
    }
    if (act === 'redeem-code') {
      const code = $('#nt-code').value.trim();
      if (!S.club || code !== S.club.code) return toast('绑定码不正确');
      const roles = (S.roles || []).map(r => r.club_id === S.club.id ? { ...r, role: 'player' } : r);
      await api.saveProfile({ roles, active_role: 'player' });
      toast('🎉 解锁成功，正在刷新...'); setTimeout(() => location.reload(), 500); return;
    }

    /* 设置保存 */
    if (act === 'save-nick') { await api.saveProfile({ nick: $('#st-nick').value.trim() }); toast('昵称已保存'); render(); return; }
    if (act === 'save-pass') { const p = $('#st-pass').value; if (!p) return toast('不能为空'); await api.saveProfile({ password: p }); toast('密码已修改'); render(); return; }
    if (act === 'save-staff') { const sr={}; ['dispatcher','director','auditor','promoter','reception','after_sale'].forEach(k=>sr[k]=!!$('#sr-'+k)?.checked); S.staffRoles=sr; await api.saveProfile({staff_roles:sr}); toast('岗位已保存'); render(); return; }
    if (act === 'save-club-name') { await api.saveClub({ name: $('#cf-name').value.trim() }); toast('名称已保存'); render(); return; }
    if (act === 'theme') { S.theme=v; applyTheme(); await api.saveProfile({theme:v}); render(); return; }

    /* 职位工资设置保存 */
    if (act === 'save-biz') {
      const tiers = [...document.querySelectorAll('#tier-list .row')].map(r => ({count:n(r.querySelector('.tier-count').value), discount:n(r.querySelector('.tier-discount').value)}));
      await api.saveClub({ commission: { ...S.club.commission, peiwan: n($('#cf-rate').value) }, dispatch_rate: n($('#cf-dispatch').value), direct_rate: n($('#cf-direct').value), star_bonus: n($('#cf-star').value), tier_settings: { enabled: $('#cf-tier-on').checked, tiers } });
      toast('抽成配置已保存'); render(); return;
    }
    if (act === 'save-ws-rec') {
      const ws = S.club.wage_settings || {};
      ws.reception = { enabled: $('#ws-rec-on').checked, base: n($('#ws-rec-base').value), hourly: n($('#ws-rec-hourly').value) };
      await api.saveClub({ wage_settings: ws }); toast('接待设置已保存'); render(); return;
    }
    if (act === 'save-ws-as') {
      const ws = S.club.wage_settings || {};
      ws.after_sale = { enabled: $('#ws-as-on').checked, base: n($('#ws-as-base').value), hourly: n($('#ws-as-hourly').value), piece: n($('#ws-as-piece').value) };
      await api.saveClub({ wage_settings: ws }); toast('售后设置已保存'); render(); return;
    }
    if (act === 'save-ws-audit') {
      const ws = S.club.wage_settings || {};
      ws.audit = { piece: n($('#ws-audit-piece').value) };
      await api.saveClub({ wage_settings: ws }); toast('审核设置已保存'); render(); return;
    }

    /* 客诉导出与筛选 */
    if (act === 'filter-as') {
      S.seg.asFilterId = $('#as-filter').value;
      S.cache.appealList = null; render(); return;
    }
    if (act === 'export-appeals') {
      const list = S.cache.appealList || [];
      if (!list.length) return toast('暂无数据可导出');
      const rows = list.map(a => [hmz(a.created_at), a.target_name, a.title, a.note, a.net]);
      exportExcel('客诉记录', ['时间','被诉人','类型','处理详情','罚款'], rows);
      return;
    }

    /* 超管交互 */
    if (act === 'super-verify') {
      const cleanStr = s => s.replace(/\s/g, ''), normalize = s => s.replace(/[；;]/g, ';').replace(/＠/g, '@').toLowerCase();
      if (normalize(cleanStr($('#super-pass').value)) !== normalize(cleanStr(CONFIG.SUPER_PASS))) return alert('密码错误！');
      sessionStorage.setItem(SUPER_KEY, '1'); localStorage.removeItem(SESSION_KEY);
      S.me = null; S.club = null; S.roles = []; S.role = null; S.route = 'home';
      closeModal(); S.cache.superClubs = []; S.cache.superCodes = []; render();
      loadSuperData().then(() => render()).catch(err => alert('进入超管，但拉取数据失败：' + err.message));
      return;
    }
    if (act === 'gen-auth') { const code = genAuthCode(); await sb.from('auth_codes').insert({ id: uid(), code, used: false, created_at: Date.now() }); alert('生成: ' + code); await loadSuperData(); render(); return; }
    if (act === 'super-exit') { sessionStorage.removeItem(SUPER_KEY); location.reload(); return; }
    if (act === 'super-del-club') { if (!confirm('彻底抹除该俱乐部，确定？')) return; await sb.from('orders').delete().eq('club_id', v); await sb.from('applications').delete().eq('club_id', v); await sb.from('monthly_stars').delete().eq('club_id', v); await sb.from('profiles').delete().eq('current_club_id', v); await sb.from('clubs').delete().eq('id', v); toast('已删除'); await loadSuperData(); render(); return; }
    if (act === 'super-del-code') { await sb.from('auth_codes').delete().eq('id', v); await loadSuperData(); render(); return; }

    if (act === 'modal-close') { closeModal(); return; }
    if (act === 'copy') { navigator.clipboard.writeText(v); toast('已复制'); return; }
    if (act === 'export') {
      const st = S.cache.flowStat; if (!st) return toast('暂无数据');
      if (v === 'detail') exportExcel('工资明细', ['成员', '流水', '奖励', '罚款/底薪', '已结', '实得'], st.playerWages.map(w=>[w.name, w.gross, w.reward, w.fine, w.settled, w.should]));
      else exportExcel('工资汇总', ['陪玩应发总计', '员工应发总计'], [[st.playerWages.reduce((a,b)=>a+b.should,0), st.staffWages.reduce((a,b)=>a+b.should,0)]]);
      return;
    }

  } catch (err) {
    console.error(err); toast(err.message || '操作失败');
  }
});

/* ==================================================================
 * 8. 输入与改变事件
 * ================================================================== */
document.addEventListener('input', (e) => {
  const el = e.target;
  if (['pk-search', 'fn-search', 'as-search', 'star-search'].includes(el.id)) {
    const kw = el.value.trim().toLowerCase();
    const list = el.nextElementSibling;
    if (list) {
      list.style.display = 'block';
      [...list.children].forEach(c => { c.style.display = c.textContent.toLowerCase().includes(kw) ? 'block' : 'none'; });
    }
  }
});

document.addEventListener('change', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'sel-req-game') { S.seg.reqGame = el.value; render(); return; }
  if (act === 'flow-date') { S.seg.flowDate = el.value; S.cache.flowStat = null; render(); return; }
  if (act === 'as-date') { S.seg.asDate = el.value; S.cache.appealList = null; render(); return; }
});

/* ==================================================================
 * 9. 弹窗与工具函数
 * ================================================================== */
function showModal(html) {
  closeModal();
  const m = document.createElement('div'); m.className = 'mask'; m.id = 'modal-mask';
  m.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(m);
  m.addEventListener('click', ev => { if (ev.target === m) closeModal(); });
}
function closeModal() { document.getElementById('modal-mask')?.remove(); }

function openSuperModal() {
  showModal(`<div class="t-title">🔒 最高管理员</div><label class="fld"><span>密码</span><input id="super-pass" type="password"></label><div class="grid2" style="margin-top:14px"><button class="btn ghost" data-act="modal-close">取消</button><button class="btn" data-act="super-verify">进入</button></div>`);
}

async function loadSuperData() {
  const { data: clubs } = await sb.from('clubs').select('id,name,code,staff_code,auditor_code,created_at').order('created_at', { ascending: false }).limit(500);
  const { data: codes } = await sb.from('auth_codes').select('*').order('created_at', { ascending: false }).limit(500);
  S.cache.superClubs = clubs || [];
  S.cache.superCodes = codes || [];
}

function exportExcel(name, head, rows) {
  const e2 = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body><table border="1">`;
  html += '<tr>' + head.map(h => `<th>${e2(h)}</th>`).join('') + '</tr>';
  rows.forEach(r => html += '<tr>' + r.map(c => `<td>${e2(c)}</td>`).join('') + '</tr>');
  html += '</table></body></html>';
  
  const blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${name}_${ymd()}.xls`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 600);
  toast('已导出');
}

/* ==================================================================
 * 10. 启动
 * ================================================================== */
async function init() {
  applyTheme();
  try {
    if (sessionStorage.getItem(SUPER_KEY) === '1' && !localStorage.getItem(SESSION_KEY)) {
      await loadSuperData(); render(); return;
    }
    const sid = localStorage.getItem(SESSION_KEY);
    if (sid) {
      const prof = await api.profile(sid);
      if (prof) { S.me = prof; await loadContext(); S.route = defaultRoute(); }
      else localStorage.removeItem(SESSION_KEY);
    }
  } catch (e) { console.error('[init]', e); }
  render();
}

init();

</script>
