<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>陪玩俱乐部</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;font-size:14px;color:var(--text);background:var(--bg);font-weight:var(--fw,400);transition:background .35s,color .35s}

:root[data-theme="glass"]{
  --bg:#f5f2eb; --card:rgba(255,255,255,.60); --card2:rgba(255,255,255,.40);
  --text:#3a332c; --sub:#a49a8c; --line:rgba(192,140,101,.16);
  --primary:#c08c65; --primary-ink:#fff; --danger:#e0736b; --ok:#7aa95c;
  --radius:26px; --radius-sm:15px; --shadow:0 10px 34px rgba(170,150,125,.15);
  --blur:blur(20px); --border:1px solid rgba(255,255,255,.75); --fw:400;
}
:root[data-theme="y2k"]{
  --bg:#ffe6f0; --card:#ffffff; --card2:#fff;
  --text:#111; --sub:#777; --line:#111;
  --primary:#ff5c8a; --primary-ink:#fff; --danger:#ff2d55; --ok:#00b894;
  --radius:6px; --radius-sm:4px; --shadow:6px 6px 0 #111;
  --blur:none; --border:2.5px solid #111; --fw:600;
}
:root[data-theme="pixel"]{
  --bg:#2b2118; --card:#f4e4c1; --card2:#e8d5ad;
  --text:#3b2f1e; --sub:#7a6748; --line:#6b5433;
  --primary:#7aa95c; --primary-ink:#fff; --danger:#c0563f; --ok:#5c9a3f;
  --radius:3px; --radius-sm:2px; --shadow:4px 4px 0 #1a140e;
  --blur:none; --border:3px solid #6b5433; --fw:600;
}
:root[data-theme="glass"] body{background:
  radial-gradient(120% 80% at 8% 0%,#fff7ea 0%,transparent 58%),
  radial-gradient(110% 70% at 95% 8%,#f4e9ff 0%,transparent 55%),
  radial-gradient(130% 90% at 50% 100%,#e9f3ff 0%,transparent 62%),#f5f2eb;background-attachment:fixed}
:root[data-theme="y2k"] body{background-color:#ffe6f0;
  background-image:linear-gradient(rgba(255,92,138,.26) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,92,138,.26) 1px,transparent 1px);
  background-size:22px 22px;background-attachment:fixed}
:root[data-theme="pixel"] body{background:#2b2118}

#app{max-width:520px;margin:0 auto;min-height:100vh;padding:14px 14px 96px;position:relative}
.card{background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card.tight{padding:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.t-title{font-size:15px;font-weight:600;margin:0 0 10px}
.t-sub{font-size:11px;color:var(--sub)}
.t-body{font-size:13px}
.muted{color:var(--sub)}
.big{font-size:20px;font-weight:700;letter-spacing:-.5px}
.mono{font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:none;cursor:pointer;font-family:inherit;font-weight:600;font-size:13px;
  padding:11px 16px;border-radius:var(--radius-sm);background:var(--primary);color:var(--primary-ink);
  box-shadow:0 6px 16px rgba(192,140,101,.28);transition:transform .12s,opacity .2s}
:root[data-theme="y2k"] .btn{border:2.5px solid #111;box-shadow:4px 4px 0 #111}
.btn:active{transform:scale(.97)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:var(--card2);color:var(--text);border:var(--border);box-shadow:none}
.btn.sm{padding:8px 12px;font-size:12px}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.45;pointer-events:none}

input,textarea,select{width:100%;font-family:inherit;font-size:14px;color:var(--text);
  background:var(--card2);border:var(--border);border-radius:var(--radius-sm);padding:12px;outline:none}
:root[data-theme="y2k"] input,:root[data-theme="y2k"] textarea,:root[data-theme="y2k"] select{border:2.5px solid #111}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
textarea{resize:vertical;min-height:76px}
label.fld{display:block;margin-bottom:10px}
label.fld>span{display:block;font-size:11px;color:var(--sub);margin-bottom:5px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));pointer-events:none}
.tabbar-inner{pointer-events:auto;display:flex;width:100%;max-width:500px;
  background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:var(--border);border-radius:22px;box-shadow:var(--shadow);padding:6px}
.tab{flex:1;text-align:center;padding:9px 4px;border-radius:16px;font-size:11px;color:var(--sub);cursor:pointer;transition:.2s}
.tab.on{background:var(--primary);color:var(--primary-ink);font-weight:700}
:root[data-theme="y2k"] .tab.on{box-shadow:3px 3px 0 #111}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:2px 4px}
.topbar h1{font-size:17px;margin:0;font-weight:700}
.back{font-size:20px;cursor:pointer;padding:0 8px 0 0;line-height:1}

.badge{display:inline-block;font-size:10px;padding:3px 9px;border-radius:99px;
  background:var(--primary);color:var(--primary-ink);font-weight:700}
.badge.gray{background:var(--card2);color:var(--sub);border:var(--border)}
.badge.ok{background:var(--ok);color:#fff}
.badge.warn{background:var(--danger);color:#fff}

.li{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 0;border-bottom:1px dashed var(--line)}
.li:last-child{border-bottom:none}
.li-l{min-width:0;flex:1}
.li-t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-s{font-size:11px;color:var(--sub);margin-top:2px}

.seg{display:flex;background:var(--card2);border:var(--border);border-radius:var(--radius-sm);padding:4px;gap:4px}
.seg>div{flex:1;text-align:center;padding:8px 4px;border-radius:calc(var(--radius-sm) - 2px);
  font-size:12px;color:var(--sub);cursor:pointer;transition:.2s}
.seg>div.on{background:var(--primary);color:var(--primary-ink);font-weight:700}

.acc{border:var(--border);border-radius:var(--radius-sm);background:var(--card2);margin-bottom:10px;overflow:hidden}
.acc-h{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer;font-size:13px;font-weight:600}
.acc-b{display:none;padding:0 14px 14px}
.acc.open .acc-b{display:block}
.acc.open .acc-h{color:var(--primary)}

.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:14px 0 6px}
.pod{flex:1;text-align:center}
.pod .bar{border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:var(--card2);
  border:var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 4px;font-size:11px;overflow:hidden}
.pod.p1 .bar{height:96px;background:linear-gradient(180deg,rgba(255,215,120,.55),var(--card2))}
.pod.p2 .bar{height:74px}
.pod.p3 .bar{height:58px}
.pod .nm{font-size:11px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .vl{font-size:11px;color:var(--sub)}

.mask{position:fixed;inset:0;background:rgba(30,24,18,.45);backdrop-filter:blur(4px);
  z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:100%;max-width:420px;max-height:82vh;overflow:auto;background:var(--card);
  backdrop-filter:var(--blur);border:var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px}
:root[data-theme="y2k"] .modal{background:#fff}

.fab{position:fixed;right:18px;bottom:110px;z-index:60;width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;
  background:var(--card);border:var(--border);box-shadow:var(--shadow);opacity:.55}
.fab:hover{opacity:1}

#toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-20px);z-index:999;
  background:rgba(40,32,24,.9);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;
  opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

.empty{text-align:center;color:var(--sub);font-size:12px;padding:28px 0}
.hr{height:1px;background:var(--line);margin:12px 0;border:none}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll-x::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
/* ==================================================================
 * 0. 配置（已为你填好专属地址和 Key）
 * ================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://thoaduhgtghskretxfut.supabase.co',
  SUPABASE_KEY: 'sb_publishable_rM9DsjFSuDd7PmnD4LP9rQ_CdvbkrD5',
  BUCKET: 'images',
  SUPER_PASS: '846467554jxjsjsisjidbdgujwqkjsuxhv；@',
  PAGE_SIZE: 10
};

const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

/* ==================================================================
 * 1. 工具
 * ================================================================== */
const $  = s => document.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
                    : 'id' + Date.now() + Math.random().toString(36).slice(2, 8));
const n  = v => (v === null || v === undefined || v === '') ? 0 : Number(v) || 0;
const r2 = v => Math.round(n(v) * 100) / 100;
const fmt = v => r2(v).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
const money = v => '¥' + fmt(v);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function ymd(d = new Date()) {
  const p = x => String(x).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function hmz(ts) {
  if (!ts) return '';
  const d = new Date(Number(ts)), p = x => String(x).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function rangeOf(mode, dateStr) {
  const d = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  if (mode === 'day') {
    const s = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    return [s, s + 86400000];
  }
  if (mode === 'week') {
    const dow = (d.getDay() + 6) % 7;
    const s = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow).getTime();
    return [s, s + 7 * 86400000];
  }
  const s = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
  const e = new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime();
  return [s, e];
}
const genCode = (len = 6) =>
  Array.from({ length: len }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[
    Math.floor(Math.random() * 32)]).join('');
const genAuthCode = () => genCode(4) + '-' + genCode(4);

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2200);
}
function confirmBox(msg) { return window.confirm(msg); }

const LITE = 'id,club_id,user_id,type,amount,tip,discount,rate,gross,commission,net,settled,dispatch_user_id,dispatch_amount,created_at,title';

/* ==================================================================
 * 2. 全局状态
 * ================================================================== */
const S = {
  me: null, club: null, role: null, roles: [], staffRoles: {},
  theme: 'glass', route: 'home', seg: {}, cache: {}
};
const SUPER_KEY = 'pc_super_ok';
const SESSION_KEY = 'pc_session';

/* ==================================================================
 * 3. 算账核心
 * ================================================================== */
const Calc = {
  tierCut(monthCount, club) {
    if (!club || club.tier_enabled === false) return 0;
    const t = club.tier_settings || {};
    if (n(t.tier2_count) > 0 && monthCount >= n(t.tier2_count)) return n(t.tier2_discount);
    if (n(t.tier1_count) > 0 && monthCount >= n(t.tier1_count)) return n(t.tier1_discount);
    return 0;
  },
  report({ amount, tip, discount, baseRate, isStar, starBonus, monthCount, club }) {
    const unit  = isStar ? n(amount) * (1 + n(starBonus) / 100) : n(amount);
    const gross = r2((unit + n(tip)) * ((n(discount) || 10) / 10));
    const cut   = Calc.tierCut(monthCount, club);
    const rate  = Math.max(0, n(baseRate) - cut);
    const commission = r2(gross * rate / 100);
    return { gross, rate, commission, net: r2(gross - commission), tierCut: cut, unit };
  },
  staffCut(gross, pct) { return r2(n(gross) * n(pct) / 100); },
  reward(tiers, value) {
    let best = 0;
    (tiers || []).forEach(t => { if (n(value) >= n(t.min)) best = Math.max(best, n(t.amount)); });
    return best;
  }
};

/* ==================================================================
 * 4. 数据访问
 * ================================================================== */
const api = {
  async login(username, password) {
    const { data, error } = await sb.from('profiles').select('*').eq('username', username).limit(1);
    if (error) throw error;
    if (!data || !data.length) throw new Error('该用户名不存在');
    const p = data[0];
    if (p.password && p.password !== password) throw new Error('密码错误');
    return p;
  },
  async findClubByName(name) {
    const { data, error } = await sb.from('clubs').select('*').eq('name', name).limit(1);
    if (error) throw error;
    return data && data[0];
  },
  async clubById(id) {
    if (!id) return null;
    const { data } = await sb.from('clubs').select('*').eq('id', id).maybeSingle();
    return data;
  },
  async joinClub({ username, password, nick, clubName, code }) {
    const club = await api.findClubByName(clubName);
    if (!club) throw new Error('俱乐部不存在');
    let role = null, isAuditor = false;
    if (club.staff_code && club.staff_code === code) role = 'staff';
    else if (club.auditor_code && club.auditor_code === code) { role = 'staff'; isAuditor = true; }
    else if (club.code && club.code === code) role = 'pending';
    else throw new Error('绑定码不正确');

    const { data: exist } = await sb.from('profiles').select('id').eq('username', username).limit(1);
    if (exist && exist.length) throw new Error('用户名已被占用');

    const id = uid();
    const roles = [{ club_id: club.id, role }];
    const staff_roles = role === 'staff'
      ? { dispatcher: false, director: false, auditor: isAuditor, promoter: false }
      : { dispatcher: false, director: false, auditor: false, promoter: false };

    const { data, error } = await sb.from('profiles').insert({
      id, username, password, nick: nick || username,
      role, club_id: club.id, roles,
      current_club_id: club.id, active_role: role,
      staff_roles, theme: 'glass', created_at: Date.now()
    }).select('*').single();
    if (error) throw error;
    return data;
  },
  async createClub({ username, password, nick, clubName, authCode }) {
    const code = (authCode || '').trim().toUpperCase();
    const { data: codes, error: ce } = await sb.from('auth_codes').select('*').eq('code', code).limit(1);
    if (ce) throw ce;
    if (!codes || !codes.length) throw new Error('授权码不存在');
    if (codes[0].used) throw new Error('该授权码已被使用');

    const { data: exist } = await sb.from('profiles').select('id').eq('username', username).limit(1);
    if (exist && exist.length) throw new Error('用户名已被占用');

    const clubId = uid();
    const { error: e1 } = await sb.from('clubs').insert({
      id: clubId, name: clubName, code: genCode(),
      staff_code: genCode(), auditor_code: genCode(),
      owner_id: null, created_at: Date.now()
    });
    if (e1) throw e1;

    const id = uid();
    const roles = [{ club_id: clubId, role: 'admin' }];
    const { data, error } = await sb.from('profiles').insert({
      id, username, password, nick: nick || username,
      role: 'admin', club_id: clubId, roles,
      current_club_id: clubId, active_role: 'admin',
      staff_roles: { dispatcher: false, director: false, auditor: false, promoter: false },
      theme: 'glass', created_at: Date.now()
    }).select('*').single();
    if (error) throw error;

    await sb.from('clubs').update({ owner_id: id }).eq('id', clubId);
    await sb.from('auth_codes').update({ used: true, used_by_club_id: clubId }).eq('id', codes[0].id);
    return data;
  },
  async profile(id) {
    const { data } = await sb.from('profiles').select('*').eq('id', id).maybeSingle();
    return data;
  },
  async saveProfile(patch) {
    const { error } = await sb.from('profiles').update(patch).eq('id', S.me.id);
    if (error) throw error;
    Object.assign(S.me, patch);
  },
  async saveClub(patch) {
    const { error } = await sb.from('clubs').update(patch).eq('id', S.club.id);
    if (error) throw error;
    Object.assign(S.club, patch);
  },
  async monthCount(userId) {
    const [s, e] = rangeOf('month');
    const { count } = await sb.from('orders').select('id', { count: 'exact', head: true })
      .eq('user_id', userId).eq('type', 'peiwan')
      .gte('created_at', s).lt('created_at', e);
    return count || 0;
  },
  async orders(clubId, from, to, extra) {
    let q = sb.from('orders').select(LITE).eq('club_id', clubId)
      .gte('created_at', from).lt('created_at', to);
    if (extra && extra.userId) q = q.eq('user_id', extra.userId);
    if (extra && extra.dispatchUserId) q = q.eq('dispatch_user_id', extra.dispatchUserId);
    const { data, error } = await q.order('created_at', { ascending: false }).limit(2000);
    if (error) throw error;
    return data || [];
  },
  async ordersPage(clubId, page, extra) {
    const from = page * CONFIG.PAGE_SIZE;
    let q = sb.from('orders').select(LITE).eq('club_id', clubId);
    if (extra && extra.userId) q = q.eq('user_id', extra.userId);
    const { data, error } = await q.order('created_at', { ascending: false })
      .range(from, from + CONFIG.PAGE_SIZE - 1);
    if (error) throw error;
    return data || [];
  },
  async members(clubId) {
    const { data: all } = await sb.from('profiles')
      .select('id,username,nick,active_role,roles,staff_roles').limit(800);
    return (all || []).filter(p =>
      p.current_club_id === clubId ||
      (Array.isArray(p.roles) && p.roles.some(r => r.club_id === clubId)));
  },
  async stars(clubId, month) {
    let q = sb.from('monthly_stars').select('*').eq('club_id', clubId);
    if (month) q = q.eq('month', month);
    const { data } = await q;
    return data || [];
  },
  async uploadImage(file) {
    const ext = (file.name || 'img.png').split('.').pop();
    const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
    const { error } = await sb.storage.from(CONFIG.BUCKET).upload(path, file);
    if (error) throw error;
    const { data } = sb.storage.from(CONFIG.BUCKET).getPublicUrl(path);
    return data.publicUrl;
  }
};

function applyTheme() { document.documentElement.dataset.theme = S.theme || 'glass'; }

async function loadContext() {
  const p = S.me;
  S.roles = Array.isArray(p.roles) ? p.roles.slice() : [];
  S.staffRoles = p.staff_roles || {};
  S.theme = p.theme || 'glass';
  applyTheme();

  let clubId = p.current_club_id;
  if (!clubId || !S.roles.some(r => r.club_id === clubId)) {
    clubId = S.roles[0] ? S.roles[0].club_id : null;
  }
  S.club = clubId ? await api.clubById(clubId) : null;

  const roleInClub = clubId ? S.roles.find(r => r.club_id === clubId) : null;
  S.role = (p.active_role && roleInClub && p.active_role === roleInClub.role)
    ? p.active_role
    : (roleInClub ? roleInClub.role : (p.role || 'player'));
}

function defaultRoute() {
  if (S.role === 'pending') return 'review';
  return 'home';
}

const ROLE_NAME = { admin: '管理员', leader: '团长', vice_leader: '副团长', staff: '员工', player: '陪玩', pending: '待审陪' };

const View = {
  auth() {
    const mode = S.cache.authMode || 'login';
    const regTab = S.cache.regTab || 'join';
    return `
    <div style="padding-top:52px">
      <div style="text-align:center;margin-bottom:26px">
        <div style="font-size:34px">🎧</div>
        <h1 style="font-size:22px;margin:10px 0 4px;letter-spacing:1px">陪玩俱乐部</h1>
        <div class="t-sub">柔软陪伴 · 安心记录</div>
      </div>
      <div class="card">
        <div class="seg" style="margin-bottom:16px">
          <div class="${mode === 'login' ? 'on' : ''}" data-act="auth-mode" data-v="login">登录</div>
          <div class="${mode === 'reg' ? 'on' : ''}" data-act="auth-mode" data-v="reg">注册</div>
        </div>
        ${mode === 'login' ? View._loginForm() : View._regForm(regTab)}
      </div>
    </div>
    <div class="fab" data-act="super-open">🔒</div>`;
  },
  _loginForm() {
    return `
      <label class="fld"><span>用户名</span><input id="li-user" placeholder="请输入用户名" autocomplete="username"></label>
      <label class="fld"><span>密码</span><input id="li-pass" type="password" placeholder="请输入密码" autocomplete="current-password"></label>
      <button class="btn block" data-act="do-login" style="margin-top:6px">进入</button>
      <div class="t-sub" style="text-align:center;margin-top:12px">首次使用请先注册</div>`;
  },
  _regForm(tab) {
    return `
      <div class="seg" style="margin-bottom:16px">
        <div class="${tab === 'join' ? 'on' : ''}" data-act="reg-tab" data-v="join">加入俱乐部</div>
        <div class="${tab === 'new' ? 'on' : ''}" data-act="reg-tab" data-v="new">开新俱乐部</div>
      </div>
      <label class="fld"><span>用户名</span><input id="rg-user" placeholder="登录账号"></label>
      <label class="fld"><span>密码</span><input id="rg-pass" type="password" placeholder="登录密码"></label>
      <label class="fld"><span>昵称</span><input id="rg-nick" placeholder="显示名称"></label>
      <label class="fld"><span>俱乐部名称</span><input id="rg-club" placeholder="输入俱乐部名字"></label>
      <label class="fld"><span>${tab === 'join' ? '绑定码（员工码 / 陪玩码 / 审核码）' : '最高管理员授权码'}</span>
        <input id="rg-code" placeholder="${tab === 'join' ? '如 A3K9F2' : '如 A3K9-F2M8'}"></label>
      <button class="btn block" data-act="do-register" data-v="${tab}">
        ${tab === 'join' ? '加入' : '创建'}
      </button>`;
  },
  tabsOf() {
    const r = S.role;
    if (['admin', 'leader', 'vice_leader', 'staff'].includes(r))
      return [['home', '主页'], ['review', '审核'], ['flow', '流水'], ['rank', '榜单'], ['settings', '设置']];
    if (r === 'player')
      return [['home', '主页'], ['records', '记录'], ['flow', '流水'], ['rank', '榜单'], ['settings', '设置']];
    return [['review', '审核'], ['requirements', '要求'], ['notice', '通知'], ['settings', '设置']];
  },
  shell(title, body, opts = {}) {
    const tabs = View.tabsOf();
    const isPending = S.role === 'pending';
    const showBack = !!opts.back;
    const header = showBack
      ? `<div class="topbar"><div class="back" data-act="back">‹</div><h1>${esc(title)}</h1><div></div></div>`
      : `<div class="topbar"><h1>${esc(title)}</h1>
           <div class="t-sub">${esc(S.club ? S.club.name : (isPending ? '待审核' : ''))}</div></div>`;
    return `
      ${header}
      ${body}
      ${isPending && showBack ? '' : `<div class="tabbar"><div class="tabbar-inner">
        ${tabs.map(([k, label]) => `<div class="tab ${S.route === k ? 'on' : ''}" data-act="tab" data-v="${k}">${label}</div>`).join('')}
      </div></div>`}`;
  },
  async home() {
    const c = S.cache;
    const isBoss = ['admin', 'leader', 'vice_leader'].includes(S.role);
    const readOnly = ['leader', 'vice_leader'].includes(S.role);
    const isStaff = S.role === 'staff';
    const summary = c.summary || { net: 0, gross: 0, count: 0, reward: 0, isStar: false };

    const workBtns = [];
    if (S.role === 'player' || isBoss || isStaff) workBtns.push(['report', '🎮 陪玩报备']);
    if ((isBoss || isStaff) && S.staffRoles.dispatcher) workBtns.push(['dispatch', '📋 派单报备']);
    if ((isBoss || isStaff) && S.staffRoles.director)  workBtns.push(['direct', '🔗 直属报备']);
    if ((isBoss || isStaff) && S.staffRoles.promoter)  workBtns.push(['promote', '📣 外宣录入']);
    if (isBoss && !readOnly) workBtns.push(['fine', '⚠️ 罚款']);
    if (isBoss) workBtns.push(['allrecords', '📑 全部记录']);

    return `
      <div class="card">
        <div class="row">
          <div style="width:48px;height:48px;border-radius:16px;background:var(--primary);color:#fff;
            display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700">
            ${esc((S.me.nick || S.me.username || '?').slice(0, 1))}
          </div>
          <div style="flex:1;min-width:0">
            <div class="row" style="gap:8px">
              <div style="font-size:16px;font-weight:700">${esc(S.me.nick || S.me.username)}</div>
              <span class="badge">${ROLE_NAME[S.role] || S.role}</span>
            </div>
            <div class="t-sub" style="margin-top:4px">${esc(S.club ? S.club.name : '未加入俱乐部')}</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="t-title">个人总结 · 本月</div>
        <div class="grid2">
          <div><div class="t-sub">月流水净赚</div><div class="big mono">${money(summary.net)}</div></div>
          <div><div class="t-sub">月奖励</div><div class="big mono">${money(summary.reward)}</div></div>
          <div><div class="t-sub">本月单量</div><div class="big mono">${summary.count}</div></div>
          <div><div class="t-sub">头牌身份</div><div class="big">${summary.isStar ? '⭐ 是' : '—'}</div></div>
        </div>
        ${summary.gross ? `<div class="hr"></div><div class="between"><span class="t-sub">本月总流水</span><span class="mono">${money(summary.gross)}</span></div>` : ''}
      </div>

      ${workBtns.length ? `<div class="card">
        <div class="t-title">工作台</div>
        <div class="grid2">
          ${workBtns.map(([k, l]) => `<button class="btn ghost block" data-act="go" data-v="${k}">${l}</button>`).join('')}
        </div>
      </div>` : ''}

      <div class="card">
        <div class="t-title">最近报备</div>
        ${(c.recent || []).length ? c.recent.map(o => `
          <div class="li"><div class="li-l">
            <div class="li-t">${esc(o.title || '报备')}</div>
            <div class="li-s">${hmz(o.created_at)} · ${esc(o.type)}</div>
          </div><div class="mono" style="font-weight:700">${money(o.net)}</div></div>`).join('')
          : '<div class="empty">还没有记录</div>'}
      </div>`;
  },
  report() {
    const games = (S.club && S.club.game_categories) || [];
    const starBonus = n(S.club && S.club.star_bonus) || 15;
    const baseRate = n(S.club && S.club.commission && S.club.commission.peiwan) || 30;
    const isStar = (S.cache.stars || []).some(s => s.user_id === S.me.id);
    return `
      <div class="card">
        <div class="t-title">🎮 陪玩报备</div>
        ${isStar ? `<div class="badge" style="margin-bottom:10px">⭐ 本月头牌 · 单价自动 +${starBonus}%</div>` : ''}
        <label class="fld"><span>游戏 / 项目</span>
          <input id="rp-title" placeholder="如 王者荣耀 · 王者局 1h" list="rp-games">
          <datalist id="rp-games">${games.map(g => `<option value="${esc(typeof g === 'string' ? g : (g.name || ''))}">`).join('')}</datalist>
        </label>
        <div class="grid2">
          <label class="fld"><span>项目金额（元）</span><input id="rp-amount" type="number" inputmode="decimal" placeholder="0" value="0"></label>
          <label class="fld"><span>加价（元）</span><input id="rp-tip" type="number" inputmode="decimal" placeholder="0" value="0"></label>
        </div>
        <label class="fld"><span>折扣（10 = 原价）</span><input id="rp-discount" type="number" inputmode="decimal" value="10"></label>
        <label class="fld"><span>备注</span><textarea id="rp-note" placeholder="选填"></textarea></label>
        <label class="fld"><span>凭证图片</span><input id="rp-image" type="file" accept="image/*"></label>
        <div class="card tight" style="background:var(--card2);margin:12px 0">
          <div class="between"><span class="t-sub">基础抽成率</span><span class="mono">${baseRate}%</span></div>
          <div class="between"><span class="t-sub">阶梯减成</span><span class="mono" id="rp-cut">—</span></div>
          <div class="between" style="margin-top:6px"><span style="font-weight:700">预计实得</span><span class="mono big" id="rp-net">¥0</span></div>
        </div>
        <button class="btn block" data-act="submit-report" data-v="${isStar ? 1 : 0}">提交报备</button>
      </div>
      <div class="card">
        <div class="t-title">我的报备记录</div>
        ${(S.cache.myRecords || []).length ? S.cache.myRecords.map(o => `
          <div class="li"><div class="li-l">
            <div class="li-t">${esc(o.title || '报备')}</div>
            <div class="li-s">${hmz(o.created_at)} · 流水 ${money(o.gross)} · 抽成 ${o.rate}%</div>
          </div><div class="mono" style="font-weight:700">${money(o.net)}</div></div>`).join('')
          : '<div class="empty">暂无记录</div>'}
      </div>`;
  },
  pickPlayer(kind) {
    const label = kind === 'dispatch' ? '派单报备' : '直属报备';
    const rateKey = kind === 'dispatch' ? 'dispatch_rate' : 'direct_rate';
    const rate = n(S.club && S.club[rateKey]);
    return `
      <div class="card">
        <div class="t-title">${label} · 抽成 ${rate}%</div>
        <label class="fld"><span>选择陪玩</span>
          <select id="pk-user">
            <option value="">请选择</option>
            ${(S.cache.players || []).map(p => `<option value="${p.id}">${esc(p.nick || p.username)}</option>`).join('')}
          </select>
        </label>
        <button class="btn ghost block" data-act="load-player-orders" data-v="${kind}">拉取本月未认领单子</button>
        <div id="pk-list" style="margin-top:12px"></div>
      </div>
      <div class="card">
        <div class="t-title">我拉的单子</div>
        ${(S.cache.mineStaff || []).length ? S.cache.mineStaff.map(o => `
          <div class="li"><div class="li-l">
            <div class="li-t">${esc(o.title || '单子')}</div>
            <div class="li-s">${hmz(o.created_at)} · 流水 ${money(o.gross)}</div>
          </div><div class="mono" style="font-weight:700">+${money(o.dispatch_amount)}</div></div>`).join('')
          : '<div class="empty">暂无记录</div>'}
      </div>`;
  },
  promote() {
    const ep = (S.club && S.club.external_prices) || {};
    const items = [['pei', '宣陪'], ['board', '宣板'], ['app1', '软件流量']];
    return `
      <div class="card">
        <div class="t-title">📣 外宣录入</div>
        ${items.map(([k, label]) => `
          <label class="fld"><span>${label}（单价 ${money(ep[k])} / 个）</span>
            <input id="pm-${k}" type="number" inputmode="numeric" placeholder="数量" value="0"></label>`).join('')}
        <button class="btn block" data-act="submit-promote">提交外宣</button>
      </div>
      <div class="card">
        <div class="t-title">我的外宣记录</div>
        ${(S.cache.minePromote || []).length ? S.cache.minePromote.map(o => `
          <div class="li"><div class="li-l">
            <div class="li-t">${esc(o.title)}</div>
            <div class="li-s">${hmz(o.created_at)}</div>
          </div><div class="mono" style="font-weight:700">${money(o.net)}</div></div>`).join('')
          : '<div class="empty">暂无记录</div>'}
      </div>`;
  },
  fine() {
    return `
      <div class="card">
        <div class="t-title">⚠️ 下发罚款单</div>
        <label class="fld"><span>选择陪玩</span>
          <select id="fn-user">
            <option value="">请选择</option>
            ${(S.cache.players || []).map(p => `<option value="${p.id}">${esc(p.nick || p.username)}</option>`).join('')}
          </select>
        </label>
        <label class="fld"><span>罚款金额（元）</span><input id="fn-amount" type="number" inputmode="decimal" value="0"></label>
        <label class="fld"><span>罚款原因</span><textarea id="fn-note" placeholder="必填"></textarea></label>
        <button class="btn danger block" data-act="submit-fine">下发罚款</button>
      </div>`;
  },
  allRecords() {
    const list = S.cache.allRecords || [];
    const readOnly = ['leader', 'vice_leader'].includes(S.role);
    return `
      <div class="card">
        <div class="t-title">📑 全部报备记录</div>
        ${list.length ? list.map(o => `
          <div class="li">
            <div class="li-l">
              <div class="li-t">${esc(o.title || '报备')}</div>
              <div class="li-s">${hmz(o.created_at)} · ${esc(o.type)} · 流水 ${money(o.gross)}</div>
            </div>
            <div style="text-align:right">
              <div class="mono" style="font-weight:700">${money(o.net)}</div>
              ${!readOnly ? `<button class="btn sm danger" style="margin-top:6px" data-act="del-order" data-v="${o.id}">删除</button>` : ''}
            </div>
          </div>`).join('')
          : '<div class="empty">暂无记录</div>'}
        <div style="margin-top:12px"><button class="btn ghost block" data-act="more-records">加载更多</button></div>
      </div>`;
  },
  records() {
    const list = S.cache.myRecords || [];
    return `
      <div class="card">
        <div class="t-title">我的报备历史</div>
        ${list.length ? list.map(o => `
          <div class="li"><div class="li-l">
            <div class="li-t">${esc(o.title || '报备')}</div>
            <div class="li-s">${hmz(o.created_at)} · 流水 ${money(o.gross)} · 抽成 ${o.rate}%</div>
          </div><div class="mono" style="font-weight:700">${money(o.net)}</div></div>`).join('')
          : '<div class="empty">还没有记录</div>'}
        <div style="margin-top:12px"><button class="btn ghost block" data-act="more-my-records">加载更多</button></div>
      </div>`;
  },
  review() {
    const tab = S.seg.review || 'hall';
    const isBoss = ['admin', 'leader', 'vice_leader'].includes(S.role);
    const list = tab === 'hall' ? (S.cache.hall || []) : (S.cache.myReview || []);
    return `
      <div class="card">
        <div class="between" style="margin-bottom:12px">
          <div class="seg" style="flex:1">
            <div class="${tab === 'hall' ? 'on' : ''}" data-act="seg" data-k="review" data-v="hall">大厅</div>
            <div class="${tab === 'mine' ? 'on' : ''}" data-act="seg" data-k="review" data-v="mine">我的审核</div>
          </div>
          ${isBoss ? `<button class="btn sm ghost" data-act="go" data-v="reviewList" style="margin-left:8px">审核列表</button>` : ''}
        </div>
        ${list.length ? list.map(a => `
          <div class="li">
            <div class="li-l">
              <div class="li-t">${esc(a.username || a.user_id)} · ${esc(a.game || '')}</div>
              <div class="li-s">${esc(a.skill || '')} · ${esc(a.status)} · ${hmz(a.created_at)}</div>
            </div>
            <div class="row" style="gap:6px">
              ${a.status === 'waiting' ? `<button class="btn sm" data-act="claim" data-v="${a.id}">抢单</button>` : ''}
              ${a.status === 'reviewing' && a.auditor_id === S.me.id ? `
                <button class="btn sm" data-act="pass" data-v="${a.id}">通过</button>
                <button class="btn sm danger" data-act="reject" data-v="${a.id}">拒绝</button>` : ''}
            </div>
          </div>`).join('')
          : '<div class="empty">暂时没有待处理的申请</div>'}
      </div>`;
  },
  reviewList() {
    const list = S.cache.reviewList || [];
    return `<div class="card">
      <div class="t-title">审核列表</div>
      ${list.length ? list.map(a => `
        <div class="li"><div class="li-l">
          <div class="li-t">${esc(a.username || '')} · ${esc(a.game || '')}</div>
          <div class="li-s">${esc(a.status)} · ${esc(a.auditor_id ? '审核员 ' + String(a.auditor_id).slice(0, 6) : '未分配')}</div>
        </div></div>`).join('')
        : '<div class="empty">暂无数据</div>'}
    </div>`;
  },
  pendingApply() {
    const my = S.cache.myApply || [];
    const pendingOne = my.find(a => a.status === 'waiting' || a.status === 'reviewing');
    if (pendingOne) {
      return `<div class="card" style="text-align:center;padding:34px 16px">
        <div style="font-size:32px">⏳</div>
        <div class="t-title" style="margin-top:10px">正在审核中</div>
        <div class="t-sub">游戏：${esc(pendingOne.game || '')} · 状态：${esc(pendingOne.status)}</div>
      </div>`;
    }
    const games = (S.club && S.club.game_categories) || [];
    return `<div class="card">
      <div class="t-title">提交审核资料</div>
      <label class="fld"><span>申请游戏</span>
        <select id="ap-game">
          <option value="">请选择</option>
          ${games.map(g => { const nm = typeof g === 'string' ? g : (g.name || ''); return `<option value="${esc(nm)}">${esc(nm)}</option>`; }).join('')}
          <option value="其他">其他</option>
        </select></label>
      <label class="fld"><span>技能位置</span><input id="ap-skill" placeholder="如 技术打野"></label>
      <label class="fld"><span>微信号（必填）</span><input id="ap-wechat" placeholder="方便审核员联系"></label>
      <label class="fld"><span>自我介绍 / 实力证明</span><textarea id="ap-content" placeholder="段位、战绩、经验"></textarea></label>
      <label class="fld"><span>凭证图片</span><input id="ap-image" type="file" accept="image/*"></label>
      <button class="btn block" data-act="submit-apply">提交</button>
    </div>`;
  },
  requirements() {
    const games = (S.club && S.club.game_categories) || [];
    const sel = S.seg.reqGame || '';
    const reqs = (S.club && S.club.requirements) || {};
    const blocks = (sel && reqs[sel]) || [];
    return `<div class="card">
      <div class="t-title">审核要求</div>
      <label class="fld"><span>选择游戏</span>
        <select data-act="sel-req-game" id="rq-game">
          <option value="">请选择</option>
          ${games.map(g => { const nm = typeof g === 'string' ? g : (g.name || ''); return `<option ${nm === sel ? 'selected' : ''} value="${esc(nm)}">${esc(nm)}</option>`; }).join('')}
        </select></label>
      ${sel ? (blocks.length ? blocks.map(b => `
        <div class="card tight" style="background:var(--card2)">
          <div style="font-weight:700;font-size:13px;margin-bottom:6px">${esc(b.title || '板块')}</div>
          <div class="t-body" style="white-space:pre-wrap;color:var(--sub)">${esc(b.content || '')}</div>
        </div>`).join('') : '<div class="empty">该游戏暂未配置审核要求</div>') : '<div class="empty">请先选择游戏</div>'}
    </div>`;
  },
  notice() {
    const list = S.cache.myApply || [];
    const hasPassed = list.some(a => a.status === 'passed');
    return `<div class="card">
      <div class="t-title">通知</div>
      ${list.length ? list.map(a => `
        <div class="li"><div class="li-l">
          <div class="li-t">${esc(a.game || '')} · ${a.status === 'passed' ? '✅ 已通过' : a.status === 'rejected' ? '❌ 未通过' : '⏳ ' + esc(a.status)}</div>
          <div class="li-s">${hmz(a.created_at)}</div>
        </div></div>`).join('')
        : '<div class="empty">暂无通知</div>'}
      ${hasPassed ? `
        <div class="hr"></div>
        <div class="t-sub" style="margin-bottom:8px">已通过审核，请输入陪玩绑定码解锁正式身份</div>
        <label class="fld"><input id="nt-code" placeholder="输入陪玩绑定码"></label>
        <button class="btn block" data-act="redeem-code">解锁陪玩身份</button>` : ''}
    </div>`;
  },
  flow() {
    const tab = S.seg.flowTab || 'stat';
    const dim = S.seg.flowDim || 'month';
    const date = S.seg.flowDate || ymd();
    const st = S.cache.flowStat || {};
    return `
      <div class="card">
        <div class="seg" style="margin-bottom:12px">
          <div class="${tab === 'stat' ? 'on' : ''}" data-act="seg" data-k="flowTab" data-v="stat">流水统计</div>
          <div class="${tab === 'wage' ? 'on' : ''}" data-act="seg" data-k="flowTab" data-v="wage">工资表</div>
        </div>
        <div class="row" style="gap:8px">
          <div class="seg" style="flex:1">
            ${[['day', '日'], ['week', '周'], ['month', '月']].map(([k, l]) =>
              `<div class="${dim === k ? 'on' : ''}" data-act="seg" data-k="flowDim" data-v="${k}">${l}</div>`).join('')}
          </div>
          <input type="date" id="flow-date" value="${date}" data-act="flow-date" style="width:130px;padding:8px">
        </div>
      </div>

      ${tab === 'stat' ? `
      <div class="card">
        <div class="grid2">
          <div><div class="t-sub">总单数</div><div class="big mono">${st.count || 0}</div></div>
          <div><div class="t-sub">总流水</div><div class="big mono">${money(st.gross)}</div></div>
          <div><div class="t-sub">团抽成</div><div class="big mono">${money(st.clubCut)}</div></div>
          <div><div class="t-sub">员工抽成</div><div class="big mono">${money(st.staffCut)}</div></div>
        </div>
      </div>
      <div class="card">
        <div class="t-title">无主单归属</div>
        <div class="between"><span class="t-sub">未被认领单子应分出的抽成（归俱乐部）</span>
          <span class="mono big">${money(st.orphanCut)}</span></div>
      </div>
      <div class="card">
