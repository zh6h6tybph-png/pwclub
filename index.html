/* ==================================================================
 * 7. 数据准备（渲染前预取）
 * ================================================================== */
async function prepare() {
  if (!S.me) return;

  /* 每次补全 clubNames，防止切换身份/加入后缺失 */
  S.cache.clubNames = S.cache.clubNames || {};
  const roleClubIds = [...new Set((S.roles || []).map(x => x.club_id).filter(Boolean))];
  for (const id of roleClubIds) {
    if (!S.cache.clubNames[id]) {
      const cl = await api.clubById(id);
      S.cache.clubNames[id] = cl ? cl.name : '（已失效）';
    }
  }

  /* ---------- 待审陪 ---------- */
  if (S.role === 'pending') {
    if (['review', 'notice'].includes(S.route)) {
      const { data } = await sb.from('applications').select('*').eq('user_id', S.me.id);
      S.cache.myApply = data || [];
    }
    return;
  }

  const clubId = S.club && S.club.id;
  if (!clubId) return;

  const r = S.route;
  const [ms, me] = rangeOf('month');

  /* ---------- 主页 ---------- */
  if (r === 'home') {
    const lite = await api.orders(clubId, ms, me);
    const mine = lite.filter(o => o.user_id === S.me.id);
    S.cache.summary = {
      count: mine.filter(o => o.type === 'peiwan').length,
      net: r2(mine.reduce((a, o) => a + n(o.net), 0)),
      gross: r2(mine.reduce((a, o) => a + n(o.gross), 0)),
      reward: 0,
      isStar: false
    };
    const ym = new Date().toISOString().slice(0, 7);
    S.cache.stars = await api.stars(clubId, ym);
    S.cache.summary.isStar = S.cache.stars.some(s => s.user_id === S.me.id);

    const rewardCfg = S.club.reward_config || {};
    if (rewardCfg.enabled) {
      const val = rewardCfg.basis === 'gross' ? S.cache.summary.gross : S.cache.summary.net;
      S.cache.summary.reward = Calc.reward(rewardCfg.tiers, val);
    }

    const recent = await api.ordersPage(clubId, 0, { userId: S.me.id });
    S.cache.recent = recent.slice(0, 3);
    S.cache.stars = S.cache.stars || [];
  }

  /* ---------- 报备 / 记录 ---------- */
  if (r === 'report' || r === 'records') {
    S.cache.myRecords = await api.ordersPage(clubId, 0, { userId: S.me.id });
    S.cache.myPage = 0;
    if (r === 'report') {
      const ym = new Date().toISOString().slice(0, 7);
      if (!S.cache.stars) S.cache.stars = await api.stars(clubId, ym);
    }
  }

  /* ---------- 派单 / 直属 / 罚款 ---------- */
  if (['dispatch', 'direct', 'fine', 'finePage'].includes(r)) {
    const members = await api.members(clubId);
    S.cache.players = members.filter(m =>
      (m.roles || []).some(x => x.club_id === clubId && x.role === 'player'));

    if (r === 'dispatch' || r === 'direct') {
      const all = await api.orders(clubId, ms, me);
      S.cache.mineStaff = all.filter(o => o.dispatch_user_id === S.me.id);
    }
  }

  /* ---------- 外宣 ---------- */
  if (r === 'promote') {
    const all = await api.orders(clubId, ms, me);
    S.cache.minePromote = all.filter(o => o.type === 'custom' && o.user_id === S.me.id);
  }

  /* ---------- 全部记录（分页） ---------- */
  if (r === 'allrecords') {
    if (!S.cache.allRecords) {
      S.cache.allRecords = await api.ordersPage(clubId, 0);
      S.cache.allPage = 0;
    }
  }

  /* ---------- 审核 ---------- */
  if (r === 'review') {
    const tab = S.seg.review || 'hall';
    if (tab === 'hall') {
      const { data } = await sb.from('applications').select('*')
        .eq('club_id', clubId).eq('status', 'waiting')
        .order('created_at', { ascending: false }).limit(100);
      S.cache.hall = data || [];
    } else {
      const { data } = await sb.from('applications').select('*')
        .eq('club_id', clubId).eq('auditor_id', S.me.id).eq('status', 'reviewing')
        .order('created_at', { ascending: false }).limit(100);
      S.cache.myReview = data || [];
    }
  }

  if (r === 'reviewList') {
    const { data } = await sb.from('applications').select('*')
      .eq('club_id', clubId).order('created_at', { ascending: false }).limit(200);
    S.cache.reviewList = data || [];
  }

  /* ---------- 流水 ---------- */
  if (r === 'flow') {
    const dim = S.seg.flowDim || 'month';
    const date = S.seg.flowDate || ymd();
    const [s, e] = rangeOf(dim, date);
    const all = await api.orders(clubId, s, e);
    if (!S.cache.members) S.cache.members = await api.members(clubId);
    S.cache.flowStat = computeFlow(all);
  }

  /* ---------- 榜单 ---------- */
  if (r === 'rank') {
    const dim = S.seg.rankDim || 'month';
    const [s, e] = rangeOf(dim, ymd());
    const all = await api.orders(clubId, s, e);
    if (!S.cache.members) S.cache.members = await api.members(clubId);
    if (!S.cache.stars) {
      const ym = new Date().toISOString().slice(0, 7);
      S.cache.stars = await api.stars(clubId, ym);
    }
    S.cache.rank = computeRank(all, S.cache.members, S.seg.rankType || 'gross');
  }

  /* ---------- 设置 ---------- */
  if (r === 'settings') {
    if (!S.cache.members) S.cache.members = await api.members(clubId);
  }
}

/* ==================================================================
 * 8. 统计计算（流水 / 工资 / 榜单）
 * ================================================================== */
function computeFlow(orders) {
  const st = {
    count: 0, gross: 0, clubCut: 0, staffCut: 0, orphanCut: 0,
    byType: {}, byMember: [], wages: [],
    wagePlayer: 0, wageStaff: 0, wageTotal: 0
  };
  const memberMap = {};
  const wageMap = {};
  const dispatchRate = n(S.club && S.club.dispatch_rate);

  orders.forEach(o => {
    st.count++;
    st.gross = r2(st.gross + n(o.gross));

    if (o.type === 'peiwan') {
      st.clubCut = r2(st.clubCut + n(o.commission));
    }
    /* 无主单：陪玩单且无人认领 */
    if (o.type === 'peiwan' && !o.dispatch_user_id && n(o.gross) > 0) {
      st.orphanCut = r2(st.orphanCut + Calc.staffCut(o.gross, dispatchRate));
    }
    /* 员工抽成（认领单已写入 dispatch_amount） */
    if (n(o.dispatch_amount) > 0) {
      st.staffCut = r2(st.staffCut + n(o.dispatch_amount));
    }

    /* 按类型 */
    const t = o.type || 'other';
    st.byType[t] = st.byType[t] || { count: 0, gross: 0 };
    st.byType[t].count++;
    st.byType[t].gross = r2(st.byType[t].gross + n(o.gross));

    /* 按成员（流水/实得） */
    const uidO = o.user_id;
    if (uidO) {
      memberMap[uidO] = memberMap[uidO] || { id: uidO, count: 0, gross: 0, net: 0 };
      memberMap[uidO].count++;
      memberMap[uidO].gross = r2(memberMap[uidO].gross + n(o.gross));
      memberMap[uidO].net = r2(memberMap[uidO].net + n(o.net));
    }

    /* 工资：陪玩单 */
    if (uidO && (o.type === 'peiwan' || o.type === 'fine')) {
      wageMap[uidO] = wageMap[uidO] || {
        id: uidO, role: 'player', count: 0, gross: 0,
        fine: 0, net: 0, settled: 0, dispatch: 0, external: 0
      };
      if (o.type === 'peiwan') {
        wageMap[uidO].count++;
        wageMap[uidO].gross = r2(wageMap[uidO].gross + n(o.gross));
        wageMap[uidO].net = r2(wageMap[uidO].net + n(o.net));
        if (o.settled) wageMap[uidO].settled = r2(wageMap[uidO].settled + n(o.net));
      } else {
        wageMap[uidO].fine = r2(wageMap[uidO].fine + Math.abs(n(o.net)));
      }
    }

    /* 工资：派单/直属 */
    if (o.dispatch_user_id) {
      const d = o.dispatch_user_id;
      wageMap[d] = wageMap[d] || {
        id: d, role: 'staff', count: 0, gross: 0,
        fine: 0, net: 0, settled: 0, dispatch: 0, external: 0
      };
      wageMap[d].dispatch = r2(wageMap[d].dispatch + n(o.dispatch_amount));
    }

    /* 工资：外宣（type=custom，金额即净得） */
    if (o.type === 'custom' && uidO) {
      wageMap[uidO] = wageMap[uidO] || {
        id: uidO, role: 'staff', count: 0, gross: 0,
        fine: 0, net: 0, settled: 0, dispatch: 0, external: 0
      };
      wageMap[uidO].external = r2(wageMap[uidO].external + n(o.net));
    }
  });

  st.byMember = Object.values(memberMap)
    .sort((a, b) => b.gross - a.gross).slice(0, 30);

  const nameOf = id => {
    const m = (S.cache.members || []).find(x => x.id === id);
    return m ? (m.nick || m.username) : String(id).slice(0, 6);
  };

  st.wages = Object.values(wageMap).map(w => {
    const should = w.role === 'player'
      ? r2(w.net - w.fine - w.settled)
      : r2(w.dispatch + w.external - w.settled);
    return {
      name: nameOf(w.id), role: w.role === 'player' ? '陪玩' : '员工',
      count: w.count, gross: w.gross, fine: w.fine, settled: w.settled,
      should, _id: w.id, _role: w.role
    };
  }).sort((a, b) => b.should - a.should);

  st.wagePlayer = r2(st.wages.filter(w => w.role === '陪玩').reduce((a, w) => a + w.should, 0));
  st.wageStaff  = r2(st.wages.filter(w => w.role === '员工').reduce((a, w) => a + w.should, 0));
  st.wageTotal  = r2(st.wagePlayer + st.wageStaff);

  return st;
}

function computeRank(orders, members, type) {
  const map = {};
  const nameOf = id => {
    const m = members.find(x => x.id === id);
    return m ? (m.nick || m.username) : String(id).slice(0, 6);
  };

  orders.forEach(o => {
    const id = o.user_id; if (!id) return;
    map[id] = map[id] || { id, name: nameOf(id), gross: 0, count: 0, net: 0, gift: 0, fine: 0, active: 0 };
    map[id].gross  = r2(map[id].gross + n(o.gross));
    map[id].net    = r2(map[id].net + n(o.net));
    map[id].active++;
    if (o.type === 'peiwan') map[id].count++;
    if (o.type === 'gift')   map[id].gift = r2(map[id].gift + n(o.gross));
    if (o.type === 'fine')   map[id].fine = r2(map[id].fine + Math.abs(n(o.net)));
  });

  let list = Object.values(map);
  const starIds = new Set((S.cache.stars || []).map(s => s.user_id));

  if (type === 'star') {
    list = list.filter(x => starIds.has(x.id));
  }

  const keyMap = {
    gross: 'gross', count: 'count', net: 'net', gift: 'gift',
    fine: 'fine', active: 'active', progress: 'gross', star: 'gross'
  };
  const k = keyMap[type] || 'gross';
  list.sort((a, b) => b[k] - a[k]);

  return list.map(x => ({ name: x.name, value: x[k] }))
    .filter(x => x.value > 0).slice(0, 50);
}

/* ==================================================================
 * 9. 渲染
 * ================================================================== */
async function render() {
  const app = $('#app');
  try {
    /* 超管界面优先（未登录用户） */
    if (sessionStorage.getItem(SUPER_KEY) === '1' && !S.me) {
      app.innerHTML = View.superConsole();
      return;
    }

    /* 未登录 → 登录页 */
    if (!S.me) {
      applyTheme();
      app.innerHTML = View.auth();
      return;
    }

    /* 已登录但俱乐部全失效 */
    if (!S.club) {
      applyTheme();
      app.innerHTML = `
        <div class="card" style="text-align:center;padding:40px 20px">
          <div style="font-size:36px">⚠️</div>
          <div class="t-title" style="margin-top:12px">俱乐部已失效</div>
          <div class="t-sub" style="margin-top:6px">你当前所在的俱乐部已被删除，或尚未加入任何俱乐部</div>
          <button class="btn danger block" style="margin-top:20px" data-act="logout">退出登录</button>
        </div>`;
      return;
    }

    await prepare();
    applyTheme();

    /* ---------- 待审陪界面 ---------- */
    if (S.role === 'pending') {
      const titles = { review: '审核', requirements: '要求', notice: '通知', settings: '设置' };
      const r = S.route;
      const body =
        r === 'review' ? View.pendingApply()
        : r === 'requirements' ? View.requirements()
        : r === 'notice' ? View.notice()
        : View.settings();
      app.innerHTML = View.shell(titles[r] || '审核', body);
      return;
    }

    /* ---------- 子页面（有 back，无底栏） ---------- */
    const subViews = ['report', 'dispatch', 'direct', 'promote', 'fine',
      'allrecords', 'reviewList', 'finePage'];
    const titleMap = {
      report: '陪玩报备', dispatch: '派单报备', direct: '直属报备', promote: '外宣录入',
      fine: '罚款', allrecords: '全部记录', reviewList: '审核列表', finePage: '罚款管理'
    };

    if (subViews.includes(S.route)) {
      let body = '';
      if (S.route === 'report') body = View.report();
      else if (S.route === 'dispatch') body = View.pickPlayer('dispatch');
      else if (S.route === 'direct')   body = View.pickPlayer('direct');
      else if (S.route === 'promote')  body = View.promote();
      else if (S.route === 'fine' || S.route === 'finePage') body = View.fine();
      else if (S.route === 'allrecords') body = View.allRecords();
      else if (S.route === 'reviewList') body = View.reviewList();
      app.innerHTML = View.shell(titleMap[S.route], body, { back: true });
      return;
    }

    /* ---------- 主 tab 页面 ---------- */
    let body = '', title = '';
    const r = S.route;
    if (r === 'home')          { title = '主页'; body = await View.home(); }
    else if (r === 'records')  { title = '记录'; body = View.records(); }
    else if (r === 'review')   { title = '审核'; body = View.review(); }
    else if (r === 'flow')     { title = '流水'; body = View.flow(); }
    else if (r === 'rank')     { title = '榜单'; body = View.rank(); }
    else if (r === 'settings') { title = '设置'; body = View.settings(); }
    else { title = '主页'; body = await View.home(); }

    app.innerHTML = View.shell(title, body);
    bindAccordion();
    bindReportCalc();
  } catch (e) {
    console.error('[render]', e);
    app.innerHTML = `<div class="card" style="text-align:center;padding:34px 20px">
      <div style="font-size:30px">😵</div>
      <div class="t-title" style="margin-top:10px">页面加载失败</div>
      <div class="t-sub" style="color:var(--danger);margin-top:6px;word-break:break-all">${esc(e.message || e)}</div>
      <button class="btn ghost" style="margin-top:16px" onclick="location.reload()">刷新重试</button>
    </div>`;
  }
}

/* 折叠面板状态恢复 */
function bindAccordion() {
  document.querySelectorAll('.acc').forEach(el => {
    const k = el.dataset.acc;
    if (S.cache['acc_' + k]) el.classList.add('open');
  });
}

/* 报备页实时计算 */
function bindReportCalc() {
  if (S.route !== 'report') return;
  const calcNow = () => {
    const btn = document.querySelector('[data-act="submit-report"]');
    const isStar = Number((btn && btn.dataset.v) || 0) === 1;
    const amount   = n($('#rp-amount') && $('#rp-amount').value);
    const tip      = n($('#rp-tip') && $('#rp-tip').value);
    const discount = n($('#rp-discount') && $('#rp-discount').value) || 10;
    const baseRate = n(S.club && S.club.commission && S.club.commission.peiwan) || 30;
    const starBonus = n(S.club && S.club.star_bonus) || 15;
    const monthCount = (S.cache.myRecords || []).filter(o => o.type === 'peiwan').length;
    const res = Calc.report({
      amount, tip, discount, baseRate, isStar, starBonus, monthCount, club: S.club
    });
    const cutEl = $('#rp-cut'), netEl = $('#rp-net');
    if (cutEl) cutEl.textContent = res.tierCut ? `-${res.tierCut}%` : '—';
    if (netEl) netEl.textContent = money(res.net);
  };
  ['rp-amount', 'rp-tip', 'rp-discount'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', calcNow);
  });
  calcNow();
}

/* ==================================================================
 * 10. 点击事件分发
 * ================================================================== */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const v = el.dataset.v;

  try {
    /* ---------- 登录 / 注册 ---------- */
    if (act === 'auth-mode') { S.cache.authMode = v; render(); return; }
    if (act === 'reg-tab')   { S.cache.regTab = v; render(); return; }

    if (act === 'do-login') {
      const u = $('#li-user').value.trim();
      const p = $('#li-pass').value;
      if (!u) return toast('请输入用户名');
      const prof = await api.login(u, p);
      S.me = prof;
      localStorage.setItem(SESSION_KEY, prof.id);
      S.cache = {};
      await loadContext();
      S.route = defaultRoute();
      toast('欢迎回来，' + (prof.nick || prof.username));
      render();
      return;
    }

    if (act === 'do-register') {
      const payload = {
        username: $('#rg-user').value.trim(),
        password: $('#rg-pass').value,
        nick: $('#rg-nick').value.trim(),
        clubName: $('#rg-club').value.trim(),
        code: $('#rg-code').value.trim()
      };
      if (!payload.username || !payload.password) return toast('用户名和密码必填');
      if (!payload.clubName) return toast('请填写俱乐部名称');
      if (!payload.code) return toast('请填写绑定码 / 授权码');

      let prof;
      if (v === 'join') prof = await api.joinClub(payload);
      else prof = await api.createClub({ ...payload, authCode: payload.code });

      S.me = prof;
      localStorage.setItem(SESSION_KEY, prof.id);
      S.cache = {};
      await loadContext();
      S.route = defaultRoute();
      toast('注册成功');
      render();
      return;
    }

    /* ---------- 超管 ---------- */
    if (act === 'super-open') { openSuperModal(); return; }

    if (act === 'super-verify') {
      const rawPwd = $('#super-pass').value;
      
      // 去除所有空格和换行符
      const cleanStr = s => s.replace(/\s/g, '');
      // 统一标点符号：把全角分号、全角@转成半角，忽略大小写
      const normalize = s => s.replace(/[；;]/g, ';').replace(/＠/g, '@').toLowerCase();
      
      const pwd = normalize(cleanStr(rawPwd));
      const target = normalize(cleanStr(CONFIG.SUPER_PASS));
      
      // 只要不匹配，用 alert 强制提示
      if (pwd !== target) {
        alert('密码错误！\n\n你输入的长度：' + pwd.length + '\n正确长度：' + target.length + '\n请检查是否有空格或标点错误。');
        return;
      }

      // 1. 验证通过，立刻清理普通用户环境
      sessionStorage.setItem(SUPER_KEY, '1');
      localStorage.removeItem(SESSION_KEY);
      S.me = null; S.club = null; S.roles = []; S.role = null; S.route = 'home';
      
      // 2. 关闭弹窗，并立刻渲染超管界面（不管有没有网络数据，先让页面出来）
      closeModal();
      S.cache.superClubs = [];
      S.cache.superCodes = [];
      render();
      
      // 3. 异步去后台拉取数据，拉完后再刷新一次界面
      loadSuperData().then(() => {
        render();
      }).catch(err => {
        alert('已进入超管控制台，但拉取俱乐部数据失败：\n' + (err.message || '网络错误'));
      });
      return;
    }

    if (act === 'super-exit') {
      sessionStorage.removeItem(SUPER_KEY);
      S.cache.superClubs = null;
      S.cache.superCodes = null;
      render();
      return;
    }

    if (act === 'gen-auth') {
      try {
        const code = genAuthCode();
        const { error } = await sb.from('auth_codes').insert({
          id: uid(), code, used: false, created_at: Date.now()
        });
        if (error) throw error;
        
        alert('授权码生成成功：' + code);
        await loadSuperData(); // 强制重新拉取
        render();
      } catch (err) {
        alert('生成失败！请检查网络或Supabase配置。\n错误信息：' + (err.message || err));
      }
      return;
    }

    if (act === 'super-del-club') {
      if (!confirmBox('将彻底抹除该俱乐部及其全部数据，确定？')) return;
      if (!confirmBox('再次确认：此操作不可恢复')) return;
      await sb.from('orders').delete().eq('club_id', v);
      await sb.from('applications').delete().eq('club_id', v);
      await sb.from('monthly_stars').delete().eq('club_id', v);
      await sb.from('profiles').delete().eq('current_club_id', v);
      await sb.from('clubs').delete().eq('id', v);
      toast('已删除');
      await loadSuperData();
      render();
      return;
    }

    if (act === 'super-del-code') {
      await sb.from('auth_codes').delete().eq('id', v);
      await loadSuperData();
      render();
      return;
    }

    /* ---------- 导航 ---------- */
    if (act === 'tab') {
      S.route = v;
      if (v === 'review') S.seg.review = S.seg.review || 'hall';
      render();
      return;
    }
    if (act === 'go')   { S.route = v; render(); return; }
    if (act === 'back') { S.route = S.role === 'pending' ? 'review' : 'home'; render(); return; }

    if (act === 'seg') {
      S.seg[el.dataset.k] = v;
      if (el.dataset.k === 'flowDim')  S.cache.flowStat = null;
      if (el.dataset.k === 'rankDim' || el.dataset.k === 'rankType') S.cache.rank = null;
      render();
      return;
    }

    if (act === 'acc') {
      const box = el.closest('.acc');
      if (!box) return;
      const k = box.dataset.acc;
      box.classList.toggle('open');
      S.cache['acc_' + k] = box.classList.contains('open');
      return;
    }

    /* ---------- 主题 ---------- */
    if (act === 'theme') {
      S.theme = v;
      applyTheme();
      await api.saveProfile({ theme: v });
      render();
      return;
    }

    /* ---------- 设置：资料 ---------- */
    if (act === 'save-nick') {
      const nick = $('#st-nick').value.trim();
      if (!nick) return toast('昵称不能为空');
      await api.saveProfile({ nick });
      toast('昵称已保存');
      render();
      return;
    }

    if (act === 'save-pass') {
      const p = $('#st-pass').value;
      if (!p || p.length < 4) return toast('密码至少 4 位');
      await api.saveProfile({ password: p });
      toast('密码已修改');
      render();
      return;
    }

    if (act === 'save-staff') {
      const sr = {};
      ['dispatcher', 'director', 'auditor', 'promoter'].forEach(k => {
        const el2 = document.getElementById('sr-' + k);
        sr[k] = !!(el2 && el2.checked);
      });
      S.staffRoles = sr;
      await api.saveProfile({ staff_roles: sr });
      toast('岗位已保存');
      render();
      return;
    }

    if (act === 'switch-role') {
      const r = S.roles[Number(v)];
      if (!r) return;
      await api.saveProfile({ current_club_id: r.club_id, active_role: r.role });
      await loadContext();
      S.cache = { clubNames: S.cache.clubNames };
      S.route = defaultRoute();
      toast('已切换身份');
      render();
      return;
    }

    if (act === 'join-more') {
      const cn = $('#st-join-club').value.trim();
      const code = $('#st-join-code').value.trim();
      if (!cn || !code) return toast('请填写完整');
      const club = await api.findClubByName(cn);
      if (!club) return toast('俱乐部不存在');
      let role = null;
      if (club.staff_code && club.staff_code === code) role = 'staff';
      else if (club.auditor_code && club.auditor_code === code) role = 'staff';
      else if (club.code && club.code === code) role = 'pending';
      else return toast('绑定码不正确');

      if ((S.roles || []).some(x => x.club_id === club.id)) return toast('你已在该俱乐部');
      const roles = [...(S.roles || []), { club_id: club.id, role }];
      await api.saveProfile({ roles });
      S.cache.clubNames = S.cache.clubNames || {};
      S.cache.clubNames[club.id] = club.name;
      await loadContext();
      toast('已加入 ' + club.name);
      render();
      return;
    }

    /* ---------- 俱乐部配置 ---------- */
    if (act === 'save-club-name') {
      const name = $('#cf-name').value.trim();
      if (!name) return toast('名称不能为空');
      await api.saveClub({ name });
      S.cache.clubNames = S.cache.clubNames || {};
      S.cache.clubNames[S.club.id] = name;
      toast('已保存');
      render();
      return;
    }

    if (act === 'regen-code') {
      if (!confirmBox('重新生成后，旧绑定码将失效。确定？')) return;
      await api.saveClub({ code: genCode(), staff_code: genCode(), auditor_code: genCode() });
      toast('绑定码已重新生成');
      render();
      return;
    }

    if (act === 'copy') {
      try { await navigator.clipboard.writeText(v); toast('已复制'); }
      catch { toast('复制失败，请长按选择'); }
      return;
    }

    if (act === 'save-biz') {
      const comm = { ...(S.club.commission || {}) };
      comm.peiwan = n($('#cf-rate').value);
      await api.saveClub({
        commission: comm,
        dispatch_rate: n($('#cf-dispatch').value),
        direct_rate: n($('#cf-direct').value),
        star_bonus: n($('#cf-star').value),
        tier_enabled: $('#cf-tier-on').checked,
        tier_settings: {
          tier1_count: n($('#cf-t1c').value), tier1_discount: n($('#cf-t1d').value),
          tier2_count: n($('#cf-t2c').value), tier2_discount: n($('#cf-t2d').value)
        },
        external_prices: {
          pei: n($('#cf-ep1').value), board: n($('#cf-ep2').value), app1: n($('#cf-ep3').value)
        }
      });
      toast('业务配置已保存');
      render();
      return;
    }

    if (act === 'save-games') {
      const games = $('#cf-games').value.split('\n').map(s => s.trim()).filter(Boolean);
      await api.saveClub({ game_categories: games });
      toast('已保存');
      render();
      return;
    }

    if (act === 'save-reward') {
      const tiers = $('#rw-tiers').value.split('\n').map(l => {
        const [min, amount] = l.split(',').map(x => n((x || '').trim()));
        return { min, amount };
      }).filter(t => t.min > 0 && t.amount > 0);
      await api.saveClub({
        reward_config: {
          enabled: $('#rw-on').checked,
          basis: $('#rw-basis').value,
          period: $('#rw-period').value,
          tiers
        }
      });
      toast('奖励设置已保存');
      render();
      return;
    }

    /* ---------- 成员管理 ---------- */
    if (act === 'set-role') {
      const [uidX, role] = v.split(':');
      const { data: prof } = await sb.from('profiles').select('*').eq('id', uidX).maybeSingle();
      if (!prof) return;
      const roles = (prof.roles || []).map(r =>
        r.club_id === S.club.id ? { ...r, role } : r);
      if (!roles.some(r => r.club_id === S.club.id)) roles.push({ club_id: S.club.id, role });
      const patch = { roles };
      if (prof.current_club_id === S.club.id) patch.active_role = role;
      await sb.from('profiles').update(patch).eq('id', uidX);
      S.cache.members = null;
      toast('已设置');
      render();
      return;
    }

    if (act === 'remove-member') {
      if (!confirmBox('确定移除该成员？')) return;
      const { data: prof } = await sb.from('profiles').select('*').eq('id', v).maybeSingle();
      if (!prof) return;
      const roles = (prof.roles || []).filter(r => r.club_id !== S.club.id);
      await sb.from('profiles').update({ roles }).eq('id', v);
      S.cache.members = null;
      toast('已移除');
      render();
      return;
    }

    /* ---------- 退出 / 客服 ---------- */
    if (act === 'logout') {
      localStorage.removeItem(SESSION_KEY);
      S.me = null; S.club = null; S.roles = []; S.role = null;
      S.staffRoles = {}; S.cache = {}; S.route = 'home';
      render();
      return;
    }

    if (act === 'contact') {
      toast('请在微信内点击右下角客服按钮联系');
      return;
    }

    /* ---------- 报备提交 ---------- */
    if (act === 'submit-report') {
      const isStar = Number(v) === 1;
      const amount   = n($('#rp-amount').value);
      const tip      = n($('#rp-tip').value);
      const discount = n($('#rp-discount').value) || 10;
      const title = $('#rp-title').value.trim() || '陪玩报备';
      const note  = $('#rp-note').value.trim();
      const baseRate  = n(S.club && S.club.commission && S.club.commission.peiwan) || 30;
      const starBonus = n(S.club && S.club.star_bonus) || 15;
      const monthCount = await api.monthCount(S.me.id);
      const res = Calc.report({
        amount, tip, discount, baseRate, isStar, starBonus, monthCount, club: S.club
      });

      if (res.gross <= 0) return toast('请填写有效金额');

      let image = null;
      const f = $('#rp-image').files[0];
      if (f) { toast('上传图片中…'); image = await api.uploadImage(f); }

      const { error } = await sb.from('orders').insert({
        id: uid(), club_id: S.club.id, user_id: S.me.id, type: 'peiwan',
        title, amount, tip, discount, rate: res.rate,
        gross: res.gross, commission: res.commission, net: res.net,
        note, image, settled: false, created_at: Date.now()
      });
      if (error) throw error;
      toast('报备成功，实得 ' + money(res.net));
      S.cache.myRecords = null;
      S.cache.summary = null;
      S.route = 'home';
      render();
      return;
    }

    /* ---------- 派单 / 直属 ---------- */
    if (act === 'load-player-orders') {
      const uidX = $('#pk-user').value;
      if (!uidX) return toast('请先选择陪玩');
      const [s, e] = rangeOf('month');
      const list = await api.orders(S.club.id, s, e, { userId: uidX });
      const rate = n(S.club[v === 'dispatch' ? 'dispatch_rate' : 'direct_rate']);
      const unclaimed = list.filter(o => o.type === 'peiwan' && !o.dispatch_user_id);

      $('#pk-list').innerHTML = unclaimed.length
        ? unclaimed.map(o => `
          <label class="li" style="cursor:pointer">
            <div class="li-l">
              <div class="li-t">${esc(o.title || '单子')}</div>
              <div class="li-s">${hmz(o.created_at)} · 总价 ${money(o.gross)} · 抽成 ${money(Calc.staffCut(o.gross, rate))}</div>
            </div>
            <input type="checkbox" class="pk-chk" value="${o.id}"
                   data-gross="${n(o.gross)}"
                   style="width:20px;height:20px;flex:0 0 auto">
          </label>`).join('') + `
          <div class="hr"></div>
          <div class="between"><span class="t-sub">已选抽成合计</span>
            <span class="mono big" id="pk-sum">¥0</span></div>
          <button class="btn block" style="margin-top:10px"
                  data-act="submit-staff-orders" data-v="${v}" data-rate="${rate}">确认认领</button>`
        : '<div class="empty">该陪玩本月暂无可认领的单子</div>';

      document.querySelectorAll('.pk-chk').forEach(chk => {
        chk.addEventListener('change', () => {
          let sum = 0;
          document.querySelectorAll('.pk-chk:checked').forEach(x => {
            sum += Calc.staffCut(x.dataset.gross, rate);
          });
          const el2 = $('#pk-sum'); if (el2) el2.textContent = money(sum);
        });
      });
      return;
    }

    if (act === 'submit-staff-orders') {
      const rate = n(el.dataset.rate);
      const ids = [...document.querySelectorAll('.pk-chk:checked')].map(x => x.value);
      if (!ids.length) return toast('请先勾选单子');
      let total = 0, okCount = 0;
      for (const oid of ids) {
        const { data: od } = await sb.from('orders')
          .select('id,gross,dispatch_user_id').eq('id', oid).maybeSingle();
        if (!od || od.dispatch_user_id) continue;
        const amt = Calc.staffCut(od.gross, rate);
        const { error } = await sb.from('orders')
          .update({ dispatch_user_id: S.me.id, dispatch_amount: amt })
          .eq('id', oid).is('dispatch_user_id', null);
        if (!error) { total += amt; okCount++; }
      }
      toast(`认领 ${okCount} 单，抽成 ${money(total)}`);
      S.cache.mineStaff = null;
      S.route = 'home';
      render();
      return;
    }

    /* ---------- 外宣提交 ---------- */
    if (act === 'submit-promote') {
      const ep = (S.club && S.club.external_prices) || {};
      const items = [['pei', '宣陪'], ['board', '宣板'], ['app1', '软件流量']];
      const rows = items.map(([k, l]) => ({ k, l, q: n($('#pm-' + k).value) }))
        .filter(x => x.q > 0);
      if (!rows.length) return toast('请填写数量');
      for (const r of rows) {
        const amt = r2(r.q * n(ep[r.k]));
        await sb.from('orders').insert({
          id: uid(), club_id: S.club.id, user_id: S.me.id, type: 'custom',
          title: `${r.l} × ${r.q}`, amount: amt, tip: 0, discount: 10, rate: 0,
          gross: amt, commission: 0, net: amt,
          note: '', image: null, settled: false, created_at: Date.now()
        });
      }
      toast('外宣已提交');
      S.route = 'home';
      render();
      return;
    }

    /* ---------- 罚款 ---------- */
    if (act === 'submit-fine') {
      const uidX = $('#fn-user').value;
      const amt  = n($('#fn-amount').value);
      const note = $('#fn-note').value.trim();
      if (!uidX) return toast('请选择陪玩');
      if (amt <= 0) return toast('请输入罚款金额');
      if (!note) return toast('请填写罚款原因');
      await sb.from('orders').insert({
        id: uid(), club_id: S.club.id, user_id: uidX, type: 'fine',
        title: '罚款：' + note, amount: amt, tip: 0, discount: 10, rate: 0,
        gross: amt, commission: 0, net: -amt,
        note, image: null, settled: false, created_at: Date.now()
      });
      toast('罚款已下发');
      S.route = 'home';
      render();
      return;
    }

    /* ---------- 全部记录删除 / 分页 ---------- */
    if (act === 'del-order') {
      if (!confirmBox('确定删除该记录？')) return;
      await sb.from('orders').delete().eq('id', v);
      S.cache.allRecords = null; S.cache.allPage = 0;
      toast('已删除');
      render();
      return;
    }

    if (act === 'more-records') {
      const page = (S.cache.allPage ?? 0) + 1;
      const more = await api.ordersPage(S.club.id, page);
      S.cache.allRecords = [...(S.cache.allRecords || []), ...more];
      S.cache.allPage = page;
      render();
      return;
    }

    if (act === 'more-my-records') {
      const page = (S.cache.myPage ?? 0) + 1;
      const more = await api.ordersPage(S.club.id, page, { userId: S.me.id });
      S.cache.myRecords = [...(S.cache.myRecords || []), ...more];
      S.cache.myPage = page;
      render();
      return;
    }

    /* ---------- 审核 ---------- */
    if (act === 'claim') {
      const { error } = await sb.from('applications')
        .update({ status: 'reviewing', auditor_id: S.me.id })
        .eq('id', v).eq('status', 'waiting');
      if (error) toast(error.message); else toast('已接单');
      S.cache.hall = null; S.cache.myReview = null;
      render();
      return;
    }

    if (act === 'pass') {
      const { data: app } = await sb.from('applications').select('*').eq('id', v).maybeSingle();
      if (!app) return;
      await sb.from('applications').update({ status: 'passed' }).eq('id', v);

      /* 自动升级用户在该俱乐部的角色为 player */
      const { data: prof } = await sb.from('profiles').select('*').eq('id', app.user_id).maybeSingle();
      if (prof) {
        const roles = (prof.roles || []).map(r =>
          r.club_id === app.club_id ? { ...r, role: 'player' } : r);
        if (!roles.some(r => r.club_id === app.club_id))
          roles.push({ club_id: app.club_id, role: 'player' });
        const patch = { roles };
        if (prof.current_club_id === app.club_id) patch.active_role = 'player';
        await sb.from('profiles').update(patch).eq('id', app.user_id);
      }

      /* 弹窗展示陪玩绑定码 */
      const clubCode = (S.club && S.club.code) || '';
      showModal(`
        <div class="t-title" style="text-align:center">✅ 审核已通过</div>
        <div class="t-body" style="margin:10px 0;text-align:center">
          请将以下【陪玩绑定码】发送给该用户
        </div>
        <div class="card tight mono"
             style="font-size:22px;text-align:center;letter-spacing:3px;padding:18px">
          ${esc(clubCode)}
        </div>
        <div class="t-sub" style="margin:12px 0;text-align:center">
          用户输入后即可解锁正式陪玩身份
        </div>
        <div class="grid2" style="margin-top:12px">
          <button class="btn ghost" data-act="modal-close">关闭</button>
          <button class="btn" data-act="copy" data-v="${esc(clubCode)}">复制绑定码</button>
        </div>`);

      S.cache.hall = null; S.cache.myReview = null; S.cache.reviewList = null;
      render();
      return;
    }

    if (act === 'reject') {
      await sb.from('applications').update({ status: 'rejected' }).eq('id', v);
      toast('已拒绝');
      S.cache.hall = null; S.cache.myReview = null; S.cache.reviewList = null;
      render();
      return;
    }

    /* ---------- 待审陪提交 ---------- */
    if (act === 'submit-apply') {
      const game    = $('#ap-game').value;
      const skill   = $('#ap-skill').value.trim();
      const wechat  = $('#ap-wechat').value.trim();
      const content = $('#ap-content').value.trim();
      if (!game) return toast('请选择申请游戏');
      if (!wechat) return toast('微信号必填');

      let image = null;
      const f = $('#ap-image').files[0];
      if (f) { toast('上传中…'); image = await api.uploadImage(f); }

      await sb.from('applications').insert({
        id: uid(), club_id: S.club.id, user_id: S.me.id,
        username: S.me.nick || S.me.username,
        game, skill, wechat_id: wechat, content, image,
        status: 'waiting', auditor_id: null, created_at: Date.now()
      });
      toast('已提交，等待审核');
      S.cache.myApply = null;
      render();
      return;
    }

    /* ---------- 待审陪解锁绑定码 ---------- */
    if (act === 'redeem-code') {
      const code = $('#nt-code').value.trim();
      if (!code) return toast('请输入绑定码');
      if (!S.club || code !== S.club.code) return toast('绑定码不正确');

      const roles = (S.roles || []).map(r =>
        r.club_id === S.club.id ? { ...r, role: 'player' } : r);
      if (!roles.some(r => r.club_id === S.club.id))
        roles.push({ club_id: S.club.id, role: 'player' });

      await api.saveProfile({ roles, active_role: 'player' });
      await loadContext();
      S.cache = { clubNames: S.cache.clubNames };
      toast('🎉 已解锁正式陪玩身份');
      S.route = 'home';
      render();
      return;
    }

    /* ---------- 导出 Excel ---------- */
    if (act === 'export') {
      const st = S.cache.flowStat;
      if (!st) return toast('暂无数据');
      if (v === 'detail') {
        exportExcel('工资明细',
          ['成员', '身份', '单数', '流水', '罚款', '已结', '应发'],
          st.wages.map(w => [w.name, w.role, w.count, w.gross, w.fine, w.settled, w.should]));
      } else {
        exportExcel('工资汇总',
          ['陪玩应发', '员工应发', '总应发'],
          [[st.wagePlayer, st.wageStaff, st.wageTotal]]);
      }
      return;
    }

    /* ---------- 弹窗关闭 ---------- */
    if (act === 'modal-close') { closeModal(); return; }

  } catch (err) {
    console.error('[click]', err);
    toast(err.message || '操作失败');
  }
});

/* ==================================================================
 * 11. change 事件
 * ================================================================== */
document.addEventListener('change', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'sel-req-game') {
    S.seg.reqGame = el.value;
    render();
    return;
  }
  if (act === 'flow-date') {
    S.seg.flowDate = el.value;
    S.cache.flowStat = null;
    render();
    return;
  }
});

/* ==================================================================
 * 12. 弹窗 / 导出 / 超管数据
 * ================================================================== */
function showModal(html) {
  closeModal();
  const m = document.createElement('div');
  m.className = 'mask';
  m.id = 'modal-mask';
  m.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(m);
  m.addEventListener('click', ev => { if (ev.target === m) closeModal(); });
}
function closeModal() {
  const m = document.getElementById('modal-mask');
  if (m) m.remove();
}

function openSuperModal() {
  showModal(`
    <div class="t-title">🔒 最高管理员</div>
    <div class="t-sub" style="margin-bottom:14px">此入口不隶属于任何俱乐部</div>
    <label class="fld"><span>最高权限密码</span>
      <input id="super-pass" type="password" placeholder="请输入密码"></label>
    <div class="grid2" style="margin-top:14px">
      <button class="btn ghost" data-act="modal-close">取消</button>
      <button class="btn" data-act="super-verify">进入</button>
    </div>`);
}

async function loadSuperData() {
  try {
    const { data: clubs, error: e1 } = await sb.from('clubs')
      .select('id,name,code,staff_code,auditor_code,created_at')
      .order('created_at', { ascending: false }).limit(500);
    if (e1) throw e1;
    
    const { data: codes, error: e2 } = await sb.from('auth_codes')
      .select('*').order('created_at', { ascending: false }).limit(500);
    if (e2) throw e2;

    S.cache.superClubs = clubs || [];
    S.cache.superCodes = codes || [];
  } catch (err) {
    console.error("拉取超管数据失败:", err);
    throw new Error("拉取失败。请确认 CONFIG 里的 SUPABASE_URL 是否正确，以及是否执行了全部建表 SQL。原报错: " + err.message);
  }
}

function exportExcel(name, head, rows) {
  const e2 = s => String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office"
    xmlns:x="urn:schemas-microsoft-com:office:excel"
    xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head>
    <body><table border="1">`;
  html += '<tr>' + head.map(h => `<th>${e2(h)}</th>`).join('') + '</tr>';
  rows.forEach(r => {
    html += '<tr>' + r.map(c => `<td>${e2(c)}</td>`).join('') + '</tr>';
  });
  html += '</table></body></html>';

  const blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${name}_${ymd()}.xls`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 600);
  toast('已导出：' + a.download);
}

/* ==================================================================
 * 13. 修复 View.shell 的 back 页隐藏底栏
 *     （直接覆盖第一段定义，仅影响有 back 的子页面）
 * ================================================================== */
View.shell = function (title, body, opts = {}) {
  const tabs = View.tabsOf();
  const showBack = !!opts.back;
  const header = showBack
    ? `<div class="topbar"><div class="back" data-act="back">‹</div><h1>${esc(title)}</h1><div></div></div>`
    : `<div class="topbar"><h1>${esc(title)}</h1>
         <div class="t-sub">${esc(S.club ? S.club.name : (S.role === 'pending' ? '待审核' : ''))}</div></div>`;
  return `
    ${header}
    ${body}
    ${showBack ? '' : `<div class="tabbar"><div class="tabbar-inner">
      ${tabs.map(([k, label]) =>
        `<div class="tab ${S.route === k ? 'on' : ''}" data-act="tab" data-v="${k}">${label}</div>`).join('')}
    </div></div>`}`;
};

/* ==================================================================
 * 14. 启动
 * ================================================================== */
async function init() {
  applyTheme();

  try {
    /* 超管会话：优先 */
    if (sessionStorage.getItem(SUPER_KEY) === '1' && !localStorage.getItem(SESSION_KEY)) {
      await loadSuperData();
      render();
      return;
    }

    /* 恢复普通会话 */
    const sid = localStorage.getItem(SESSION_KEY);
    if (sid) {
      const prof = await api.profile(sid);
      if (prof) {
        S.me = prof;
        await loadContext();
        S.route = defaultRoute();
      } else {
        localStorage.removeItem(SESSION_KEY);
      }
    }
  } catch (e) {
    console.error('[init]', e);
  }

  render();
}

init();

/* ==================================================================
 * END
 * ================================================================== */
</script>
