<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>暖光陪玩俱乐部管理系统</title>
<style>
/* ================= 核心主题变量 ================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
html,body{height:100%;overflow:hidden}
body{color:var(--text);background:var(--bg);transition:background .35s,color .35s}
body::before{content:'';position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 18% 8%,rgba(255,206,168,.55),transparent 42%),radial-gradient(circle at 84% 22%,rgba(255,232,205,.65),transparent 45%),radial-gradient(circle at 45% 92%,rgba(214,231,255,.55),transparent 48%);filter:blur(28px);transition:opacity .3s}
body[data-theme="glass"]{--bg:#f5f2eb;--primary:#c08c65;--primary-soft:rgba(192,140,101,.14);--card-bg:rgba(255,255,255,.58);--card-border:1px solid rgba(255,255,255,.75);--blur:blur(22px) saturate(160%);--text:#4a4038;--text-sub:#a89b8f;--line:rgba(192,140,101,.16);--radius:26px;--shadow:0 10px 32px rgba(186,155,124,.13);--tab-bg:rgba(255,255,255,.72);--input-bg:rgba(255,255,255,.7);--btn-text:#fff}
body[data-theme="y2k"]{--bg:#ffeef6;--primary:#ff5c8a;--primary-soft:rgba(255,92,138,.15);--card-bg:#ffffff;--card-border:3px solid #1a1a1a;--blur:none;--text:#111111;--text-sub:#8a8a8a;--line:#1a1a1a;--radius:6px;--shadow:5px 5px 0 #1a1a1a;--tab-bg:#ffffff;--input-bg:#ffffff;--btn-text:#111}
body[data-theme="pixel"]{--bg:#f3eddc;--primary:#7a9b5e;--primary-soft:rgba(122,155,94,.18);--card-bg:#fbf6e7;--card-border:3px solid #3a3128;--blur:none;--text:#3a3128;--text-sub:#8b8272;--line:#3a3128;--radius:3px;--shadow:4px 4px 0 #3a3128;--tab-bg:#fbf6e7;--input-bg:#fffdf4;--btn-text:#fffdf4;font-family:monospace}
body[data-theme="y2k"]::before{filter:none;background-image:linear-gradient(rgba(255,92,138,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(255,92,138,.14) 1px,transparent 1px);background-size:22px 22px;background-color:#ffeef6}

/* ================= 布局与基础组件 ================= */
#app{height:100%;position:relative;z-index:1;overflow:hidden}
.screen{height:100%;display:flex;flex-direction:column;overflow:hidden}
.screen.auth{overflow-y:auto;display:block}
.content{flex:1;overflow-y:auto;padding:4px 0 28px}
.content::-webkit-scrollbar{width:0}
.topbar{flex:none;display:flex;align-items:center;gap:10px;padding:18px 18px 10px}
.tb-title{font-size:19px;font-weight:700;letter-spacing:.5px;flex:1}
.tb-back{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card-bg);border:var(--card-border);font-size:16px;cursor:pointer;color:var(--text);flex:none;box-shadow:var(--shadow)}
.tb-btn{padding:7px 14px;border-radius:14px;font-size:12.5px;font-weight:600;background:var(--primary);color:var(--btn-text);cursor:pointer}

/* 卡片 */
.card{background:var(--card-bg);border:var(--card-border);border-radius:var(--radius);backdrop-filter:var(--blur);box-shadow:var(--shadow);padding:18px;margin:0 16px 14px}
.card-title{font-size:14.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-sub{font-size:11.5px;color:var(--text-sub);line-height:1.7;margin-top:10px}
.muted{color:var(--text-sub);font-size:12px}
.tiny{font-size:11px;color:var(--text-sub);line-height:1.7}
.divider{height:1px;background:var(--line);margin:12px 0}

/* 表单与按钮 */
.input,.select,textarea.input{width:100%;padding:13px 15px;border-radius:16px;border:1.5px solid var(--line);background:var(--input-bg);font-size:14px;color:var(--text);outline:none;transition:border-color .2s}
.input:focus,.select:focus,textarea.input:focus{border-color:var(--primary)}
.field{margin-bottom:12px}
.field-label{font-size:12px;color:var(--text-sub);margin-bottom:7px;font-weight:600}
textarea.input{resize:vertical;min-height:76px;line-height:1.6}
.row{display:flex;gap:10px}
.row>*{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:16px;border:none;font-size:14px;font-weight:600;cursor:pointer;background:var(--primary-soft);color:var(--text);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--btn-text);box-shadow:0 6px 18px rgba(192,140,101,.28)}
.btn.block{width:100%;margin-top:12px}
.btn.sm{padding:8px 14px;font-size:12.5px;border-radius:12px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn.danger{background:rgba(226,110,110,.14);color:#d05c5c}

/* 分段与标签 */
.seg{display:flex;background:var(--primary-soft);border-radius:16px;padding:4px;gap:4px;margin:0 16px 14px}
.seg-item{flex:1;text-align:center;padding:10px 6px;border-radius:12px;font-size:13px;font-weight:600;color:var(--text-sub);cursor:pointer;transition:.2s}
.seg-item.active{background:var(--card-bg);color:var(--primary);box-shadow:0 3px 10px rgba(0,0,0,.06)}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:14px;font-size:13px;font-weight:600;background:var(--card-bg);border:var(--card-border);color:var(--text-sub);cursor:pointer}
.chip.active{background:var(--primary);color:var(--btn-text);border-color:transparent}

/* 底栏 */
.tabbar{flex:none;display:flex;padding:8px 6px calc(10px + env(safe-area-inset-bottom));background:var(--tab-bg);backdrop-filter:blur(24px);border-top:1.5px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;color:var(--text-sub);transition:.2s}
.tab span{font-size:19px;line-height:1}
.tab em{font-style:normal;font-size:10.5px;font-weight:600}
.tab.active{color:var(--primary)}
.tab.active span{transform:translateY(-1px)}

/* 列表项与标签 */
.list-item{padding:13px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.li-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.li-title{font-size:14px;font-weight:600}
.li-desc{font-size:11.5px;color:var(--text-sub);margin-top:4px}
.li-actions{display:flex;gap:8px;margin-top:10px}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:9px;font-size:10.5px;font-weight:700}
.tag.ok{background:rgba(120,190,140,.18);color:#4e9b6b}
.tag.warn{background:rgba(240,180,90,.18);color:#c58a2c}
.tag.bad{background:rgba(226,110,110,.16);color:#d05c5c}
.tag.info{background:var(--primary-soft);color:var(--primary)}

/* 统计格 */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--primary-soft);border-radius:18px;padding:13px 14px}
.stat b{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px}
.stat span{font-size:11px;color:var(--text-sub);font-weight:600}

/* 快捷入口（长方形） */
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick-btn{display:flex;align-items:center;gap:10px;padding:15px 16px;border-radius:18px;background:var(--primary-soft);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--text);border:1.5px solid transparent}
.quick-btn i{font-style:normal;font-size:17px}

/* 折叠面板 */
.panel{background:var(--card-bg);border:var(--card-border);border-radius:var(--radius);box-shadow:var(--shadow);margin:0 16px 14px;overflow:hidden}
.panel-head{padding:16px 18px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:700}
.panel-head .arrow{margin-left:auto;font-size:11px;color:var(--text-sub);transition:.25s}
.panel.open .panel-head .arrow{transform:rotate(90deg)}
.panel-body{display:none;padding:0 18px 18px}
.panel.open .panel-body{display:block}

/* 记录条目 */
.rec{padding:14px;border-radius:18px;background:var(--primary-soft);margin-bottom:10px;border-left:4px solid transparent}
.rec.settled{border-left-color:#6fbf8b;background:rgba(120,190,140,.11)}
.rec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.rec-title{font-size:13.5px;font-weight:700}
.rec-meta{font-size:11.5px;color:var(--text-sub);line-height:1.8}
.rec-imgs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.rec-imgs img{width:56px;height:56px;object-fit:cover;border-radius:10px}
.rec-remark{margin-top:8px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.55);font-size:11.5px;color:var(--text-sub);line-height:1.6}

/* 头像与空状态 */
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:23px;background:var(--primary-soft);flex:none}
.empty{text-align:center;padding:38px 20px;color:var(--text-sub);font-size:12.5px;line-height:1.9}
.empty .ico{font-size:34px;display:block;margin-bottom:10px;opacity:.55}

/* 选择项 */
.pick{display:flex;align-items:center;gap:10px;padding:13px 15px;border-radius:16px;background:var(--card-bg);border:1.5px solid var(--line);margin-bottom:9px;cursor:pointer;font-size:13.5px}
.pick.active{border-color:var(--primary);background:var(--primary-soft)}
.pick .dot{width:17px;height:17px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:10px;color:transparent}
.pick.active .dot{background:var(--primary);border-color:var(--primary);color:#fff}
.pick .grow{flex:1;min-width:0}

/* 折叠长条（加价/折扣） */
.foldbar{border-radius:16px;background:var(--primary-soft);overflow:hidden;margin-bottom:12px}
.foldbar-head{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:600;cursor:pointer}
.foldbar-head .val{color:var(--primary);font-weight:800}
.foldbar-body{display:none;padding:0 16px 16px}
.foldbar.open .foldbar-body{display:block}
.numgrid{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.numgrid b{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:var(--card-bg);font-size:13px;font-weight:700;cursor:pointer}
.numgrid b.active{background:var(--primary);color:var(--btn-text)}

/* 图片上传与弹窗 */
.uploader{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.up-btn{width:66px;height:66px;border-radius:14px;display:grid;place-items:center;background:var(--primary-soft);font-size:22px;color:var(--text-sub);cursor:pointer}
.up-preview{position:relative;width:66px;height:66px}
.up-preview img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.up-preview .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#d05c5c;color:#fff;font-size:12px;display:grid;place-items:center;cursor:pointer}
.mask{position:fixed;inset:0;background:rgba(60,50,40,.42);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:22px}
.modal{width:100%;max-width:400px;max-height:80vh;overflow-y:auto;background:var(--bg);border-radius:26px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-title{font-size:16px;font-weight:800;margin-bottom:6px}
.modal-body{font-size:13px;line-height:1.85;color:var(--text-sub);margin:12px 0 18px;white-space:pre-wrap}
.hidden{display:none!important}
</style>
</head>
<body data-theme="glass">
<div id="app"></div>
<script>
// ================= 基础数据与状态 =================
const S = { screen: 'login', nav: 'home', sub: null, form: {}, tabs: {}, modal: null, params: {} };
let session = JSON.parse(localStorage.getItem('pw_session') || 'null');
let DB = null;

const uid = () => Math.random().toString(36).slice(2, 9);
const money = n => '¥' + (Number(n)||0).toFixed(2);
const fmtDate = ts => { const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()}`; };
const fmtTime = ts => { const d = new Date(ts); return `${fmtDate(ts)} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; };
const mStart = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); };

function saveDB() { localStorage.setItem('pw_db', JSON.stringify(DB)); }
function me() { return session ? DB.users.find(u => u.id === session.userId) : null; }
function curRole() { const u = me(); return u ? (u.roles.find(r => r.clubId === u.currentClubId) || u.roles[0]) : null; }
function curClub() { const u = me(); return u ? DB.clubs.find(c => c.id === u.currentClubId) : null; }
const isAdmin = () => curRole()?.role === 'admin';
const isReadOnly = () => ['leader','vice_leader'].includes(curRole()?.role);
const isPlayer = () => curRole()?.role === 'player';
const isPending = () => curRole()?.role === 'pending';

// ================= 初始化种子数据 =================
function initDB() {
  const raw = localStorage.getItem('pw_db');
  if (raw) { try { DB = JSON.parse(raw); return; } catch(e){} }
  
  const now = Date.now(), C = 'c1';
  DB = {
    clubs: [{ id: C, name: '暖光俱乐部', playerCode: 'PW-8888', staffCode: 'ST-8888', reviewCode: 'RV-8888', ownerId: 'u1', createdAt: now, settings: { base: 20, dispatch: 10, direct: 5, topBonus: 15, topPlayers: ['u2'], tiers: [{min:10, reduce:1}, {min:20, reduce:2}], externalPrices: {'宣陪':5, '软件流量':2}, externalTiers: [{id:'t1', name:'小档', volume:100}, {id:'t2', name:'中档', volume:500}], popup: { title: '恭喜通过审核 🎉', content: '欢迎加入暖光！\n请前往【设置 -> 身份/俱乐部】输入陪玩绑定码解锁权限。' }, requirements: { '王者荣耀': [{title:'基本要求', items:['星耀以上', '有麦']}], '英雄联盟': [{title:'基本要求', items:['钻石以上', '有麦']}] }, rewards: { enabled: true, cycle: 'month', basis: 'gross', tiers: { player: [{target:1000, amount:50}], direct: [{target:500, amount:30}], dispatch: [{target:500, amount:30}] } } } }],
    users: [
      { id: 'u1', username: 'admin', password: '123456', nickname: '管理员', avatar: '👑', currentClubId: C, theme: 'glass', roles: [{ clubId: C, role: 'admin', joinedAt: now - 100*86400000 }] },
      { id: 'u2', username: 'player', password: '123456', nickname: '小星', avatar: '⭐', currentClubId: C, theme: 'glass', roles: [{ clubId: C, role: 'player', joinedAt: now - 50*86400000 }] },
      { id: 'u3', username: 'staff', password: '123456', nickname: '阿派', avatar: '📋', currentClubId: C, theme: 'glass', roles: [{ clubId: C, role: 'staff', jobs: ['派单','审核'], joinedAt: now - 30*86400000 }] },
      { id: 'u4', username: 'leader', password: '123456', nickname: '团长', avatar: '🛡️', currentClubId: C, theme: 'glass', roles: [{ clubId: C, role: 'leader', joinedAt: now - 80*86400000 }] },
      { id: 'u5', username: 'pending', password: '123456', nickname: '新人', avatar: '🌱', currentClubId: C, theme: 'glass', roles: [{ clubId: C, role: 'pending', joinedAt: now - 2*86400000 }] }
    ],
    games: [{ id: 'g1', clubId: C, name: '王者荣耀', projects: [{ id: 'p1', name: '排位上分', durations: [{ id: 'd1', name: '1小时', price: 30 }, { id: 'd2', name: '2小时', price: 55 }] }] }],
    gifts: [{id:'gf1', clubId:C, name:'小花花', price:5}],
    orders: Array.from({length: 35}).map((_, i) => {
      const gross = 30 + (i%5)*10, net = gross * 0.8;
      return { id: 'o'+i, clubId: C, playerId: 'u2', playerName: '小星', gameName: '王者荣耀', projectName: '排位上分', durationName: '1小时', gross, net, commissionRate: 20, settled: i%3===0, createdAt: now - i*3600000, remark: i%4===0?'客人很满意':'' };
    }),
    promotions: [], fines: [], applications: [
      { id: 'a1', clubId: C, userId: 'u5', userName: '新人', game: '王者荣耀', position: '打野', wechat:'wx123', status: 'waiting', createdAt: now }
    ], notices: [], authCodes: [{ id: 'ac1', code: 'A3K9-F2M8', used: false }]
  };
  saveDB();
}

// ================= 渲染核心 =================
function render() {
  const u = me();
  document.body.dataset.theme = u ? (u.theme || 'glass') : 'glass';
  let html = '';

  if (!session) {
    if (S.screen === 'register') html = pageRegister();
    else if (S.screen === 'super') html = pageSuperAdmin();
    else html = pageLogin();
  } else {
    if (S.modal) {
      html = renderMain() + `<div class="mask" data-act="closeModal"><div class="modal">${S.modal}</div></div>`;
    } else {
      html = S.sub ? renderSub() : renderMain();
    }
  }
  document.getElementById('app').innerHTML = html;
}

function renderMain() {
  const pages = { home: pageHome, review: pageReview, pending: pagePending, finance: pageFinance, ranking: pageRanking, settings: pageSettings };
  const body = (pages[S.nav] || pageHome)();
  
  let tabs = '';
  if (isAdmin() || isReadOnly() || curRole()?.role === 'staff') {
    tabs = `<div class="tabbar">
      <div class="tab ${S.nav==='home'?'active':''}" data-act="nav" data-v="home"><span>🏠</span><em>主页</em></div>
      <div class="tab ${S.nav==='review'?'active':''}" data-act="nav" data-v="review"><span>✅</span><em>审核</em></div>
      <div class="tab ${S.nav==='finance'?'active':''}" data-act="nav" data-v="finance"><span>📊</span><em>流水</em></div>
      <div class="tab ${S.nav==='ranking'?'active':''}" data-act="nav" data-v="ranking"><span>🏆</span><em>榜单</em></div>
      <div class="tab ${S.nav==='settings'?'active':''}" data-act="nav" data-v="settings"><span>⚙️</span><em>设置</em></div>
    </div>`;
  } else {
    tabs = `<div class="tabbar">
      <div class="tab ${S.nav==='home'?'active':''}" data-act="nav" data-v="home"><span>🏠</span><em>主页</em></div>
      <div class="tab ${S.nav==='pending'?'active':''}" data-act="nav" data-v="pending"><span>📝</span><em>待审</em></div>
      <div class="tab ${S.nav==='finance'?'active':''}" data-act="nav" data-v="finance"><span>📊</span><em>流水</em></div>
      <div class="tab ${S.nav==='ranking'?'active':''}" data-act="nav" data-v="ranking"><span>🏆</span><em>榜单</em></div>
      <div class="tab ${S.nav==='settings'?'active':''}" data-act="nav" data-v="settings"><span>⚙️</span><em>设置</em></div>
    </div>`;
  }
  return `<div class="screen">${body}${tabs}</div>`;
}

function renderSub() {
  const subs = { report: pageReport, claim: pageClaim, promote: pagePromote, fine: pageFine, records: pageRecords, reviewList: pageReviewList };
  const body = (subs[S.sub] || (()=>'<div class="empty">开发中</div>'))();
  return `<div class="screen">${body}</div>`;
}

function topbar(title, back=false, right='') {
  return `<div class="topbar">${back ? '<div class="tb-back" data-act="back">←</div>' : ''}<div class="tb-title">${title}</div>${right}</div>`;
}

// ================= 页面：登录与注册 =================
function pageLogin() {
  return `<div class="screen auth" style="padding-top:80px">
    <div class="center" style="margin-bottom:30px">
      <div style="font-size:50px;margin-bottom:10px">🌸</div>
      <div style="font-size:22px;font-weight:800">暖光陪玩</div>
      <div class="tiny mt8">温暖相伴，从这一次登录开始。</div>
    </div>
    <div class="card">
      <div class="field"><input class="input" id="lUser" placeholder="账号 (如 admin)" value="admin"></div>
      <div class="field"><input class="input" id="lPass" type="password" placeholder="密码 (123456)" value="123456"></div>
      <button class="btn primary block" data-act="login">登 录</button>
      <div class="center mt16"><span class="tiny" style="color:var(--primary);cursor:pointer" data-act="toReg">没有账号？去注册</span></div>
    </div>
    <div style="position:fixed;right:20px;bottom:20px;width:46px;height:46px;border-radius:50%;background:var(--card-bg);display:grid;place-items:center;cursor:pointer;opacity:.5" data-act="toSuper">🔒</div>
  </div>`;
}

function pageRegister() {
  const mode = S.tabs.regMode || 'join';
  return `<div class="screen auth">
    ${topbar('注册', true)}
    <div class="seg">
      <div class="seg-item ${mode==='join'?'active':''}" data-act="regTab" data-v="join">加入俱乐部</div>
      <div class="seg-item ${mode==='new'?'active':''}" data-act="regTab" data-v="new">开新俱乐部</div>
    </div>
    <div class="card">
      <div class="field"><div class="field-label">用户名</div><input class="input" id="rUser" placeholder="用于登录"></div>
      <div class="field"><div class="field-label">密码</div><input class="input" id="rPass" type="password" placeholder="设置密码"></div>

      <button class="btn sm ghost" onclick="alert('已导出')">导出汇总</button>
    </div>`;

  return `${topbar('流水')}
  <div class="seg">
    <div class="seg-item ${tab==='stats'?'active':''}" data-act="setTab" data-k="finTab" data-v="stats">流水统计</div>
    <div class="seg-item ${tab==='salary'?'active':''}" data-act="setTab" data-k="finTab" data-v="salary">工资表</div>
  </div>
  <div class="content">
    <div class="card" style="padding:10px"><input class="input" type="date" value="${new Date().toISOString().split('T')[0]}"></div>
    <div class="card">
      <div class="tiny mb12">${tab==='stats'?'一串数字背后，藏着所有人默默的努力。':'账目清晰分明，不辜负每一份汗水。'}</div>
      ${tab==='stats'?stats:salary}
    </div>
  </div>`;
}

// ================= 页面：设置（核心权限控制） =================
function pageSettings() {
  const u = me(), c = curClub(), editable = isAdmin();
  const panels = S.tabs.panels || {};

  const roleSwitch = `
  <div class="card">
    <div class="card-title">账号资料</div>
    <div class="field"><div class="field-label">用户名(只读)</div><input class="input" readonly value="${u.username}" style="opacity:.6"></div>
    <div class="field"><div class="field-label">昵称</div><input class="input" value="${u.nickname}" data-model="sNick"></div>
    ${editable?'<button class="btn primary block" data-act="saveNick">保存昵称</button>':''}
    <div class="card-sub">昵称随心更换，但独一无二的是你本身。</div>
  </div>
  <div class="card">
    <div class="card-title">身份 / 俱乐部</div>
    ${u.roles.map(r=>{const cc=DB.clubs.find(x=>x.id===r.clubId); return `
      <div class="pick ${r.clubId===u.currentClubId?'active':''}" data-act="switchRole" data-club="${r.clubId}">
        <div class="grow"><div style="font-weight:600">${cc?.name} · ${r.role}</div></div>
        ${r.clubId===u.currentClubId?'<span class="tag ok">当前</span>':''}
      </div>`;}).join('')}
    <div class="card-sub">切换身份页面会刷新，不用紧张哈。</div>
  </div>`;

  // 只有管理员才能看到这些复杂配置，团长/副团只显示只读列表
  const adminPanels = editable ? `
  <div class="panel ${panels.p1?'open':''}">
    <div class="panel-head" data-act="togglePanel" data-k="p1">🏠 俱乐部信息<span class="arrow">▶</span></div>
    <div class="panel-body">
      <div class="field"><div class="field-label">名称</div><input class="input" value="${c.name}" data-model="cName"></div>
      <div class="between" style="padding:8px 0"><span>陪玩码</span><b>${c.playerCode}</b><button class="btn sm ghost" data-act="copy" data-t="${c.playerCode}">复制</button></div>
      <div class="between" style="padding:8px 0"><span>员工码</span><b>${c.staffCode}</b><button class="btn sm ghost" data-act="copy" data-t="${c.staffCode}">复制</button></div>
      <button class="btn primary block mt12" data-act="saveClub">保存</button>
    </div>
  </div>
  <div class="panel ${panels.p2?'open':''}">
    <div class="panel-head" data-act="togglePanel" data-k="p2">⚙️ 业务与抽成<span class="arrow">▶</span></div>
    <div class="panel-body">
      <div class="row"><div class="field"><div class="field-label">基础抽成%</div><input class="input" type="number" value="${c.settings.base}" data-model="sBase"></div>
      <div class="field"><div class="field-label">头牌加成%</div><input class="input" type="number" value="${c.settings.topBonus}" data-model="sTopBonus"></div></div>
      <div class="field"><div class="field-label">本月头牌(搜索)</div><input class="input" placeholder="🔍 搜索陪玩" data-model="topKw"></div>
      <div class="card-sub">阶梯减成配置：满10单减1%，满20单减2%...</div>
      <button class="btn primary block mt12" data-act="saveBiz">保存设置</button>
    </div>
  </div>
  <div class="panel ${panels.p3?'open':''}">
    <div class="panel-head" data-act="togglePanel" data-k="p3">🎮 项目与礼物<span class="arrow">▶</span></div>
    <div class="panel-body">
      ${DB.games.map(g=>`<div style="margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px">
        <b>${g.name}</b>
        ${g.projects.map(p=>`<div class="tiny mt8">· ${p.name} (${p.durations.map(d=>d.name+':'+d.price).join(', ')})</div>`).join('')}
      </div>`).join('')}
      <div class="field mt12"><div class="field-label">新增项目名称</div><input class="input" placeholder="自定义名称" data-model="newProj"></div>
      <button class="btn ghost block" data-act="addProj">+ 添加</button>
    </div>
  </div>
  <div class="panel ${panels.p4?'open':''}">
    <div class="panel-head" data-act="togglePanel" data-k="p4">🎁 流水奖励设置<span class="arrow">▶</span></div>
    <div class="panel-body">
      <div class="pick ${c.settings.rewards.enabled?'active':''}" data-act="toggleReward"><div class="dot">✓</div><div class="grow">开启流水奖励</div></div>
      <div class="field"><div class="field-label">计算方式</div><select class="select"><option>单子总价流水</option><option>纯工资流水</option></select></div>
      <div class="field"><div class="field-label">结算周期</div><select class="select"><option>按月</option><option>按周</option></select></div>
      <div class="tiny mt12">陪玩奖励阶梯: 满1000元奖50元</div>
      <button class="btn primary block mt12" data-act="saveReward">保存奖励设置</button>
    </div>
  </div>
  <div class="panel ${panels.p5?'open':''}">
    <div class="panel-head" data-act="togglePanel" data-k="p5">📋 待审设置<span class="arrow">▶</span></div>
    <div class="panel-body">
      <div class="field"><div class="field-label">弹窗标题</div><input class="input" value="${c.settings.popup.title}" data-model="popTitle"></div>
      <div class="field"><div class="field-label">弹窗内容</div><textarea class="input" data-model="popContent">${c.settings.popup.content}</textarea></div>
      <button class="btn primary block mt12" data-act="savePending">保存设置</button>
    </div>
  </div>` : `
  <div class="card">
    <div class="card-title">🏠 俱乐部信息（只读）</div>
    <div class="tiny">名称：${c.name}</div>
    <div class="tiny mt8">陪玩码：${c.playerCode}</div>
    <div class="tiny mt8">员工码：${c.staffCode}</div>
  </div>
  <div class="card">
    <div class="card-title">⚙️ 业务参数（只读）</div>
    <div class="tiny">基础抽成：${c.settings.base}%</div>
    <div class="tiny mt8">头牌加成：${c.settings.topBonus}%</div>
  </div>`;

  return `${topbar('设置')}
  <div class="content">
    ${roleSwitch}
    ${adminPanels}
    <div class="card">
      <div class="card-title">公共设置</div>
      <div class="row" style="margin-bottom:14px">
        ${['glass','y2k','pixel'].map(t=>`<button class="btn sm ${u.theme===t?'primary':'ghost'}" data-act="setTheme" data-v="${t}">${t.toUpperCase()}</button>`).join('')}
      </div>
      <button class="btn danger block" data-act="logout">退出登录</button>
      <div class="card-sub">调整好喜欢的配置，来日继续好好努力。</div>
    </div>
  </div>`;
}

// ================= 事件绑定 =================
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v, u = me(), c = curClub();

  if (act === 'login') {
    const un = document.getElementById('lUser').value.trim(), pw = document.getElementById('lPass').value;
    const user = DB.users.find(x => x.username === un && x.password === pw);
    if (!user) return alert('账号密码错误');
    session = { userId: user.id }; localStorage.setItem('pw_session', JSON.stringify(session));
    S.nav = 'home'; render();
  }
  else if (act === 'logout') { session = null; localStorage.removeItem('pw_session'); render(); }
  else if (act === 'toReg') { S.screen = 'register'; render(); }
  else if (act === 'toSuper') { if(prompt('输入超管密码') === '846467554jxjsjsisjidbdgujwqkjsuxhv；@') { S.screen='super'; render(); } }
  else if (act === 'regTab') { S.tabs.regMode = v; render(); }
  else if (act === 'back') { S.screen = 'login'; S.sub = null; render(); }
  
  else if (act === 'nav') { S.nav = v; S.sub = null; S.form = {}; render(); }
  else if (act === 'openSub') { S.sub = v; S.params = { type: el.dataset.t || 'dispatch' }; S.form = {}; render(); }
  else if (act === 'setTheme') { u.theme = v; saveDB(); render(); }
  else if (act === 'setTab') { S.tabs[el.dataset.k] = v; render(); }
  
  else if (act === 'toggleFold') { const k = el.dataset.k; S.tabs[k] = !S.tabs[k]; render(); }
  else if (act === 'setExtra') { S.form.rExtra = Number(v); render(); }
  else if (act === 'setDisc') { S.form.rDisc = Number(v); render(); }
  else if (act === 'toggleSettled') { S.form.rSettled = !S.form.rSettled; render(); }
  else if (act === 'submitReport') {
    const g = DB.games.find(x=>x.id===S.form.rGame) || DB.games[0], p = g.projects[0], d = p.durations[0];
    const gross = (d.price + (Number(S.form.rExtra)||0)) * ((Number(S.form.rDisc)||10)/10);
    DB.orders.unshift({ id: 'o'+uid(), clubId: c.id, playerId: u.id, playerName: u.nickname, gameName: g.name, projectName: p.name, durationName: d.name, gross, net: gross*0.8, commissionRate: 20, settled: !!S.form.rSettled, remark: S.form.rRemark||'', images: S.form.rImages||[], createdAt: Date.now() });
    saveDB(); S.form = {}; alert('报备成功！'); render();
  }
  
  else if (act === 'pickPlayer') { S.params.pid = el.dataset.id; render(); }
  else if (act === 'togglePick') {
    const id = el.dataset.id, arr = S.form.picked || [];
    S.form.picked = arr.includes(id) ? arr.filter(x=>x!==id) : [...arr, id]; render();
  }
  else if (act === 'submitClaim') { alert('拉单成功！'); S.sub = null; render(); }
  
  else if (act === 'submitPromote') { alert('提交外宣成功'); S.sub = null; render(); }
  
  else if (act === 'grabApp') {
    const a = DB.applications.find(x=>x.id===el.dataset.id);
    if(a) { a.status='reviewing'; a.reviewerId=u.id; saveDB(); render(); }
  }
  else if (act === 'passApp') {
    const a = DB.applications.find(x=>x.id===el.dataset.id);
    if(a) { a.status='passed'; saveDB(); alert('已通过审核'); render(); }
  }
  else if (act === 'rejectApp') {
    const a = DB.applications.find(x=>x.id===el.dataset.id);
    if(a) { a.status='rejected'; saveDB(); render(); }
  }
  
  else if (act === 'submitApp') {
    DB.applications.unshift({ id:'a'+uid(), clubId:c.id, userId:u.id, userName:u.nickname, game:S.form.pGame||'王者荣耀', position:S.form.pPos||'', status:'waiting', createdAt:Date.now() });
    saveDB(); alert('提交成功'); render();
  }
  else if (act === 'bindCode') {
    if (S.form.bindCode === c.playerCode) { u.roles.find(r=>r.clubId===c.id).role = 'player'; saveDB(); alert('绑定成功！'); location.reload(); }
    else alert('绑定码不正确');
  }
  
  else if (act === 'saveNick') { if (S.form.sNick) u.nickname = S.form.sNick; saveDB(); alert('已保存'); render(); }
  else if (act === 'switchRole') {
    u.currentClubId = el.dataset.club; saveDB(); S.nav = 'home'; S.form = {}; render(); alert('已切换刷新');
  }
  else if (act === 'togglePanel') { const k = el.dataset.k; S.tabs.panels = S.tabs.panels||{}; S.tabs.panels[k] = !S.tabs.panels[k]; render(); }
  else if (act === 'saveBiz') { if(S.form.sBase) c.settings.base = Number(S.form.sBase); saveDB(); alert('已保存'); render(); }
  
  else if (act === 'closeModal') { S.modal = null; render(); }
  else if (act === 'previewImg') { S.modal = `<img src="${el.dataset.src}" style="width:100%;border-radius:12px">`; render(); }
  else if (act === 'delImg') { const t = el.dataset.t; S.form[t].splice(el.dataset.i,1); render(); }
});

document.addEventListener('input', e => {
  const el = e.target.closest('[data-model]');
  if (el) {
    S.form[el.dataset.model] = el.value;
    // 下拉框特殊处理
    if (el.tagName === 'SELECT') {
      if (el.dataset.act === 'selGame') { S.form.rGame = el.value; S.form.rProj = null; S.form.rDur = null; }
      if (el.dataset.act === 'selProj') { S.form.rProj = el.value; S.form.rDur = null; }
      if (el.dataset.act === 'selDur') { S.form.rDur = el.value; }
      if (el.dataset.act === 'selPType') { S.form.pType = el.value; }
      if (el.dataset.act === 'selPendingGame') { S.form.pGame = el.value; }
      render();
    }
    // 搜索处理
    if (['claimKw', 'recKw', 'topKw'].includes(el.dataset.model)) render();
  }
});

document.addEventListener('change', e => {
  if (e.target.dataset.act === 'uploadImg') {
    const files = e.target.files; if (!files.length) return;
    const t = e.target.dataset.target;
    const reader = new FileReader();
    reader.onload = ev => { S.form[t] = S.form[t] || []; S.form[t].push(ev.target.result); render(); };
    reader.readAsDataURL(files[0]);
  }
});

// ================= 启动 =================
initDB();
if (session && !me()) { session = null; localStorage.removeItem('pw_session'); }
render();
</script>
