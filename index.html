<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>陪玩俱乐部报备系统</title>
<style>
:root{--accent:#7c5cff;--accent2:#6b47f5;--accent-text:#a98dff;--accent-glow:rgba(124,92,255,.12);--accent-soft:rgba(124,92,255,.15);--accent-border:rgba(124,92,255,.25);--bg-body:#0f1117;--bg-glow:#241f4d;--card-bg:#181b25;--input-bg:#11141c;--border:#272c3a;--border-soft:#1f2431;--chip-bg:#232838;--topbar-bg:rgba(15,17,23,.93);--tabbar-bg:rgba(20,23,32,.96);--text:#e8eaf0;--mut:#8b90a0}
html[data-theme="red"]{--accent:#e8394f;--accent2:#c92a40;--accent-text:#ff8a95;--accent-glow:rgba(232,57,79,.12);--accent-soft:rgba(232,57,79,.15);--accent-border:rgba(232,57,79,.28);--bg-body:#120d0e;--bg-glow:#3d141c;--card-bg:#1c1416;--input-bg:#140e10;--border:#332026;--border-soft:#261a1d;--chip-bg:#2a1e21;--topbar-bg:rgba(18,13,14,.93);--tabbar-bg:rgba(24,17,19,.96)}
html[data-theme="orange"]{--accent:#ff8a2b;--accent2:#f0731a;--accent-text:#ffb070;--accent-glow:rgba(255,138,43,.12);--accent-soft:rgba(255,138,43,.15);--accent-border:rgba(255,138,43,.28);--bg-body:#120e09;--bg-glow:#3d2408;--card-bg:#1d1710;--input-bg:#15100a;--border:#332618;--border-soft:#261d13;--chip-bg:#2a2016;--topbar-bg:rgba(18,14,9,.93);--tabbar-bg:rgba(24,19,12,.96)}
html[data-theme="green"]{--accent:#22c96b;--accent2:#16a957;--accent-text:#6ee7a0;--accent-glow:rgba(34,201,107,.12);--accent-soft:rgba(34,201,107,.15);--accent-border:rgba(34,201,107,.28);--bg-body:#0b120e;--bg-glow:#0f3d26;--card-bg:#111d17;--input-bg:#0c1511;--border:#1a3328;--border-soft:#14261e;--chip-bg:#182b21;--topbar-bg:rgba(11,18,14,.93);--tabbar-bg:rgba(15,24,19,.96)}
html[data-theme="cyan"]{--accent:#1ec8e0;--accent2:#12aec6;--accent-text:#67e8f9;--accent-glow:rgba(30,200,224,.12);--accent-soft:rgba(30,200,224,.15);--accent-border:rgba(30,200,224,.28);--bg-body:#0a1216;--bg-glow:#0e3540;--card-bg:#101c22;--input-bg:#0b151a;--border:#1a3038;--border-soft:#14252c;--chip-bg:#182a31;--topbar-bg:rgba(10,18,22,.93);--tabbar-bg:rgba(14,24,29,.96)}
html[data-theme="blue"]{--accent:#3b82f6;--accent2:#2563eb;--accent-text:#7cb8ff;--accent-glow:rgba(59,130,246,.12);--accent-soft:rgba(59,130,246,.15);--accent-border:rgba(59,130,246,.28);--bg-body:#0a1018;--bg-glow:#0f264d;--card-bg:#111826;--input-bg:#0c131c;--border:#1a2940;--border-soft:#14202f;--chip-bg:#182436;--topbar-bg:rgba(10,16,24,.93);--tabbar-bg:rgba(14,20,28,.96)}
html[data-theme="purple"]{--accent:#a855f7;--accent2:#9333ea;--accent-text:#c084fc;--accent-glow:rgba(168,85,247,.12);--accent-soft:rgba(168,85,247,.15);--accent-border:rgba(168,85,247,.28);--bg-body:#100b16;--bg-glow:#2d1145;--card-bg:#171020;--input-bg:#110c18;--border:#2a1b3a;--border-soft:#20152c;--chip-bg:#251833;--topbar-bg:rgba(16,11,22,.93);--tabbar-bg:rgba(20,14,28,.96)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg-body);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
.hidden{display:none!important}
input,select,button,textarea{font-family:inherit;font-size:14px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=month],select{width:100%;padding:11px 13px;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;color:var(--text);outline:none;transition:.15s;-webkit-appearance:none;appearance:none}
input::placeholder{color:#565c6e}
input:focus,select:focus{border-color:var(--accent);background:var(--card-bg);box-shadow:0 0 0 3px var(--accent-glow)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:disabled{opacity:.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--chip-bg);color:var(--text);cursor:pointer;transition:.15s;font-weight:500;white-space:nowrap}
.btn:hover{filter:brightness(1.18)}.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 6px 20px -8px var(--accent)}
.btn.block{width:100%;padding:13px}.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}.btn.ghost{background:transparent}
.btn.danger{background:#3a1a1e;border-color:#5b2429;color:#ff8189}.btn.danger:hover{background:#4a1f24;filter:none}
.btn.warn{background:#3a2a12;border-color:#5b421f;color:#fbbf24}.btn.warn:hover{background:#4a3517;filter:none}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;margin-bottom:14px;font-size:15px}
.field{margin-bottom:14px}.field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:7px;font-weight:500}
.hint{font-size:12px;color:var(--mut);opacity:.85;margin-top:6px;line-height:1.5}
.seg{display:flex;background:var(--input-bg);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border:0;background:transparent;color:var(--mut);border-radius:9px;cursor:pointer;font-weight:500;transition:.15s;font-size:13px}
.seg button.active{background:var(--accent);color:#fff;box-shadow:0 4px 14px -6px var(--accent)}
.badge{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent-text);font-weight:600;border:1px solid var(--accent-border)}
.badge.gray{background:var(--chip-bg);color:var(--mut);border-color:var(--border)}
.badge.gold{background:rgba(251,191,36,.15);color:#fbbf24;border-color:rgba(251,191,36,.3)}
.mut{color:var(--mut)}.small{font-size:12px}.ok{color:#22c55e}.warn{color:#ef4444}.gold{color:#fbbf24}.pri{color:var(--accent-text)}
.empty{text-align:center;color:var(--mut);opacity:.7;padding:28px 0;font-size:13px}
#authView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(ellipse at 50% -10%,var(--bg-glow) 0%,var(--bg-body) 55%)}
.auth-box{width:100%;max-width:400px}
.brand{text-align:center;margin-bottom:26px}
.brand-logo{font-size:52px;line-height:1;margin-bottom:10px}
.brand h1{margin:0 0 6px;font-size:24px;letter-spacing:-.5px}.brand p{margin:0;color:var(--mut);font-size:13px}
#appView{min-height:100vh;padding-bottom:88px}
#topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;background:var(--topbar-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.tb-club{font-weight:700;font-size:15.5px;letter-spacing:-.2px}.tb-sub{font-size:11.5px;color:var(--mut);margin-top:1px}
#content{padding:16px 16px 20px;max-width:780px;margin:0 auto}
#tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--tabbar-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--mut);padding:6px 2px;border-radius:10px;cursor:pointer;font-size:10.5px;transition:.15s;min-width:0}
.tab.active{color:var(--accent-text)}.tab-ico{font-size:18px;line-height:1}.tab.active .tab-ico{transform:scale(1.08)}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}
.type-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 4px;border-radius:12px;background:var(--card-bg);border:1px solid var(--border);color:var(--mut);cursor:pointer;transition:.15s;font-size:12.5px}
.type-btn .ti{font-size:22px;line-height:1}
.type-btn.active{background:var(--c);color:#fff;border-color:transparent;box-shadow:0 6px 20px -8px var(--c)}
.fold{border:1px solid var(--border);border-radius:11px;margin-bottom:12px;overflow:hidden;background:var(--input-bg)}
.fold summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;font-weight:500;color:var(--text);opacity:.9;user-select:none}
.fold summary::-webkit-details-marker{display:none}.fold summary::after{content:'▾';color:var(--mut);transition:.2s;font-size:12px}
.fold[open] summary::after{transform:rotate(180deg)}.fold-body{padding:0 14px 14px;border-top:1px solid var(--border-soft);padding-top:14px}
.tip-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.tip-btn{padding:9px 2px;border-radius:9px;background:var(--chip-bg);border:1px solid var(--border);color:var(--mut);cursor:pointer;transition:.15s;font-size:13px;font-weight:600}
.tip-btn.active{background:#fbbf24;border-color:#fbbf24;color:#3a2a00}
.disc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.disc-btn{padding:9px 2px;border-radius:9px;background:var(--chip-bg);border:1px solid var(--border);color:var(--mut);cursor:pointer;transition:.15s;font-size:13px}
.disc-btn.active{background:#38bdf8;border-color:#38bdf8;color:#04202e;font-weight:700}
.preview{background:var(--input-bg);border:1px solid var(--border);border-radius:11px;padding:12px 14px;margin-bottom:14px}
.prow{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px}.prow span:first-child{color:var(--mut)}.prow span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.preview .prow:last-child{border-top:1px dashed var(--border);margin-top:6px;padding-top:9px}
.mini-list{display:flex;flex-direction:column;gap:2px}
.mini-item{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--border-soft);font-size:13px}
.mini-item:last-child{border-bottom:0}.dot{width:7px;height:7px;border-radius:50%;flex:none}
.mi-name{color:var(--text);opacity:.9;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi-amt{color:var(--mut);font-variant-numeric:tabular-nums;font-size:12.5px}.mi-net{font-weight:600;font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.img-preview{position:relative;display:inline-block;margin-top:10px}
.img-preview img{max-width:160px;max-height:160px;border-radius:10px;border:1px solid var(--border);display:block}
.img-preview .rm{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:#ef4444;color:#fff;border:2px solid var(--card-bg);cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;font-weight:700}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters select,.filters input{flex:1;min-width:110px;padding:9px 11px;font-size:13px}
.order{background:var(--card-bg);border:1px solid var(--border);border-radius:13px;padding:13px 14px;margin-bottom:10px}
.order.fine{border-color:#4a1f24;background:linear-gradient(180deg,#1e1215,var(--card-bg))}
.order.settled{border-left:3px solid #fbbf24}
.o-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.o-type{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px}.o-time{font-size:11.5px;color:var(--mut);opacity:.85}
.o-amt{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.o-meta{font-size:12px;color:var(--mut);margin-top:4px;font-variant-numeric:tabular-nums}.o-meta b{color:var(--accent-text);font-weight:600}
.o-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-soft);font-size:12px;color:var(--mut)}
.o-note{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--chip-bg);color:var(--mut);margin-right:6px}
.o-thumb{max-width:110px;max-height:110px;border-radius:9px;border:1px solid var(--border);cursor:zoom-in;margin-top:9px;display:block}
.dispatch{background:var(--card-bg);border:1px solid var(--border);border-radius:13px;padding:14px;margin-bottom:10px}
.dispatch.open{border-color:#4a3a1f;background:linear-gradient(180deg,#1e1a12,var(--card-bg))}
.d-title{font-size:15px;font-weight:600;margin:0 0 6px}
.d-desc{font-size:12.5px;color:var(--mut);margin-bottom:10px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.d-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.d-amount{font-size:20px;font-weight:700;color:#ff8a3d;font-variant-numeric:tabular-nums}
.fine-hero{background:linear-gradient(135deg,#3a1a1e,#2a1417);border:1px solid #5b2429;border-radius:14px;padding:16px;margin-bottom:14px}
.fine-hero .k{font-size:12px;color:#ff9aa1;margin-bottom:4px}
.fine-hero .v{font-size:26px;font-weight:800;color:#ff8189;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.fine-user{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border-soft);font-size:13px}
.fine-user:last-child{border-bottom:0}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:14px}
.stat .k{font-size:12px;color:var(--mut);margin-bottom:6px}.stat .v{font-size:19px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 6px;border-bottom:1px solid var(--border-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}td.num,th.num{text-align:right}tbody tr:hover{background:var(--chip-bg)}
.member{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border-soft);font-size:13px}
.member:last-child{border-bottom:0}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#38bdf8);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex:none}
.code-box{display:flex;align-items:center;gap:10px;background:var(--input-bg);border:1px dashed var(--accent-border);border-radius:11px;padding:12px 14px;margin-top:6px}
.code-val{font-size:22px;font-weight:800;letter-spacing:4px;color:var(--accent-text);flex:1;font-family:ui-monospace,Menlo,monospace}
.row-flex{display:flex;gap:8px;align-items:center}.row-flex input{flex:1}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;align-items:end}
.podium-item{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:14px 8px;text-align:center}
.podium-item.p1{border-color:rgba(251,191,36,.5);padding:22px 8px 16px}
.podium-item.p2{border-color:rgba(203,213,225,.35)}.podium-item.p3{border-color:rgba(205,127,50,.4)}
.podium-rank{font-size:22px;line-height:1;margin-bottom:8px}
.podium-avatar{width:46px;height:46px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:17px}
.podium-item.p1 .podium-avatar{width:56px;height:56px;font-size:20px}
.podium-name{font-size:12.5px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.podium-amt{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent-text)}
.podium-sub{font-size:11px;color:var(--mut);margin-top:3px}
.rank-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border-soft)}
.rank-row:last-child{border-bottom:0}
.rank-row.me{background:var(--accent-soft);border-radius:10px;padding:10px 8px;margin:0 -8px;border-bottom:0}
.rank-no{width:30px;text-align:center;font-size:13px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
.rank-row.me .rank-no{color:var(--accent-text)}
.rank-name{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-right{text-align:right;flex:none}.rank-amt{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent-text)}
.rank-sub{font-size:11px;color:var(--mut);margin-top:1px}
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.theme-swatch{display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 4px;border-radius:12px;background:var(--input-bg);border:1.5px solid var(--border);cursor:pointer;transition:.15s}
.theme-swatch.active{border-color:var(--accent);background:var(--accent-soft)}
.theme-dot{width:26px;height:26px;border-radius:50%}
.theme-name{font-size:11px;color:var(--mut)}.theme-swatch.active .theme-name{color:var(--accent-text);font-weight:600}
.check-line{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--text);cursor:pointer;padding:12px 14px;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;line-height:1.5}
.check-line input{width:auto;flex:none;margin-top:3px;accent-color:var(--accent);cursor:pointer}
.check-line input:focus{box-shadow:none}
.day-card{background:var(--input-bg);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;background:var(--chip-bg);font-size:13px;font-weight:600}
.day-body{padding:6px 14px 10px}
.day-type-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12.5px;border-bottom:1px dashed var(--border-soft)}
.day-type-row:last-child{border-bottom:0}.dtr-name{flex:1}.dtr-count{color:var(--mut);font-variant-numeric:tabular-nums;font-size:12px}
.dtr-net{font-weight:700;font-variant-numeric:tabular-nums;min-width:76px;text-align:right}
.tier-info{background:linear-gradient(135deg,rgba(124,92,255,.15),rgba(56,189,248,.1));border:1px solid var(--accent-border);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.7}
.tier-info b{color:var(--accent-text)}
.tier-info .tier-now{color:#22c55e;font-weight:700}
.tier-info .tier-next{color:var(--mut);font-size:12px}
.star-tag{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#3a2a00;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:6px}
.rank-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.rank-tabs::-webkit-scrollbar{display:none}
.rank-tab{flex:none;padding:8px 14px;border-radius:20px;background:var(--chip-bg);border:1px solid var(--border);color:var(--mut);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;transition:.15s}
.rank-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.star-project-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--input-bg);border:1px solid var(--border);margin-bottom:6px;font-size:13px}
.star-project-item .sp-name{flex:1}

function compressImage(file, maxW, quality){
  maxW = maxW || 720; quality = quality || 0.62;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('图片读取失败'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('文件读取失败'));
    reader.readAsDataURL(file);
  });
}

/* ============ 档位 / 头牌 计算 ============ */
function getClub(){
  if(!ME) return null;
  return DB.clubs.find(c => c.id === ME.club_id) || null;
}
function getTierSettings(){
  const club = getClub();
  const s = (club && club.tier_settings) || {};
  return {
    tier1_count: Number(s.tier1_count) || DEFAULT_TIER.tier1_count,
    tier1_discount: (s.tier1_discount==null? DEFAULT_TIER.tier1_discount : Number(s.tier1_discount)),
    tier2_count: Number(s.tier2_count) || DEFAULT_TIER.tier2_count,
    tier2_discount: (s.tier2_discount==null? DEFAULT_TIER.tier2_discount : Number(s.tier2_discount))
  };
}
function getStarBonus(){
  const club = getClub();
  if(!club) return DEFAULT_STAR_BONUS;
  const b = club.star_bonus;
  return (b==null || isNaN(b)) ? DEFAULT_STAR_BONUS : Number(b);
}
/* 返回某用户当月的单量（陪玩单+礼物单+自定义+派单，不含罚款） */
function getUserMonthCount(userId, month){
  month = month || monthStr();
  return DB.orders.filter(o =>
    o.club_id === ME.club_id &&
    o.user_id === userId &&
    o.type !== 'fine' &&
    fmtDate(o.createdAt).slice(0,7) === month
  ).length;
}
/* 根据当月单量得到档位减免 */
function getTierDiscountByCount(count){
  const t = getTierSettings();
  if(count > t.tier2_count) return t.tier2_discount;
  if(count > t.tier1_count) return t.tier1_discount;
  return 0;
}
/* 用于报单时的实时档位（不含本单） */
function getMyCurrentDiscount(){
  if(!ME || ME.role === 'fine') return 0;
  const cnt = getUserMonthCount(ME.id);
  return getTierDiscountByCount(cnt);
}
/* 判读某用户是否是某项目的头牌 */
function isStarForProject(userId, projectId, month){
  month = month || monthStr();
  return DB.stars.some(s =>
    s.club_id === ME.club_id &&
    s.user_id === userId &&
    s.project_id === projectId &&
    s.month === month
  );
}
/* 基础抽成（从俱乐部 commission 拿） */
function getBaseRate(type){
  if(type === 'fine') return 0;
  const club = getClub();
  if(!club) return DEFAULT_COMMISSION[type] ?? 30;
  const c = club.commission || {};
  const v = c[type];
  return (v==null || isNaN(v)) ? (DEFAULT_COMMISSION[type] ?? 30) : Number(v);
}
/* 报单时对该陪玩的最终抽成（含档位减免，头牌对抽成无影响） */
function getFinalRateForUser(type, userId){
  const base = getBaseRate(type);
  if(type === 'fine') return 0;
  const disc = getTierDiscountByCount(getUserMonthCount(userId));
  let r = base - disc;
  if(r < 0) r = 0;
  return round2(r);
}

/* 计算一单；tip=加价，disc=折扣，ratePercent=抽成% */
function calcOrder(type, amount, tip, disc, ratePercent){
  amount = Number(amount)||0; tip = Number(tip)||0; disc = Number(disc)||10; ratePercent = Number(ratePercent)||0;
  if(type === 'fine') return { gross: round2(amount), commission:0, net: round2(-amount) };
  let gross = (type === 'peiwan') ? (amount + tip) * (disc/10) : amount;
  gross = round2(gross);
  const commission = round2(gross * ratePercent / 100);
  return { gross, commission, net: round2(gross - commission) };
}

function calcStats(list){
  const s = { count:0, gross:0, commission:0, fine:0, net:0, settled:0, byType:{}, byUser:{} };
  for(const o of list){
    s.count++;
    const amt = Number(o.amount), gross = Number(o.gross), comm = Number(o.commission), net = Number(o.net);
    if(o.type === 'fine') s.fine += amt; else s.gross += gross;
    s.commission += comm; s.net += net;
    if(o.settled && o.type !== 'fine') s.settled += net;
    const bt = s.byType[o.type] || (s.byType[o.type] = { count:0, gross:0, commission:0, net:0, fine:0, settled:0 });
    bt.count++;
    if(o.type==='fine') bt.fine += amt; else bt.gross += gross;
    bt.commission += comm; bt.net += net;
    if(o.settled && o.type !== 'fine') bt.settled += net;
    const bu = s.byUser[o.user_id] || (s.byUser[o.user_id] = { count:0, gross:0, commission:0, net:0, fine:0, settled:0 });
    bu.count++;
    if(o.type==='fine') bu.fine += amt; else bu.gross += gross;
    bu.commission += comm; bu.net += net;
    if(o.settled && o.type !== 'fine') bu.settled += net;
  }
  return s;
}

function subscribeRealtime(){
  channels.forEach(c => sb.removeChannel(c));
  channels = [];
  const onOrders = payload => {
    const ev = payload.eventType;
    if(ev === 'INSERT'){
      const x = payload.new;
      if(!DB.orders.some(o => o.id === x.id)) DB.orders.push({...x, amount:Number(x.amount), tip:Number(x.tip), rate:Number(x.rate), gross:Number(x.gross), commission:Number(x.commission), net:Number(x.net), createdAt:Number(x.created_at)});
    } else if(ev === 'UPDATE'){
      const x = payload.new;
      const i = DB.orders.findIndex(o => o.id === x.id);
      if(i >= 0) DB.orders[i] = {...x, amount:Number(x.amount), tip:Number(x.tip), rate:Number(x.rate), gross:Number(x.gross), commission:Number(x.commission), net:Number(x.net), createdAt:Number(x.created_at)};
    } else if(ev === 'DELETE'){ DB.orders = DB.orders.filter(o => o.id !== payload.old.id); }
    if(ME) renderApp();
  };
  const onDispatches = payload => {
    const ev = payload.eventType;
    if(ev === 'INSERT'){
      const x = payload.new;
      if(!DB.dispatches.some(d => d.id === x.id)) DB.dispatches.push({...x, amount:Number(x.amount), targetUserId:x.target_user_id, takenBy:x.taken_by, orderId:x.order_id, createdAt:Number(x.created_at), takenAt: x.taken_at ? Number(x.taken_at) : null});
    } else if(ev === 'UPDATE'){
      const x = payload.new;
      const i = DB.dispatches.findIndex(d => d.id === x.id);
      if(i >= 0) DB.dispatches[i] = {...x, amount:Number(x.amount), targetUserId:x.target_user_id, takenBy:x.taken_by, orderId:x.order_id, createdAt:Number(x.created_at), takenAt: x.taken_at ? Number(x.taken_at) : null};
    } else if(ev === 'DELETE'){ DB.dispatches = DB.dispatches.filter(d => d.id !== payload.old.id); }
    if(ME) renderApp();
  };
  const onProfiles = payload => {
    const ev = payload.eventType;
    if(ev === 'INSERT'){ if(!DB.users.some(u => u.id === payload.new.id)) DB.users.push(payload.new); }
    else if(ev === 'UPDATE'){
      const i = DB.users.findIndex(u => u.id === payload.new.id);
      if(i >= 0) DB.users[i] = payload.new;
      if(ME && ME.id === payload.new.id){ ME = payload.new; applyTheme(ME.theme||'black'); }
    } else if(ev === 'DELETE'){ DB.users = DB.users.filter(u => u.id !== payload.old.id); }
    if(ME) renderApp();
  };
  const onClubs = payload => {
    const ev = payload.eventType;
    if(ev === 'INSERT'){ if(!DB.clubs.some(c => c.id === payload.new.id)) DB.clubs.push(payload.new); }
    else if(ev === 'UPDATE'){
      const i = DB.clubs.findIndex(c => c.id === payload.new.id);
      if(i >= 0) DB.clubs[i] = payload.new;
    } else if(ev === 'DELETE'){ DB.clubs = DB.clubs.filter(c => c.id !== payload.old.id); }
    if(ME) renderApp();
  };
  const onStars = payload => {
    const ev = payload.eventType;
    if(ev === 'INSERT'){
      const x = payload.new;
      if(!DB.stars.some(s => s.id === x.id)) DB.stars.push({id:x.id, club_id:x.club_id, user_id:x.user_id, project_id:x.project_id, month:x.month, createdAt:Number(x.created_at)});
    } else if(ev === 'DELETE'){
      DB.stars = DB.stars.filter(s => s.id !== payload.old.id);
    }
    if(ME) renderApp();
  };
  channels.push(sb.channel('o-rt').on('postgres_changes', {event:'*', schema:'public', table:'orders'}, onOrders).subscribe());
  channels.push(sb.channel('d-rt').on('postgres_changes', {event:'*', schema:'public', table:'dispatches'}, onDispatches).subscribe());
  channels.push(sb.channel('p-rt').on('postgres_changes', {event:'*', schema:'public', table:'profiles'}, onProfiles).subscribe());
  channels.push(sb.channel('c-rt').on('postgres_changes', {event:'*', schema:'public', table:'clubs'}, onClubs).subscribe());
  channels.push(sb.channel('s-rt').on('postgres_changes', {event:'*', schema:'public', table:'monthly_stars'}, onStars).subscribe());
}

async function generateAuthCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code;
  do{ code = ''; for(let i = 0; i < 16; i++){ code += chars[Math.floor(Math.random() * chars.length)]; if(i === 3 || i === 7 || i === 11) code += '-'; } } while(AUTH_CODES.some(c => c.code === code));
  const row = { id: uid('ac_'), code: code, created_at: Date.now(), used: false, used_by: null, used_at: null };
  const { error } = await sb.from('auth_codes').insert(row);
  if(error){ toast('生成失败：' + error.message); return; }
  AUTH_CODES.unshift(row);
  toast('授权码已生成');
  renderSuperAdmin();
}
function copyAuthCode(code){

  else { toast(code); }
}

function usernameToEmail(u){ return u.toLowerCase() + '@pwclub.com'; }

async function doLogin(){
  const u = $('#lgUser').value.trim();
  const p = $('#lgPass').value;
  if(!u || !p) return toast('请填写用户名和密码');
  const btn = event.target; btn.disabled = true; btn.textContent = '登录中…';
  const { data, error } = await sb.auth.signInWithPassword({ email: usernameToEmail(u), password: p });
  btn.disabled = false; btn.textContent = '登 录';
  if(error){ toast(error.message === 'Invalid login credentials' ? '用户名或密码错误' : error.message); return; }
  await afterLogin(data.user.id);
}

function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code;
  do{ code = ''; for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)]; }
  while(DB.clubs.some(c => c.code === code));
  return code;
}

async function doRegister(){
  const username = $('#rgUser').value.trim();
  const nick = $('#rgNick').value.trim();
  const pass = $('#rgPass').value;
  if(!username || !pass) return toast('请填写用户名和密码');
  if(!/^[a-zA-Z0-9_]+$/.test(username)) return toast('用户名只能包含字母、数字、下划线');
  if(pass.length < 6) return toast('密码至少 6 位');
  const btn = event.target; btn.disabled = true; btn.textContent = '注册中…';

  const { data: signData, error: signErr } = await sb.auth.signUp({
    email: usernameToEmail(username),
    password: pass,
    options: { emailRedirectTo: location.href }
  });
  if(signErr){
    btn.disabled = false; btn.textContent = '注 册';
    if(signErr.message.includes('already')) toast('用户名已被占用');
    else toast(signErr.message);
    return;
  }
  const newUid = signData.user.id;
  if(!newUid){
    btn.disabled = false; btn.textContent = '注 册';
    toast('注册异常，请稍后再试');
    return;
  }

  if(AUTH.role === 'admin'){
    const clubName = $('#rgClub').value.trim();
    if(!clubName){
      btn.disabled = false; btn.textContent = '注 册';
      toast('请填写俱乐部名称');
      await sb.auth.signOut();
      return;
    }
    const { data: existingClubs } = await sb.from('clubs').select('id').limit(1);
    const needCode = existingClubs && existingClubs.length > 0;
    let codeRow = null;
    if(needCode){
      const authCodeInput = ($('#rgAuthCode') ? $('#rgAuthCode').value.trim().toUpperCase() : '');
      if(!authCodeInput){
        btn.disabled = false; btn.textContent = '注 册';
        toast('请填写授权码');
        await sb.auth.signOut();
        return;
      }
      const { data: found } = await sb.from('auth_codes').select('*').eq('code', authCodeInput).limit(1);
      if(!found || !found.length){
        btn.disabled = false; btn.textContent = '注 册';
        toast('授权码无效');
        await sb.auth.signOut();
        return;
      }
      codeRow = found[0];
      if(codeRow.used){
        btn.disabled = false; btn.textContent = '注 册';
        toast('该授权码已被使用');
        await sb.auth.signOut();
        return;
      }
    }
    const clubId = uid();
    const clubRow = {
      id: clubId, name: clubName, code: genCode(), owner_id: newUid,
      commission: DEFAULT_COMMISSION,
      projects: [
        { id: uid(), name:'王者荣耀 · 排位', price: 50 },
        { id: uid(), name:'英雄联盟 · 匹配', price: 40 },
        { id: uid(), name:'和平精英 · 陪玩', price: 35 },
        { id: uid(), name:'云顶之弈 · 上分', price: 45 }
      ],
      gifts: [
        { id: uid(), name:'小礼物', price: 10 },
        { id: uid(), name:'中礼物', price: 50 },
        { id: uid(), name:'大礼物', price: 100 },
        { id: uid(), name:'豪华礼物', price: 520 }
      ],
      tier_settings: DEFAULT_TIER,
      star_bonus: DEFAULT_STAR_BONUS,
      created_at: Date.now()
    };
    const { error: cErr } = await sb.from('clubs').insert(clubRow);
    if(cErr){ toast('创建俱乐部失败：' + cErr.message); btn.disabled=false; btn.textContent='注 册'; return; }
    const { error: pErr } = await sb.from('profiles').insert({
      id: newUid, username, nick: nick||username, role:'admin',
      club_id: clubId, theme:'black', created_at: Date.now()
    });
    if(pErr){ toast('创建资料失败：' + pErr.message); btn.disabled=false; btn.textContent='注 册'; return; }
    if(codeRow){
      await sb.from('auth_codes').update({ used: true, used_by: newUid, used_at: Date.now() }).eq('id', codeRow.id);
    }
    btn.disabled = false; btn.textContent = '注 册';
    toast('俱乐部创建成功！绑定码 ' + clubRow.code);
    await afterLogin(newUid);
  } else {
    const code = $('#rgCode').value.trim().toUpperCase();
    if(!code){ toast('请填写俱乐部绑定码'); btn.disabled=false; btn.textContent='注 册'; await sb.auth.signOut(); return; }
    const { data: { session } } = await sb.auth.getSession();
    if(!session){
      toast('注册成功，请到登录页登录');
      btn.disabled = false; btn.textContent = '注 册';
      AUTH.mode = 'login'; renderAuth();
      return;
    }
    const { data: clubRow, error: cFind } = await sb.from('clubs').select('*').eq('code', code).single();
    if(cFind || !clubRow){
      toast('绑定码不存在');
      await sb.auth.signOut();
      btn.disabled = false; btn.textContent = '注 册';
      return;
    }
    const role = AUTH.role === 'staff' ? 'staff' : 'player';
    const { error: pErr } = await sb.from('profiles').insert({
      id: newUid, username, nick: nick||username, role,
      club_id: clubRow.id, theme:'black', created_at: Date.now()
    });
    if(pErr){ toast('创建资料失败：' + pErr.message); await sb.auth.signOut(); btn.disabled=false; btn.textContent='注 册'; return; }
    btn.disabled = false; btn.textContent = '注 册';
    toast('已加入「' + clubRow.name + '」');
    await afterLogin(newUid);
  }
}

function prow(k, v, cls){ return `<div class="prow"><span>${k}</span><span class="${cls||''}">${v}</span></div>`; }

function updatePreview(){
  const el = $('#preview');
  if(!el) return;
  const t = UI.reportType;
  const rate = getFinalRateForUser(t, ME.id);
  const amountEl = $('#rfAmount');
  const amount = amountEl ? (parseFloat(amountEl.value) || 0) : 0;
  if(t === 'peiwan'){
    const tip = UI.reportTip || 0, disc = UI.reportDiscount || 10;
    const r = calcOrder(t, amount, tip, disc, rate);
    let rows = prow('项目金额', money(amount));
    if(tip > 0) rows += prow('加价', '+' + money(tip));
    if(disc < 10) rows += prow('折扣', disc + ' 折');
    if(tip > 0 || disc < 10) rows += prow('折后总额', money(r.gross));
    rows += prow('抽成（' + rate + '%）', '-' + money(r.commission), 'warn');
    rows += prow('实得', money(r.net), 'ok');
    el.innerHTML = rows;
  }else{
    const r = calcOrder(t, amount, 0, 10, rate);
    el.innerHTML = prow('金额', money(amount)) +
      prow('抽成（' + rate + '%）', '-' + money(r.commission), 'warn') +
      prow('实得', money(r.net), 'ok');
  }
}

  const rate = getFinalRateForUser(t, ME.id);

  const disc = (t === 'peiwan') ? (UI.reportDiscount || 10) : 10;
  const r = calcOrder(t, amount, tip, disc, rate);

    id: uid(), club_id: ME.club_id, user_id: ME.id, type: t, title,

function dispatchCard(d, isMgr){
  const target = d.target_user_id ? DB.users.find(u => u.id === d.target_user_id) : null;
  const taker = d.taken_by ? DB.users.find(u => u.id === d.taken_by) : null;

  const takerName = taker ? (taker.nick || taker.username) : '';
  let action = '';
  if(isMgr) action = `<button class="btn danger sm" onclick="delDispatch('${d.id}')">删除</button>`;
  else if(d.status === 'open' && (!d.target_user_id || d.target_user_id === ME.id)) action = `<button class="btn primary sm" onclick="takeDispatch('${d.id}')">接 单</button>`;
  else if(d.taken_by === ME.id) action = `<span class="badge">已接单</span>`;

  return `<div class="dispatch ${d.status==='open'?'open':''}">
    <h4 class="d-title">${esc(d.title)}</h4>
    ${d.description ? `<div class="d-desc">${esc(d.description)}</div>` : ''}

  </div>`;
}

function getRange(period, dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  if(period === 'day'){ const from = new Date(d); const to = new Date(d); to.setDate(to.getDate()+1); return [from, to]; }
  if(period === 'week'){ const from = weekStart(d); const to = new Date(from); to.setDate(to.getDate()+7); return [from, to]; }
  const from = new Date(d.getFullYear(), d.getMonth(), 1);
  const to = new Date(d.getFullYear(), d.getMonth()+1, 1);
  return [from, to];
}

  else rangeLabel = UI.flowDate.slice(0,7);

  const dayMap = {};
  myOrders.forEach(o => { const d = fmtDate(o.createdAt); if(!dayMap[d]) dayMap[d] = []; dayMap[d].push(o); });

function setRankPeriod(p){ UI.rankPeriod = p; renderRanking($('#content')); }
function setRankType(t){ UI.rankType = t; renderRanking($('#content')); }

function renderRanking(el){
  const type = UI.rankType || 'flow';
  const period = UI.rankPeriod || 'week';
  const now = new Date();
  let list = DB.orders.filter(o => o.club_id === ME.club_id && o.type !== 'fine');
  if(period === 'day'){ const d = todayStr(); list = list.filter(o => fmtDate(o.createdAt) === d); }
  else if(period === 'week'){ const ws = weekStart(now).getTime(); list = list.filter(o => o.createdAt >= ws); }
  else if(period === 'month'){ const m = monthStr(); list = list.filter(o => fmtDate(o.createdAt).slice(0,7) === m); }

  const members = DB.users.filter(x => x.club_id === ME.club_id);
  const medal = ['🥇','🥈','🥉'];
  const podiumBg = ['linear-gradient(135deg,#fbbf24,#f59e0b)','linear-gradient(135deg,#cbd5e1,#94a3b8)','linear-gradient(135deg,#cd7f32,#a05a2c)'];
  const tabs = [
    ['flow','💸 流水榜'],['count','🔢 单量榜'],['net','💰 实得榜'],['gift','🎁 礼物榜'],
    ['star','⭐ 头牌榜'],['progress','📈 进步榜'],['fine','⚠️ 罚款榜'],['active','🔥 活跃榜']
  ];
  const tabsHtml = `<div class="rank-tabs">${tabs.map(([k,label]) => `<button class="rank-tab ${type===k?'active':''}" onclick="setRankType('${k}')">${label}</button>`).join('')}</div>`;
  const periodTabs = `<div class="seg" style="margin-bottom:14px">
    <button class="${period==='day'?'active':''}" onclick="setRankPeriod('day')">日榜</button>
    <button class="${period==='week'?'active':''}" onclick="setRankPeriod('week')">周榜</button>
    <button class="${period==='month'?'active':''}" onclick="setRankPeriod('month')">月榜</button>
  </div>`;
  const periodLabel = period==='day' ? '今日' : period==='week' ? '本周' : '本月';

  let rank = [];
  let valueKey = 'value';
  let unitLabel = '';

  if(type === 'flow' || type === 'count' || type === 'net' || type === 'gift'){
    const agg = {};
    list.forEach(o => {
      if(type === 'gift' && o.type !== 'gift') return;
      const a = agg[o.user_id] || (agg[o.user_id] = { gross:0, net:0, count:0, gift:0 });
      a.gross += Number(o.gross); a.net += Number(o.net); a.count++;
      if(o.type === 'gift') a.gift += Number(o.gross);
    });
    rank = members.map(m => {
      const a = agg[m.id] || { gross:0, net:0, count:0, gift:0 };
      let v = 0;
      if(type === 'flow') v = a.gross;
      else if(type === 'count') v = a.count;
      else if(type === 'net') v = a.net;
      else if(type === 'gift') v = a.gift;
      return { user:m, value:v, count:a.count, gross:a.gross, net:a.net };
    }).filter(r => r.value > 0).sort((a,b) => b.value - a.value);
    unitLabel = type === 'count' ? '单' : '';
  }
  else if(type === 'star'){
    const month = monthStr();
    const starList = DB.stars.filter(s => s.club_id === ME.club_id && s.month === month);
    const byUser = {};
    starList.forEach(s => {
      if(!byUser[s.user_id]) byUser[s.user_id] = [];
      byUser[s.user_id].push(s.project_id);
    });
    rank = Object.keys(byUser).map(uidKey => {
      const usr = DB.users.find(u => u.id === uidKey);
      const projects = (DB.clubs.find(c => c.id === ME.club_id).projects || []);
      const starProjects = byUser[uidKey].map(pid => {
        const p = projects.find(x => x.id === pid);
        return p ? p.name : '未知';
      });
      return { user: usr, value: byUser[uidKey].length, starProjects };
    }).sort((a,b) => b.value - a.value);
    unitLabel = '个项目';
  }
  else if(type === 'progress'){
    const now = Date.now();
    const curStart = weekStart(new Date()).getTime();
    const prevStart = curStart - 7*86400000;
    const cur = {};
    const prev = {};
    DB.orders.filter(o => o.club_id === ME.club_id && o.type !== 'fine').forEach(o => {
      if(o.createdAt >= curStart){ cur[o.user_id] = (cur[o.user_id]||0) + Number(o.gross); }
      else if(o.createdAt >= prevStart && o.createdAt < curStart){ prev[o.user_id] = (prev[o.user_id]||0) + Number(o.gross); }
    });
    rank = members.map(m => {
      const c = cur[m.id] || 0;
      const p = prev[m.id] || 0;
      const diff = round2(c - p);
      return { user:m, value:diff, cur:c, prev:p };
    }).filter(r => r.cur > 0 || r.prev > 0).sort((a,b) => b.value - a.value);
    unitLabel = '元';
  }
  else if(type === 'fine'){
    const month = monthStr();
    const fines = DB.orders.filter(o => o.club_id === ME.club_id && o.type === 'fine' && fmtDate(o.createdAt).slice(0,7) === month);
    const agg = {};
    fines.forEach(o => { agg[o.user_id] = (agg[o.user_id]||0) + Number(o.amount); });
    rank = members.map(m => ({ user:m, value: round2(agg[m.id]||0) })).filter(r => r.value > 0).sort((a,b) => b.value - a.value);
    unitLabel = '元';
  }
  else if(type === 'active'){
    const agg = {};
    list.forEach(o => {
      const d = fmtDate(o.createdAt);
      if(!agg[o.user_id]) agg[o.user_id] = new Set();
      agg[o.user_id].add(d);
    });
    rank = members.map(m => ({ user:m, value: agg[m.id] ? agg[m.id].size : 0 })).filter(r => r.value > 0).sort((a,b) => b.value - a.value);
    unitLabel = '天';
  }

  const myRankIdx = rank.findIndex(r => r.user && r.user.id === ME.id);

  const top3 = rank.slice(0,3);
  let podiumHtml = '<div class="podium">';
  podiumHtml += top3[1] ? podiumItem(top3[1], 2, medal[1], podiumBg[1], type, unitLabel) : '<div></div>';
  podiumHtml += top3[0] ? podiumItem(top3[0], 1, medal[0], podiumBg[0], type, unitLabel) : '<div></div>';
  podiumHtml += top3[2] ? podiumItem(top3[2], 3, medal[2], podiumBg[2], type, unitLabel) : '<div></div>';
  podiumHtml += '</div>';

  const listHtml = rank.map((r, i) => {
    const isMe = r.user && r.user.id === ME.id;
    const nm = r.user ? (r.user.nick || r.user.username) : '未知';
    const av = nm.slice(0,1).toUpperCase();
    let vTxt = '', subTxt = '';
    if(type === 'count'){ vTxt = r.value + ' 单'; }
    else if(type === 'star'){ vTxt = r.value + ' 个项目'; subTxt = (r.starProjects || []).join(' / '); }
    else if(type === 'active'){ vTxt = r.value + ' 天有单'; }
    else if(type === 'progress'){
      vTxt = (r.value >= 0 ? '+' : '') + money(r.value);
      subTxt = '上周 ' + money(r.prev) + ' → 本周 ' + money(r.cur);
    }
    else if(type === 'fine'){ vTxt = '-' + money(r.value); }
    else { vTxt = money(r.value); }
    return `<div class="rank-row ${isMe?'me':''}">
      <div class="rank-no">${i < 3 ? medal[i] : (i+1)}</div>
      <div class="avatar" style="width:28px;height:28px;font-size:12px">${esc(av)}</div>
      <div class="rank-name">${esc(nm)}${isMe?' <span class="badge">我</span>':''}${subTxt?`<div class="mut small" style="font-size:11px;margin-top:1px">${esc(subTxt)}</div>`:''}</div>
      <div class="rank-right"><div class="rank-amt">${vTxt}</div></div>
    </div>`;
  }).join('');

  el.innerHTML = `
    ${periodTabs}
    ${tabsHtml}
    <div class="card">
      <div class="card-title">🏆 ${tabs.find(t=>t[0]===type)[1]} <span class="badge">${periodLabel}</span></div>
      ${rank.length ? podiumHtml : ''}
      ${rank.length ? `<div class="mini-list" style="margin-top:6px">${listHtml}</div>` : '<div class="empty">暂无上榜数据</div>'}
    </div>
    <div class="card">
      <div class="card-title">📌 我的排名</div>
      ${myRankIdx >= 0 ? `<div class="rank-row me"><div class="rank-no">${myRankIdx+1}</div><div class="avatar" style="width:28px;height:28px;font-size:12px">${esc((ME.nick||ME.username).slice(0,1).toUpperCase())}</div><div class="rank-name">${esc(ME.nick||ME.username)}</div><div class="rank-right"><div class="rank-amt">${type==='count'?rank[myRankIdx].value+' 单':type==='star'?rank[myRankIdx].value+' 个项目':type==='fine'?'-'+money(rank[myRankIdx].value):type==='progress'?(rank[myRankIdx].value>=0?'+':'')+money(rank[myRankIdx].value):type==='active'?rank[myRankIdx].value+' 天':money(rank[myRankIdx].value)}</div></div></div>` : '<div class="empty">本期还未上榜</div>'}
    </div>`;
}

function podiumItem(r, pos, medal, bg, type, unitLabel){
  const nm = r.user ? (r.user.nick || r.user.username) : '未知';
  const av = nm.slice(0,1).toUpperCase();
  let vTxt = '';
  if(type === 'count') vTxt = r.value + ' 单';
  else if(type === 'star') vTxt = r.value + ' 个项目';
  else if(type === 'fine') vTxt = '-' + money(r.value);
  else if(type === 'active') vTxt = r.value + ' 天';
  else if(type === 'progress') vTxt = (r.value>=0?'+':'') + money(r.value);
  else vTxt = money(r.value);
  return `<div class="podium-item p${pos}"><div class="podium-rank">${medal}</div><div class="podium-avatar" style="background:${bg}">${esc(av)}</div><div class="podium-name">${esc(nm)}</div><div class="podium-amt">${vTxt}</div></div>`;
}

        <div class="card-title">🏠 俱乐部信息</div>
        <div class="field"><label>俱乐部名称</label><input type="text" id="setClubName" value="${esc(club.name)}"></div>
        <button class="btn block sm" onclick="saveClubName()" style="margin-bottom:16px">保存名称</button>
        <label style="font-size:12.5px;color:var(--mut);display:block;margin-bottom:6px">绑定码</label>
        <div class="code-box"><span class="code-val">${club.code}</span><button class="btn sm" onclick="copyCode()">复制</button></div>
        <button class="btn ghost sm" style="margin-top:10px;width:100%" onclick="regenCode()">重新生成绑定码</button>
        <div class="hint" style="text-align:center">陪玩与员工注册时输入此码即可加入俱乐部</div>
      </div>

      <div class="card">
        <div class="card-title">⚙️ 基础抽成 <span class="mut small">（百分比）</span></div>
        ${ALL_TYPES.map(k => {
          const ti = ORDER_TYPES[k];
          const val = k === 'fine' ? 0 : getBaseRate(k);
          return `<div class="field" style="display:flex;align-items:center;gap:12px;margin-bottom:10px"><span style="flex:1;font-size:13.5px;color:var(--text);opacity:.9">${ti.icon} ${ti.name}</span><div style="width:110px;position:relative"><input type="number" id="comm_${k}" value="${val}" min="0" max="100" step="1" ${k==='fine'?'disabled':''} style="padding-right:34px;text-align:right"><span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px">%</span></div></div>`;
        }).join('')}
        <div class="hint" style="margin-bottom:14px">⚠️ 罚款单固定 0% 抽成</div>
        <button class="btn primary block" onclick="saveCommission()">保存抽成设置</button>
      </div>

      <div class="card">
        <div class="card-title">🏅 单量解锁减成 <span class="mut small">（本月单量）</span></div>
        <div class="hint" style="margin-bottom:10px">例：5 单以上减 2%，20 单以上减 5%（取最高档，不叠加）</div>
        <div class="field"><label>一档门槛（单）</label><input type="number" id="tier1_count" value="${tier.tier1_count}" min="1" step="1"></div>
        <div class="field"><label>一档减成（%）</label><input type="number" id="tier1_discount" value="${tier.tier1_discount}" min="0" max="100" step="0.5"></div>
        <div class="field"><label>二档门槛（单）</label><input type="number" id="tier2_count" value="${tier.tier2_count}" min="1" step="1"></div>
        <div class="field"><label>二档减成（%）</label><input type="number" id="tier2_discount" value="${tier.tier2_discount}" min="0" max="100" step="0.5"></div>
        <button class="btn primary block" onclick="saveTierSettings()">保存解锁设置</button>
      </div>

      <div class="card">
        <div class="card-title">⭐ 头牌加成设置</div>
        <div class="field"><label>头牌项目上浮（%）</label><input type="number" id="star_bonus" value="${starBonus}" min="0" max="200" step="1"></div>
        <div class="hint" style="margin-bottom:14px">陪玩被设为某项目的头牌后，报该项目的金额自动 ×(1+上浮%)，抽成比例不变</div>
        <button class="btn primary block" onclick="saveStarBonus()">保存头牌加成</button>
      </div>

      <div class="card">
        <div class="card-title">⭐ 本月头牌（${curMonth}）<span class="badge gray">${monthStars.length} 个</span></div>
        <div class="hint" style="margin-bottom:10px">给陪玩挂头牌项目。可同时挂多个陪玩、多个项目。</div>
        <div class="field"><label>选择陪玩</label>
          <select id="starUser"><option value="">— 请选择陪玩 —</option>${members.filter(m => m.role === 'player').map(m => `<option value="${m.id}">${esc(m.nick||m.username)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>选择项目</label>
          <select id="starProject"><option value="">— 请选择项目 —</option>${projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
        </div>
        <button class="btn primary block" onclick="addMonthStar()">设为头牌</button>
        ${monthStars.length ? `<div style="margin-top:14px">${monthStars.map(s => {
          const usr = DB.users.find(u => u.id === s.user_id);
          const prj = projects.find(p => p.id === s.project_id);
          return `<div class="star-project-item"><span class="sp-name">⭐ ${esc(prj ? prj.name : '未知项目')}</span><span class="sp-user">${esc(usr ? (usr.nick||usr.username) : '未知')}</span><button class="btn danger sm" onclick="delMonthStar('${s.id}')">删</button></div>`;
        }).join('')}</div>` : ''}
      </div>

      <div class="card">
        <div class="card-title">🎯 陪玩项目 <span class="mut small">${(club.projects||[]).length} 个</span></div>
        <div class="mini-list" style="margin-bottom:12px">
          ${(club.projects||[]).length ? (club.projects||[]).map(p => `<div class="mini-item"><span class="mi-name">${esc(p.name)}</span><span class="mi-amt">¥${p.price}</span><button class="btn danger sm" onclick="delProject('${p.id}')">删</button></div>`).join('') : '<div class="empty">还没有项目</div>'}
        </div>
        <div class="row-flex"><input type="text" id="newProjName" placeholder="项目名称" style="flex:2"><input type="number" id="newProjPrice" placeholder="价格" step="0.01" min="0" style="flex:1"><button class="btn primary sm" onclick="addProject()">添加</button></div>
      </div>

      <div class="card">
        <div class="card-title">🎁 礼物管理 <span class="mut small">${(club.gifts||[]).length} 个</span></div>
        <div class="mini-list" style="margin-bottom:12px">
          ${(club.gifts||[]).length ? (club.gifts||[]).map(g => `<div class="mini-item"><span class="mi-name">${esc(g.name)}</span><span class="mi-amt">¥${g.price}</span><button class="btn danger sm" onclick="delGift('${g.id}')">删</button></div>`).join('') : '<div class="empty">还没有礼物</div>'}
        </div>
        <div class="row-flex"><input type="text" id="newGiftName" placeholder="礼物名称" style="flex:2"><input type="number" id="newGiftPrice" placeholder="价格" step="0.01" min="0" style="flex:1"><button class="btn primary sm" onclick="addGift()">添加</button></div>
      </div>

      <div class="card">
        <div class="card-title">👥 俱乐部成员 <span class="mut small">${members.length} 人</span></div>
        ${members.map(m => {
          const canDel = isAdmin && m.id !== ME.id;
          const isStar = DB.stars.some(s => s.club_id === club.id && s.user_id === m.id && s.month === curMonth);
          return `<div class="member"><div class="avatar">${esc((m.nick||m.username).slice(0,1).toUpperCase())}</div><div style="flex:1"><div>${esc(m.nick || m.username)} ${m.role==='admin'?'<span class="badge">管理</span>':m.role==='staff'?'<span class="badge gold">员工</span>':''}${isStar?'<span class="star-tag">⭐ 头牌</span>':''}</div><div class="mut small">@${esc(m.username)}</div></div>${canDel ? `<button class="btn danger sm" onclick="removeMember('${m.id}')">移除</button>` : ''}</div>`;
        }).join('')}
      </div>`;
  } else if(club){
    html += `<div class="card"><div class="card-title">🏠 我的俱乐部</div><div class="member" style="border:0;padding:0"><div class="avatar">${esc(club.name.slice(0,1))}</div><div style="flex:1"><div>${esc(club.name)}</div><div class="mut small">绑定码：${club.code}</div></div></div></div>`;
  }

  html += `
    <div class="card">
      <div class="card-title">🎨 主题配色</div>
      <div class="theme-grid">
        ${THEMES.map(t => `<div class="theme-swatch ${(ME.theme||'black')===t.id?'active':''}" onclick="saveTheme('${t.id}')"><div class="theme-dot" style="background:${t.accent}"></div><div class="theme-name">${t.name}</div></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-title">👤 账号资料</div>
      <div class="field"><label>用户名（登录用，不可修改）</label><input type="text" value="${esc(ME.username)}" disabled></div>
      <div class="field"><label>昵称（显示名称）</label><input type="text" id="setNick" value="${esc(ME.nick||'')}"></div>
      <button class="btn primary block" onclick="saveProfile()">保存资料</button>
    </div>
    <div class="card">
      <div class="card-title">🔒 修改密码</div>
      <div class="field"><label>新密码</label><input type="password" id="setNewPass" placeholder="至少 6 位"></div>
      <button class="btn block" onclick="changePassword()">修改密码</button>
    </div>
    <div class="card" style="text-align:center">
      <button class="btn danger block" onclick="logout()">退出登录</button>
    </div>
    <div style="text-align:center;color:var(--mut);opacity:.6;font-size:12px;padding:10px 0 20px">
      陪玩俱乐部报备系统 · 云端数据同步
    </div>`;

  el.innerHTML = html;
}

/* ============ 设置项操作 ============ */
async function saveTheme(id){
  const { error } = await sb.from('profiles').update({ theme: id }).eq('id', ME.id);
  if(error){ toast('保存失败'); return; }
  ME.theme = id;
  const i = DB.users.findIndex(u => u.id === ME.id);
  if(i >= 0) DB.users[i].theme = id;
  applyTheme(id);
  toast('主题已切换');
  renderApp();
}
async function saveClubName(){
  if(!isManagerRole(ME.role)) return;
  const v = $('#setClubName').value.trim();
  if(!v) return toast('名称不能为空');
  const { error } = await sb.from('clubs').update({ name: v }).eq('id', ME.club_id);
  if(error){ toast('保存失败'); return; }
  const i = DB.clubs.findIndex(c => c.id === ME.club_id);
  if(i >= 0) DB.clubs[i].name = v;
  toast('已保存'); renderApp();
}
function copyCode(){
  const club = DB.clubs.find(c => c.id === ME.club_id);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(club.code).then(() => toast('绑定码已复制'), () => toast('绑定码：' + club.code));
  }else{ toast('绑定码：' + club.code); }
}
async function regenCode(){
  if(!isManagerRole(ME.role)) return;
  if(!confirm('重新生成后，旧绑定码立即失效，确定继续吗？')) return;
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code;
  do{ code = ''; for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)]; }
  while(DB.clubs.some(c => c.code === code));
  const { error } = await sb.from('clubs').update({ code }).eq('id', ME.club_id);
  if(error){ toast('生成失败'); return; }
  const i = DB.clubs.findIndex(c => c.id === ME.club_id);
  if(i >= 0) DB.clubs[i].code = code;
  toast('新绑定码：' + code);
  renderSettings($('#content'));
}
async function saveCommission(){
  if(!isManagerRole(ME.role)) return;
  const c = {};
  for(const k of ALL_TYPES){
    if(k === 'fine'){ c[k] = 0; continue; }
    const inp = document.getElementById('comm_' + k);
    let v = parseFloat(inp ? inp.value : 30);
    if(isNaN(v) || v < 0) v = 0;
    if(v > 100) v = 100;
    c[k] = round2(v);
  }
  const { error } = await sb.from('clubs').update({ commission: c }).eq('id', ME.club_id);
  if(error){ toast('保存失败'); return; }
  const i = DB.clubs.findIndex(x => x.id === ME.club_id);
  if(i >= 0) DB.clubs[i].commission = c;
  toast('抽成设置已保存 ✅');
  renderSettings($('#content'));
}
async function saveTierSettings(){
  if(!isManagerRole(ME.role)) return;
  const t1c = parseInt($('#tier1_count').value);
  const t1d = parseFloat($('#tier1_discount').value);
  const t2c = parseInt($('#tier2_count').value);
  const t2d = parseFloat($('#tier2_discount').value);
  if(isNaN(t1c) || t1c < 1) return toast('一档门槛无效');
  if(isNaN(t2c) || t2c <= t1c) return toast('二档门槛要大于一档');
  if(isNaN(t1d) || isNaN(t2d)) return toast('减免无效');
  const s = { tier1_count:t1c, tier1_discount:round2(t1d), tier2_count:t2c, tier2_discount:round2(t2d) };
  const { error } = await sb.from('clubs').update({ tier_settings: s }).eq('id', ME.club_id);
  if(error){ toast('保存失败：' + error.message); return; }
  const i = DB.clubs.findIndex(x => x.id === ME.club_id);
  if(i >= 0) DB.clubs[i].tier_settings = s;
  toast('解锁设置已保存 ✅');
  renderSettings($('#content'));
}
async function saveStarBonus(){
  if(!isManagerRole(ME.role)) return;
  let v = parseFloat($('#star_bonus').value);
  if(isNaN(v) || v < 0) return toast('加成无效');
  const { error } = await sb.from('clubs').update({ star_bonus: round2(v) }).eq('id', ME.club_id);
  if(error){ toast('保存失败：' + error.message); return; }
  const i = DB.clubs.findIndex(x => x.id === ME.club_id);
  if(i >= 0) DB.clubs[i].star_bonus = round2(v);
  toast('头牌加成已保存 ✅');
  renderSettings($('#content'));
}
async function addMonthStar(){
  if(!isManagerRole(ME.role)) return;
  const uidV = $('#starUser').value;
  const pidV = $('#starProject').value;
  if(!uidV) return toast('请选择陪玩');
  if(!pidV) return toast('请选择项目');
  const month = monthStr();
  if(DB.stars.some(s => s.club_id === ME.club_id && s.user_id === uidV && s.project_id === pidV && s.month === month)){
    return toast('该陪玩本月已经是此项目的头牌');
  }
  const row = { id: uid('st_'), club_id: ME.club_id, user_id: uidV, project_id: pidV, month, created_at: Date.now() };
  const { error } = await sb.from('monthly_stars').insert(row);
  if(error){ toast('设置失败：' + error.message); return; }
  DB.stars.push({...row, createdAt: row.created_at});
  toast('已设为头牌 ⭐');
  renderSettings($('#content'));
}
async function delMonthStar(id){
  if(!isManagerRole(ME.role)) return;
  if(!confirm('确定取消这个头牌吗？')) return;
  const { error } = await sb.from('monthly_stars').delete().eq('id', id);
  if(error){ toast('取消失败：' + error.message); return; }
  DB.stars = DB.stars.filter(s => s.id !== id);
  toast('已取消');
  renderSettings($('#content'));
}
async function addProject(){
  if(!isManagerRole(ME.role)) return;
  const name = $('#newProjName').value.trim();
  const price = parseFloat($('#newProjPrice').value);
  if(!name) return toast('请输入项目名称');
  if(!price || price <= 0) return toast('请输入有效价格');
  const club = DB.clubs.find(c => c.id === ME.club_id);
  const projects = [...(club.projects||[]), { id: uid(), name, price: round2(price) }];
  const { error } = await sb.from('clubs').update({ projects }).eq('id', ME.club_id);
  if(error){ toast('添加失败'); return; }
  club.projects = projects;
  toast('项目已添加'); renderSettings($('#content'));
}
async function delProject(id){
  if(!isManagerRole(ME.role)) return;
  if(!confirm('确定删除该项目吗？')) return;
  const club = DB.clubs.find(c => c.id === ME.club_id);
  const projects = (club.projects||[]).filter(p => p.id !== id);
  const { error } = await sb.from('clubs').update({ projects }).eq('id', ME.club_id);
  if(error){ toast('删除失败'); return; }
  club.projects = projects;
  DB.stars = DB.stars.filter(s => s.project_id !== id);
  toast('已删除'); renderSettings($('#content'));
}
async function addGift(){
  if(!isManagerRole(ME.role)) return;
  const name = $('#newGiftName').value.trim();
  const price = parseFloat($('#newGiftPrice').value);
  if(!name) return toast('请输入礼物名称');
  if(!price || price <= 0) return toast('请输入有效价格');
  const club = DB.clubs.find(c => c.id === ME.club_id);
  const gifts = [...(club.gifts||[]), { id: uid(), name, price: round2(price) }];
  const { error } = await sb.from('clubs').update({ gifts }).eq('id', ME.club_id);
  if(error){ toast('添加失败'); return; }
  club.gifts = gifts;
  toast('礼物已添加'); renderSettings($('#content'));
}
async function delGift(id){
  if(!isManagerRole(ME.role)) return;
  if(!confirm('确定删除该礼物吗？')) return;
  const club = DB.clubs.find(c => c.id === ME.club_id);
  const gifts = (club.gifts||[]).filter(g => g.id !== id);
  const { error } = await sb.from('clubs').update({ gifts }).eq('id', ME.club_id);
  if(error){ toast('删除失败'); return; }
  club.gifts = gifts;
  toast('已删除'); renderSettings($('#content'));
}
async function removeMember(memberId){
  if(ME.role !== 'admin') return toast('只有管理员可以移除成员');
  if(memberId === ME.id) return toast('不能移除自己');
  const target = DB.users.find(u => u.id === memberId);
  if(!target || target.club_id !== ME.club_id) return toast('该成员不在你的俱乐部');
  if(!confirm(`确定要移除${roleLabel(target.role)}「${target.nick || target.username}」吗？`)) return;
  const { error } = await sb.from('profiles').delete().eq('id', memberId);
  if(error){ toast('移除失败：' + error.message); return; }
  DB.users = DB.users.filter(u => u.id !== memberId);
  toast('已移除'); renderApp();
}
async function saveProfile(){
  const nick = $('#setNick').value.trim();
  const { error } = await sb.from('profiles').update({ nick: nick || ME.username }).eq('id', ME.id);
  if(error){ toast('保存失败'); return; }
  ME.nick = nick || ME.username;
  const i = DB.users.findIndex(u => u.id === ME.id);
  if(i >= 0) DB.users[i].nick = ME.nick;
  toast('资料已保存'); renderApp();
}
async function changePassword(){
  const newP = $('#setNewPass').value;
  if(newP.length < 6) return toast('新密码至少 6 位');
  const { error } = await sb.auth.updateUser({ password: newP });
  if(error){ toast('修改失败：' + error.message); return; }
  $('#setNewPass').value = '';
  toast('密码已修改');
}

boot();
</script>
</body>
</html>
