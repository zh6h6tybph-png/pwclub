<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>暖光 · 陪玩俱乐部管理系统</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ==================== 基础 ==================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  color:var(--text);background:var(--bg);
  transition:background .35s,color .35s;
  overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 18% 8%,rgba(255,206,168,.55),transparent 42%),
    radial-gradient(circle at 84% 22%,rgba(255,232,205,.65),transparent 45%),
    radial-gradient(circle at 45% 92%,rgba(214,231,255,.55),transparent 48%),
    radial-gradient(circle at 75% 70%,rgba(255,224,240,.45),transparent 45%);
  filter:blur(28px);
  transition:opacity .3s;
}
/* 主题变量 */
body[data-theme="glass"]{
  --bg:#f5f2eb;
  --primary:#c08c65;
  --primary-soft:rgba(192,140,101,.14);
  --card-bg:rgba(255,255,255,.58);
  --card-border:1px solid rgba(255,255,255,.75);
  --blur:blur(22px) saturate(160%);
  --text:#4a4038;
  --text-sub:#a89b8f;
  --line:rgba(192,140,101,.16);
  --radius:26px;
  --shadow:0 10px 32px rgba(186,155,124,.13);
  --tab-bg:rgba(255,255,255,.72);
  --input-bg:rgba(255,255,255,.7);
  --btn-text:#fff;
}
body[data-theme="y2k"]{
  --bg:#ffeef6;
  --primary:#ff5c8a;
  --primary-soft:rgba(255,92,138,.15);
  --card-bg:#ffffff;
  --card-border:3px solid #1a1a1a;
  --blur:none;
  --text:#111111;
  --text-sub:#8a8a8a;
  --line:#1a1a1a;
  --radius:6px;
  --shadow:5px 5px 0 #1a1a1a;
  --tab-bg:#ffffff;
  --input-bg:#ffffff;
  --btn-text:#111;
}
body[data-theme="pixel"]{
  --bg:#f3eddc;
  --primary:#7a9b5e;
  --primary-soft:rgba(122,155,94,.18);
  --card-bg:#fbf6e7;
  --card-border:3px solid #3a3128;
  --blur:none;
  --text:#3a3128;
  --text-sub:#8b8272;
  --line:#3a3128;
  --radius:3px;
  --shadow:4px 4px 0 #3a3128;
  --tab-bg:#fbf6e7;
  --input-bg:#fffdf4;
  --btn-text:#fffdf4;
  font-family:"Courier New",ui-monospace,monospace;
}
body[data-theme="y2k"]::before{
  filter:none;
  background-image:
    linear-gradient(rgba(255,92,138,.14) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,92,138,.14) 1px,transparent 1px);
  background-size:22px 22px;
  background-color:#ffeef6;
}
body[data-theme="pixel"]::before{
  filter:none;
  background:
    radial-gradient(circle at 20% 10%,rgba(200,220,160,.5),transparent 50%),
    radial-gradient(circle at 80% 80%,rgba(230,200,150,.45),transparent 50%),
    #f3eddc;
}

#app{height:100%;position:relative;z-index:1;overflow:hidden}

/* ==================== 布局 ==================== */
.screen{height:100%;display:flex;flex-direction:column;overflow:hidden}
.screen.auth{overflow-y:auto;display:block;padding:0 0 40px}
.content{flex:1;overflow-y:auto;padding:4px 0 28px;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{width:0}

.topbar{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:18px 18px 10px;
}
.tb-title{font-size:19px;font-weight:700;letter-spacing:.5px;flex:1}
.tb-back{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--card-bg);border:var(--card-border);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  font-size:16px;cursor:pointer;color:var(--text);flex:none;
}
.tb-btn{
  padding:7px 14px;border-radius:14px;font-size:12.5px;font-weight:600;
  background:var(--primary);color:var(--btn-text);cursor:pointer;white-space:nowrap;
}

/* ==================== 卡片 ==================== */
.card{
  background:var(--card-bg);
  border:var(--card-border);
  border-radius:var(--radius);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  box-shadow:var(--shadow);
  padding:18px;
  margin:0 16px 14px;
  position:relative;
}
.card-title{
  font-size:14.5px;font-weight:700;margin-bottom:12px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.card-sub{font-size:11.5px;color:var(--text-sub);line-height:1.7;margin-top:10px}
.muted{color:var(--text-sub);font-size:12px}
.tiny{font-size:11px;color:var(--text-sub);line-height:1.7}
.divider{height:1px;background:var(--line);margin:12px 0}
body[data-theme="y2k"] .divider,body[data-theme="pixel"] .divider{height:2px}

/* ==================== 按钮 ==================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 18px;border-radius:16px;border:none;
  font-size:14px;font-weight:600;cursor:pointer;
  background:var(--primary-soft);color:var(--text);
  transition:transform .12s,opacity .2s;
  font-family:inherit;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--btn-text);box-shadow:0 6px 18px rgba(192,140,101,.28)}
body[data-theme="y2k"] .btn.primary,body[data-theme="pixel"] .btn.primary{box-shadow:3px 3px 0 var(--line)}
.btn.block{width:100%;margin-top:12px}
.btn.sm{padding:8px 14px;font-size:12.5px;border-radius:12px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn.danger{background:rgba(226,110,110,.14);color:#d05c5c}
body[data-theme="y2k"] .btn,body[data-theme="pixel"] .btn{border:2.5px solid var(--line);border-radius:4px}

/* ==================== 表单 ==================== */
.input,.select,textarea.input{
  width:100%;padding:13px 15px;border-radius:16px;
  border:1.5px solid var(--line);background:var(--input-bg);
  font-size:14px;color:var(--text);font-family:inherit;outline:none;
  transition:border-color .2s;
}
.input:focus,.select:focus,textarea.input:focus{border-color:var(--primary)}
body[data-theme="y2k"] .input,body[data-theme="y2k"] .select,body[data-theme="y2k"] textarea.input,
body[data-theme="pixel"] .input,body[data-theme="pixel"] .select,body[data-theme="pixel"] textarea.input{
  border:2.5px solid var(--line);border-radius:4px;
}
.field{margin-bottom:12px}
.field-label{font-size:12px;color:var(--text-sub);margin-bottom:7px;font-weight:600;letter-spacing:.3px}
textarea.input{resize:vertical;min-height:76px;line-height:1.6}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* ==================== 分段控件 ==================== */
.seg{
  display:flex;background:var(--primary-soft);border-radius:16px;padding:4px;gap:4px;
  margin:0 16px 14px;
}
body[data-theme="y2k"] .seg,body[data-theme="pixel"] .seg{border:2.5px solid var(--line);border-radius:4px}
.seg-item{
  flex:1;text-align:center;padding:10px 6px;border-radius:12px;
  font-size:13px;font-weight:600;color:var(--text-sub);cursor:pointer;transition:.2s;
  white-space:nowrap;
}
body[data-theme="y2k"] .seg-item,body[data-theme="pixel"] .seg-item{border-radius:2px}
.seg-item.active{background:var(--card-bg);color:var(--primary);box-shadow:0 3px 10px rgba(0,0,0,.06)}
body[data-theme="y2k"] .seg-item.active{background:var(--primary);color:#fff}

/* 横向滚动 chips */
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:9px 16px;border-radius:14px;font-size:13px;font-weight:600;
  background:var(--card-bg);border:var(--card-border);color:var(--text-sub);
  cursor:pointer;white-space:nowrap;backdrop-filter:var(--blur);
}
.chip.active{background:var(--primary);color:var(--btn-text);border-color:transparent}
body[data-theme="y2k"] .chip,body[data-theme="pixel"] .chip{border:2.5px solid var(--line);border-radius:4px}
body[data-theme="y2k"] .chip.active{box-shadow:3px 3px 0 var(--line)}

/* ==================== 底部导航 ==================== */
.tabbar{
  flex:none;display:flex;padding:8px 6px calc(10px + env(safe-area-inset-bottom));
  background:var(--tab-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1.5px solid var(--line);
}
body[data-theme="y2k"] .tabbar{border-top:3px solid var(--line)}
body[data-theme="pixel"] .tabbar{border-top:3px solid var(--line)}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 0;cursor:pointer;color:var(--text-sub);transition:.2s;border-radius:14px;
}
.tab span{font-size:19px;line-height:1;filter:grayscale(.55);transition:.2s}
.tab em{font-style:normal;font-size:10.5px;font-weight:600}
.tab.active{color:var(--primary)}
.tab.active span{filter:none;transform:translateY(-1px)}

/* ==================== 列表项 ==================== */
.list-item{
  padding:13px 0;border-bottom:1px solid var(--line);
}
.list-item:last-child{border-bottom:none}
.li-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.li-title{font-size:14px;font-weight:600}
.li-desc{font-size:11.5px;color:var(--text-sub);margin-top:4px;line-height:1.6}
.li-actions{display:flex;gap:8px;margin-top:10px}

/* 标签 */
.tag{
  display:inline-flex;align-items:center;padding:3px 9px;border-radius:9px;
  font-size:10.5px;font-weight:700;letter-spacing:.3px;
}
.tag.ok{background:rgba(120,190,140,.18);color:#4e9b6b}
.tag.warn{background:rgba(240,180,90,.18);color:#c58a2c}
.tag.bad{background:rgba(226,110,110,.16);color:#d05c5c}
.tag.info{background:var(--primary-soft);color:var(--primary)}
body[data-theme="y2k"] .tag,body[data-theme="pixel"] .tag{border:2px solid currentColor;border-radius:3px}

/* 统计格 */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{
  background:var(--primary-soft);border-radius:18px;padding:13px 14px;
}
body[data-theme="y2k"] .stat,body[data-theme="pixel"] .stat{border:2.5px solid var(--line);border-radius:4px}
.stat b{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px}
.stat span{font-size:11px;color:var(--text-sub);font-weight:600}
.stats.c4{grid-template-columns:repeat(2,1fr)}

/* 快捷入口（长方形按钮） */
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick-btn{
  display:flex;align-items:center;gap:10px;
  padding:15px 16px;border-radius:18px;
  background:var(--primary-soft);cursor:pointer;
  font-size:13.5px;font-weight:600;color:var(--text);
  transition:transform .12s,background .2s;
  border:1.5px solid transparent;
}
.quick-btn:active{transform:scale(.97)}
.quick-btn i{font-style:normal;font-size:17px}
body[data-theme="y2k"] .quick-btn,body[data-theme="pixel"] .quick-btn{
  border:2.5px solid var(--line);border-radius:4px;background:var(--card-bg);
  box-shadow:3px 3px 0 var(--line);
}
body[data-theme="y2k"] .quick-btn:active,body[data-theme="pixel"] .quick-btn:active{transform:translate(3px,3px);box-shadow:none}

/* 折叠面板 */
.panel{
  background:var(--card-bg);border:var(--card-border);border-radius:var(--radius);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:var(--shadow);margin:0 16px 14px;overflow:hidden;
}
.panel-head{
  padding:16px 18px;display:flex;align-items:center;gap:10px;cursor:pointer;
  font-size:14px;font-weight:700;
}
.panel-head .arrow{margin-left:auto;font-size:11px;color:var(--text-sub);transition:.25s}
.panel.open .panel-head .arrow{transform:rotate(90deg)}
.panel-body{display:none;padding:0 18px 18px}
.panel.open .panel-body{display:block}

/* 记录条目 */
.rec{
  padding:14px;border-radius:18px;background:var(--primary-soft);
  margin-bottom:10px;border-left:4px solid transparent;
}
.rec.settled{border-left-color:#6fbf8b;background:rgba(120,190,140,.11)}
.rec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.rec-title{font-size:13.5px;font-weight:700}
.rec-meta{font-size:11.5px;color:var(--text-sub);line-height:1.8}
.rec-amount{font-size:16px;font-weight:800;color:var(--primary)}
.rec-imgs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.rec-imgs img{width:56px;height:56px;object-fit:cover;border-radius:10px;cursor:pointer}
.rec-remark{
  margin-top:8px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.55);
  font-size:11.5px;color:var(--text-sub);line-height:1.6;
}
body[data-theme="y2k"] .rec,body[data-theme="pixel"] .rec{border-radius:4px;border:2.5px solid var(--line)}

/* 头像 */
.avatar{
  width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
  font-size:23px;background:var(--primary-soft);flex:none;
}
body[data-theme="y2k"] .avatar,body[data-theme="pixel"] .avatar{border-radius:4px;border:2.5px solid var(--line)}

/* 空状态 */
.empty{text-align:center;padding:38px 20px;color:var(--text-sub);font-size:12.5px;line-height:1.9}
.empty .ico{font-size:34px;display:block;margin-bottom:10px;opacity:.55}

/* 领奖台 */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:18px 8px 8px}
.pod{flex:1;text-align:center;border-radius:20px 20px 12px 12px;padding:12px 6px;background:var(--primary-soft)}
.pod .pav{font-size:24px;margin-bottom:4px}
.pod .pname{font-size:12px;font-weight:700}
.pod .pval{font-size:11px;color:var(--text-sub);margin-top:2px}
.pod.p1{height:130px;background:linear-gradient(180deg,rgba(240,200,110,.4),rgba(240,200,110,.12))}
.pod.p2{height:108px}
.pod.p3{height:92px}
body[data-theme="y2k"] .pod,body[data-theme="pixel"] .pod{border:2.5px solid var(--line);border-radius:4px}

/* 弹窗 */
.mask{
  position:fixed;inset:0;background:rgba(60,50,40,.42);backdrop-filter:blur(6px);
  z-index:100;display:flex;align-items:center;justify-content:center;padding:22px;
  animation:fade .2s;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:400px;max-height:80vh;overflow-y:auto;
  background:var(--bg);border-radius:26px;padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);animation:pop .22s;
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
body[data-theme="y2k"] .modal,body[data-theme="pixel"] .modal{border:3px solid var(--line);border-radius:6px}
.modal.wide{max-width:440px}
.modal-title{font-size:16px;font-weight:800;margin-bottom:6px}
.modal-body{font-size:13px;line-height:1.85;color:var(--text-sub);margin:12px 0 18px;white-space:pre-wrap}

/* 登录页 */
.auth-inner{padding:76px 26px 26px;text-align:center}
.brand{font-size:52px;margin-bottom:16px;filter:drop-shadow(0 6px 18px rgba(192,140,101,.3))}
.auth-title{font-size:23px;font-weight:800;letter-spacing:1px;margin-bottom:8px}
.auth-sub{font-size:12.5px;color:var(--text-sub);margin-bottom:32px}
.auth-links{margin-top:16px;font-size:12.5px;color:var(--primary);font-weight:600;cursor:pointer}
.lock{
  position:fixed;right:20px;bottom:26px;width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;font-size:19px;opacity:.42;cursor:pointer;
  background:rgba(255,255,255,.55);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.8);transition:.2s;z-index:20;
}
.lock:active{opacity:1;transform:scale(1.08)}

/* 选择项 */
.pick{
  display:flex;align-items:center;gap:10px;padding:13px 15px;border-radius:16px;
  background:var(--card-bg);border:1.5px solid var(--line);margin-bottom:9px;cursor:pointer;
  font-size:13.5px;transition:.15s;
}
.pick.active{border-color:var(--primary);background:var(--primary-soft)}
.pick .dot{width:17px;height:17px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:10px;color:transparent}
.pick.active .dot{background:var(--primary);border-color:var(--primary);color:#fff}
.pick .grow{flex:1;min-width:0}
body[data-theme="y2k"] .pick,body[data-theme="pixel"] .pick{border:2.5px solid var(--line);border-radius:4px}

/* 折叠长条（加价/折扣） */
.foldbar{
  border-radius:16px;background:var(--primary-soft);overflow:hidden;margin-bottom:12px;
}
.foldbar-head{
  padding:13px 16px;display:flex;align-items:center;justify-content:space-between;
  font-size:13.5px;font-weight:600;cursor:pointer;
}
.foldbar-head .val{color:var(--primary);font-weight:800}
.foldbar-body{display:none;padding:0 16px 16px}
.foldbar.open .foldbar-body{display:block}
.numgrid{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.numgrid b{
  width:36px;height:36px;display:grid;place-items:center;border-radius:11px;
  background:var(--card-bg);font-size:13px;font-weight:700;cursor:pointer;
  border:1.5px solid transparent;
}
.numgrid b.active{background:var(--primary);color:var(--btn-text)}

/* 图片上传 */
.uploader{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.up-btn{
  width:66px;height:66px;border-radius:14px;display:grid;place-items:center;
  background:var(--primary-soft);font-size:22px;color:var(--text-sub);cursor:pointer;
}
.up-preview{position:relative;width:66px;height:66px}
.up-preview img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.up-preview .x{
  position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
  background:#d05c5c;color:#fff;font-size:12px;display:grid;place-items:center;cursor:pointer;
}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;color:var(--text-sub);font-weight:600;padding:8px 4px;font-size:11px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}

/* 其它 */
.flex{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.center{text-align:center}
.hidden{display:none!important}
</style>
</head>
<body data-theme="glass">
<div id="app"></div>

<script>
/* ============================================================
   陪玩俱乐部管理系统 · 前端主逻辑
   ============================================================ */

/* ---------- Supabase 配置（需要真实后端时填这里并打开开关） ---------- */
const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR-ANON-KEY';
const USE_SUPABASE = false; // ← 改为 true 即可切换到真实数据库
let sb = null;
if (USE_SUPABASE) { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }

/* ==================== 工具 ==================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const D = 86400000;
const money = n => '¥' + (Math.round((Number(n) || 0) * 100) / 100).toFixed(2);
const num = n => (Math.round((Number(n) || 0) * 100) / 100);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = ts => { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const fmtTime = ts => { const d = new Date(ts); return `${fmtDate(ts)} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const startOfDay = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const startOfWeek = ts => { const d = new Date(startOfDay(ts)); const w = (d.getDay() + 6) % 7; return d.getTime() - w * D; };
const startOfMonth = ts => { const d = new Date(ts); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); };
const endOfMonth = ts => { const d = new Date(ts); return new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime(); };
const inRange = (ts, from, to) => ts >= from && ts < to;

/* ==================== 会话与身份 ==================== */
function me() { return session ? DB.users.find(u => u.id === session.userId) : null; }
function curRole() { const u = me(); return u ? (u.roles.find(r => r.clubId === u.currentClubId) || u.roles[0] || null) : null; }
function curClub() { const u = me(); return u ? DB.clubs.find(c => c.id === u.currentClubId) : null; }
function clubById(id) { return DB.clubs.find(c => c.id === id); }
function userById(id) { return DB.users.find(u => u.id === id); }
function roleOf(u, clubId) { return u.roles.find(r => r.clubId === clubId); }

const isAdmin = () => curRole() && curRole().role === 'admin';
const isReadOnly = () => curRole() && ['leader', 'vice_leader'].includes(curRole().role);
const isStaffSide = () => curRole() && ['admin', 'leader', 'vice_leader', 'staff'].includes(curRole().role);
const isPlayerSide = () => curRole() && ['player', 'pending'].includes(curRole().role);
const isPending = () => curRole() && curRole().role === 'pending';
const canEdit = () => isAdmin();  // 团长/副团只读

function roleLabel(r) {
  return ({ admin: '管理员', leader: '团长', vice_leader: '副团', staff: '员工', player: '陪玩', pending: '待审陪' })[r] || r;
}

function pushNotice(clubId, userId, title, content, opts = {}) {
  DB.notices.unshift({
    id: uid(), clubId, userId, title, content,
    type: opts.type || 'system', isPopup: !!opts.isPopup,
    read: false, createdAt: Date.now()
  });
}

/* ==================== 渲染主入口 ==================== */
function render() {
  const u = me();
  document.body.dataset.theme = (u && u.theme) || 'glass';

  const app = $('#app');
  if (!session) {
    if (S.screen === 'register') app.innerHTML = pageRegister();
    else if (S.screen === 'super') app.innerHTML = pageSuper();
    else app.innerHTML = pageLogin();
  } else {
    app.innerHTML = pageMain();
  }
  if (S.modal) {
    app.insertAdjacentHTML('beforeend', S.modal);
  }
}

function pageMain() {
  if (S.sub) return renderSub();
  const PAGES = { home: pageHome, review: pageReview, pending: pagePending, finance: pageFinance, ranking: pageRanking, settings: pageSettings };
  const body = (PAGES[S.nav] || pageHome)();
  return `<div class="screen">${body}${tabbar()}</div>`;
}

function renderSub() {
  const SUB = {
    report: pageReport, claim: pageClaim, promote: pagePromote, fine: pageFine,
    records: pageRecords, editProfile: pageEditProfile
  };
  const fn = SUB[S.sub];
  const body = fn ? fn() : '<div class="content"><div class="empty">页面不存在</div></div>';
  return `<div class="screen">${body}</div>`;
}

/* ==================== 通用组件 ==================== */
function tabbar() {
  const staffSide = isStaffSide();
  const items = staffSide
    ? [['home', '主页', '🏠'], ['review', '审核', '✅'], ['finance', '流水', '📊'], ['ranking', '榜单', '🏆'], ['settings', '设置', '⚙️']]
    : [['home', '主页', '🏠'], ['pending', '待审', '📝'], ['finance', '流水', '📊'], ['ranking', '榜单', '🏆'], ['settings', '设置', '⚙️']];
  return `<div class="tabbar">${items.map(([k, l, i]) => `
    <div class="tab ${S.nav === k ? 'active' : ''}" data-act="nav" data-k="${k}">
      <span>${i}</span><em>${l}</em>
    </div>`).join('')}</div>`;
}

function topbar(title, right = '') {
  return `<div class="topbar"><div class="tb-title">${title}</div><div class="tb-right">${right}</div></div>`;
}
function topbarBack(title, right = '') {
  return `<div class="topbar"><div class="tb-back" data-act="back">←</div><div class="tb-title">${title}</div><div class="tb-right">${right}</div></div>`;
}
function emptyState(text = '还没有记录，期待写下你的第一条呀。') {
  return `<div class="empty"><span class="ico">🌿</span>${text}</div>`;
}

function rewardFor(userId) {
  const c = curClub();
  if (!c || !c.settings.rewards || !c.settings.rewards.enabled) return 0;
  const rw = c.settings.rewards;
  const tiers = rw.tiers.player || [];
  const mStart = startOfMonth(Date.now()), mEnd = endOfMonth(Date.now());
  const orders = DB.orders.filter(o => o.clubId === c.id && o.playerId === userId && inRange(o.createdAt, mStart, mEnd));
  const total = orders.reduce((s, o) => s + o.gross, 0);
  let best = 0;
  tiers.forEach(t => { if (total >= t.target) best = t.amount; });
  return best;
}

function recCard(o) {
  const settledBadge = o.settled
    ? '<span class="tag ok">✅ 已结</span>'
    : '<span class="tag warn">⏳ 未结</span>';
  return `<div class="rec ${o.settled ? 'settled' : ''}">
    <div class="rec-head">

/* ==================== 流水 ==================== */
function pageFinance() {
  const c = curClub(), u = me();
  const tab = S.tabs.finance || 'stats';
  const dim = S.tabs.finDim || 'month';
  const now = Date.now();
  let from, to;
  if (dim === 'day') { from = startOfDay(now); to = from + D; }
  else if (dim === 'week') { from = startOfWeek(now); to = from + 7 * D; }
  else { from = startOfMonth(now); to = endOfMonth(now); }

  const orders = DB.orders.filter(o => o.clubId === c.id && inRange(o.createdAt, from, to));
  const totalGross = orders.reduce((s, o) => s + o.gross, 0);
  const totalNet = orders.reduce((s, o) => s + o.net, 0);
  const clubCut = orders.reduce((s, o) => s + (o.gross - o.net), 0);
  const staffCut = orders.reduce((s, o) => s + (o.claimCommission || 0) + (o.directCommission || 0), 0);
  const orphan = orders.filter(o => !o.claimerId && !o.directId).reduce((s, o) => s + o.gross * 0.1, 0);

  const staffSide = isStaffSide();

  const timeSwitch = `<div class="seg">
    ${[['day','日报'],['week','周报'],['month','月报']].map(([k,l])=>`<div class="seg-item ${dim===k?'active':''}" data-act="finDim" data-v="${k}">${l}</div>`).join('')}
  </div>
  <div class="card" style="padding:10px 16px"><input class="input" type="date" value="${fmtDate(from)}" data-act="finDate"></div>`;

  const statsView = `
    <div class="card">
      <div class="card-title">流水统计</div>
      <div class="tiny" style="margin-bottom:12px">一串数字背后，藏着所有人默默的努力。</div>
      <div class="stats c4">
        <div class="stat"><b>${orders.length}</b><span>总单数</span></div>
        <div class="stat"><b>${money(totalGross)}</b><span>总流水</span></div>
        <div class="stat"><b>${money(clubCut)}</b><span>团抽成</span></div>
        <div class="stat"><b>${money(staffCut)}</b><span>员工抽成</span></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">无主单归属</div>
      <div class="between"><span class="muted">未被员工认领的单子抽成（俱乐部额外收入）</span><b style="color:var(--primary);font-size:18px">${money(orphan)}</b></div>
    </div>
    <div class="card">
      <div class="card-title">按类型统计</div>
      ${(()=>{const m={};orders.forEach(o=>{m[o.projectName]=m[o.projectName]||{n:0,g:0};m[o.projectName].n++;m[o.projectName].g+=o.gross;});
        return Object.keys(m).length?`<table class="tbl"><tr><th>项目</th><th>单数</th><th>流水</th></tr>${Object.entries(m).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${money(v.g)}</td></tr>`).join('')}</table>`:emptyState();})()}
    </div>
    <div class="card">
      <div class="card-title">按成员统计</div>
      ${(()=>{const m={};orders.forEach(o=>{m[o.playerName]=m[o.playerName]||{n:0,g:0,net:0};m[o.playerName].n++;m[o.playerName].g+=o.gross;m[o.playerName].net+=o.net;});
        return Object.keys(m).length?`<table class="tbl"><tr><th>陪玩</th><th>单数</th><th>流水</th><th>实得</th></tr>${Object.entries(m).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${money(v.g)}</td><td>${money(v.net)}</td></tr>`).join('')}</table>`:emptyState();})()}
    </div>`;

  const salaryView = `
    <div class="card">
      <div class="card-title">工资表</div>
      <div class="tiny" style="margin-bottom:8px">账目清晰分明，不辜负每一份汗水。</div>
      <div class="row" style="margin-bottom:8px">
        <button class="btn sm ghost" data-act="exportXls" data-t="detail">导出明细</button>
        <button class="btn sm ghost" data-act="exportXls" data-t="summary">导出汇总</button>
      </div>
      <div class="tiny" style="margin-bottom:14px">导出文件后，可以发给伙伴核对收入。</div>
      <div class="stats c4">
        <div class="stat"><b>${money(totalNet)}</b><span>陪玩应发</span></div>
        <div class="stat"><b>${money(staffCut)}</b><span>员工应发</span></div>
        <div class="stat"><b>${money(totalNet + staffCut)}</b><span>总应发</span></div>
        <div class="stat"><b>${money(totalGross)}</b><span>总流水</span></div>
      </div>
    </div>
    <div class="card">
      ${(()=>{const m={};orders.forEach(o=>{m[o.playerName]=m[o.playerName]||{n:0,g:0,net:0,settled:0};m[o.playerName].n++;m[o.playerName].g+=o.gross;m[o.playerName].net+=o.net;if(o.settled)m[o.playerName].settled+=o.net;});
        const rows=Object.entries(m);
        return rows.length?`<table class="tbl"><tr><th>成员</th><th>单数</th><th>流水</th><th>已结</th><th>应发</th></tr>${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${money(v.g)}</td><td>${money(v.settled)}</td><td><b>${money(v.net-v.settled)}</b></td></tr>`).join('')}</table>`:emptyState();})()}
    </div>`;

  return `${topbar('流水')}
  <div class="seg">
    <div class="seg-item ${tab==='stats'?'active':''}" data-act="finTab" data-v="stats">流水统计</div>
    <div class="seg-item ${tab==='salary'?'active':''}" data-act="finTab" data-v="salary">工资表</div>
  </div>
  <div class="content">
    ${timeSwitch}
    ${staffSide ? (tab==='stats'?statsView:salaryView) : (tab==='stats'?statsView:salaryView)}
  </div>`;
}

/* ==================== 榜单 ==================== */
function pageRanking() {
  const c = curClub(), u = me();
  const type = S.tabs.rankType || 'gross';
  const dim = S.tabs.rankDim || 'month';
  const now = Date.now();
  let from, to;
  if (dim === 'day') { from = startOfDay(now); to = from + D; }
  else if (dim === 'week') { from = startOfWeek(now); to = from + 7 * D; }
  else { from = startOfMonth(now); to = endOfMonth(now); }

  const orders = DB.orders.filter(o => o.clubId === c.id && inRange(o.createdAt, from, to));
  const agg = {};
  orders.forEach(o => {
    agg[o.playerId] = agg[o.playerId] || { id: o.playerId, name: o.playerName, n: 0, g: 0, net: 0 };
    agg[o.playerId].n++; agg[o.playerId].g += o.gross; agg[o.playerId].net += o.net;
  });
  const arr = Object.values(agg);
  const keyMap = { gross: 'g', count: 'n', net: 'net' };
  const key = keyMap[type] || 'g';
  arr.sort((a, b) => b[key] - a[key]);
  const top3 = arr.slice(0, 3);
  const myRank = arr.findIndex(x => x.id === u.id) + 1;

  const types = [['gross','流水榜'],['count','单量榜'],['net','实得榜']];
  return `${topbar('榜单')}
  <div class="seg">${[['day','日榜'],['week','周榜'],['month','月榜']].map(([k,l])=>`<div class="seg-item ${dim===k?'active':''}" data-act="rankDim" data-v="${k}">${l}</div>`).join('')}</div>
  <div class="hscroll">${types.map(([k,l])=>`<div class="chip ${type===k?'active':''}" data-act="rankType" data-v="${k}">${l}</div>`).join('')}</div>
  <div class="content">
    <div class="card">
      <div class="tiny" style="margin-bottom:8px">名次只是参考，你的努力我们全都看在眼里。</div>
      ${top3.length?`<div class="podium">
        ${top3[1]?`<div class="pod p2"><div class="pav">🥈</div><div class="pname">${esc(top3[1].name)}</div><div class="pval">${key==='n'?top3[1].n+'单':money(top3[1][key])}</div></div>`:''}
        ${top3[0]?`<div class="pod p1"><div class="pav">🥇</div><div class="pname">${esc(top3[0].name)}</div><div class="pval">${key==='n'?top3[0].n+'单':money(top3[0][key])}</div></div>`:''}
        ${top3[2]?`<div class="pod p3"><div class="pav">🥉</div><div class="pname">${esc(top3[2].name)}</div><div class="pval">${key==='n'?top3[2].n+'单':money(top3[2][key])}</div></div>`:''}
      </div>`:emptyState()}
    </div>
    <div class="card">
      <div class="card-title">完整排行</div>
      ${arr.length?arr.map((x,i)=>`<div class="list-item"><div class="li-head"><div class="flex"><b style="width:24px;color:var(--text-sub)">${i+1}</b><div class="li-title">${esc(x.name)}</div></div><b style="color:var(--primary)">${key==='n'?x.n+'单':money(x[key])}</b></div></div>`).join(''):emptyState()}
    </div>
    <div class="card">
      <div class="between"><span class="muted">我的排名</span><b style="font-size:17px;color:var(--primary)">${myRank?`第 ${myRank} 名`:'未上榜'}</b></div>
      <div class="card-sub">稳住脚步慢慢走，下一次上榜的就是你。</div>
    </div>
  </div>`;
}

/* ==================== 事件委托 ==================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const u = me(), c = curClub();

  const handlers = {
    /* 登录 */
    doLogin() {
      const un = $('#loginUser').value.trim(), pw = $('#loginPass').value;
      const user = DB.users.find(x => x.username === un && x.password === pw);
      if (!user) return alert('用户名或密码错误');
      session = { userId: user.id };
      localStorage.setItem('pw_session', JSON.stringify(session));
      S.screen = 'main'; S.nav = 'home'; S.sub = null; S.form = {}; S.tabs = {};
      render();
    },
    toRegister() { S.screen = 'register'; render(); },
    toLogin() { S.screen = 'login'; S.sub = null; render(); },
    toSuper() {
      const pw = prompt('请输入最高管理员密码');
      if (pw === '846467554jxjsjsisjidbdgujwqkjsuxhv；@') { S.screen = 'super'; render(); }
      else if (pw !== null) alert('密码错误');
    },
    regTab() { S.tabs.reg = el.dataset.v; render(); },
    doRegister() {
      const un = $('#regUser').value.trim(), pw = $('#regPass').value, nick = $('#regNick').value.trim();
      const club = $('#regClub').value.trim(), code = $('#regCode').value.trim();
      if (!un || !pw || !club || !code) return alert('请填写完整');
      if (DB.users.some(x => x.username === un)) return alert('用户名已存在');
      const mode = el.dataset.mode;
      let targetClub = DB.clubs.find(x => x.name === club);
      let role = 'player';
      if (mode === 'join') {
        if (!targetClub) return alert('俱乐部不存在');
        if (code === targetClub.staffCode) role = 'staff';
        else if (code === targetClub.playerCode) role = 'player';
        else return alert('绑定码不正确');
      } else {
        const ac = DB.authCodes.find(a => a.code === code && !a.used);
        if (!ac) return alert('授权码无效或已被使用');
        const cid = 'c' + uid();
        DB.clubs.push({ id: cid, name: club, playerCode: 'PW-' + uid().slice(0,4).toUpperCase(), staffCode: 'ST-' + uid().slice(0,4).toUpperCase(), reviewCode: 'RV-' + uid().slice(0,4).toUpperCase(), ownerId: '', createdAt: Date.now(), settings: JSON.parse(JSON.stringify(DB.clubs[0].settings)) });
        ac.used = true; ac.usedClubName = club;
        targetClub = DB.clubs.find(x => x.id === cid);
        role = 'admin'; targetClub.ownerId = 'u' + uid();
      }
      const nid = 'u' + uid();
      if (role === 'admin' && targetClub.ownerId) targetClub.ownerId = nid;
      DB.users.push({ id: nid, username: un, password: pw, nickname: nick || un, avatar: '🌸', createdAt: Date.now(), roles: [{ clubId: targetClub.id, role, jobs: role === 'staff' ? ['派单'] : [], joinedAt: Date.now() }], currentClubId: targetClub.id, theme: 'glass' });
      if (mode === 'new') DB.authCodes.find(a => a.code === code).usedBy = nid;
      persist();
      session = { userId: nid }; localStorage.setItem('pw_session', JSON.stringify(session));
      S.screen = 'main'; S.nav = 'home'; render();
    },

    /* 超管 */
    genCode() {
      const code = Array.from({ length: 8 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('').replace(/(.{4})/, '$1-');
      DB.authCodes.unshift({ id: uid(), code, used: false, usedBy: null, usedClubName: null, createdAt: Date.now() });
      persist(); render();
    },
    copyText() { navigator.clipboard?.writeText(el.dataset.t); alert('已复制：' + el.dataset.t); },
    delCode() { DB.authCodes = DB.authCodes.filter(x => x.id !== el.dataset.id); persist(); render(); },
    delClub() {
      if (!confirm('确定删除该俱乐部？所有数据将彻底抹除！')) return;
      const id = el.dataset.id;
      DB.clubs = DB.clubs.filter(x => x.id !== id);
      ['users','games','gifts','orders','promotions','fines','applications','notices'].forEach(k => {
        DB[k] = DB[k].filter(x => x.clubId !== id);
      });
      persist(); render();
    },

    /* 导航 */
    nav() { S.nav = el.dataset.k; S.sub = null; S.form = {}; render(); },
    back() { S.sub = null; S.form = {}; render(); },
    openSub() { S.sub = el.dataset.v; S.params = { claimType: el.dataset.t || 'dispatch' }; S.form = {}; render(); },

    /* 报备 */
    toggleFold() { const k = el.dataset.k; S.tabs[k] = !S.tabs[k]; render(); },
    setExtra() { S.form.rExtra = Number(el.dataset.v); render(); },
    setDisc() { S.form.rDisc = Number(el.dataset.v); render(); },
    toggleSettled() { S.form.rSettled = !S.form.rSettled; render(); },
    submitReport() {
      const g = DB.games.find(x => x.id === S.form.rGame) || DB.games[0];
      const p = g.projects.find(x => x.id === S.form.rProj) || g.projects[0];
      const d = p.durations.find(x => x.id === S.form.rDur) || p.durations[0];
      const extra = Number(S.form.rExtra) || 0, disc = Number(S.form.rDisc) || 10;
      const isTop = (c.settings.topPlayers||[]).includes(u.id);
      const base = num(d.price * (isTop ? 1 + c.settings.topBonus/100 : 1));
      const gross = num((base + extra) * disc / 10);
      const mStart = startOfMonth(Date.now()), mEnd = endOfMonth(Date.now());
      const cnt = DB.orders.filter(o => o.clubId === c.id && o.playerId === u.id && inRange(o.createdAt, mStart, mEnd)).length;
      let rate = c.settings.baseCommission;
      (c.settings.tiers||[]).forEach(t => { if (cnt >= t.min) rate = c.settings.baseCommission - t.reduce; });
      DB.orders.unshift({
        id: 'o' + uid(), clubId: c.id, playerId: u.id, playerName: u.nickname,
        gameName: g.name, projectName: p.name, durationName: d.name,
        basePrice: d.price, extraPrice: extra, discount: disc, isTop,
        gross, commissionRate: rate, net: num(gross * (1 - rate/100)),
        remark: S.form.rRemark || '', images: S.form.rImages || [],
        settled: !!S.form.rSettled, settledAmount: 0,
        claimerId: null, claimerName: null, claimCommission: 0,
        directId: null, directName: null, directCommission: 0,
        createdBy: u.id, createdAt: Date.now()
      });
      S.form = {}; persist(); alert('报备成功！'); render();
    },
    loadMoreHome() { S.tabs.homePageSize = (S.tabs.homePageSize||10) + 10; render(); },
    loadMoreReport() { S.tabs.reportPageSize = (S.tabs.reportPageSize||10) + 10; render(); },

    /* 拉单 */
    pickClaimPlayer() { S.params.claimPlayerId = el.dataset.id; S.form.claimPicked = []; render(); },
    togglePickOrder() {
      const id = el.dataset.id; const arr = S.form.claimPicked || [];
      S.form.claimPicked = arr.includes(id) ? arr.filter(x => x !== id) : [...arr, id];
      render();
    },
    submitClaim() {
      const type = el.dataset.type;
      const picked = S.form.claimPicked || [];
      if (!picked.length) return alert('请选择单子');
      const rate = type === 'direct' ? c.settings.directRate : c.settings.dispatchRate;
      picked.forEach(id => {
        const o = DB.orders.find(x => x.id === id);
        if (!o) return;
        if (type === 'direct') { o.directId = u.id; o.directName = u.nickname; o.directCommission = num(o.gross * rate / 100); }
        else { o.claimerId = u.id; o.claimerName = u.nickname; o.claimCommission = num(o.gross * rate / 100); }
        if (S.form.claimRemark) o.remark = (o.remark ? o.remark + ' | ' : '') + S.form.claimRemark;
        if (S.form.claimImages) o.images = [...(o.images||[]), ...S.form.claimImages];
      });
      S.form = {}; S.params.claimPlayerId = null; persist(); alert('拉单成功！'); render();
    },

    /* 外宣 */
    submitPromote() {
      const qty = Number(S.form.pQty)||0;
      if (!qty) return alert('请填写数量');
      const type = S.form.pType || '宣陪';
      const tiers = c.settings.externalTiers||[];
      const t = tiers.find(x=>x.id===(S.form.pTier||(tiers[0]&&tiers[0].id)));
      const unit = c.settings.externalPrices[type]||0;
      DB.promotions.unshift({ id:'pr'+uid(), clubId:c.id, staffId:u.id, staffName:u.nickname, type, tierName:t?t.name:'', tierRemark:S.form.pRemark||'', qty, unitPrice:unit, amount:num(qty*unit), remark:'', images:S.form.pImages||[], settled:false, createdAt:Date.now() });
      S.form = {}; persist(); alert('提交成功！'); render();
    },

    /* 罚款 */
    submitFine() {
      const pid = S.form.fPlayer || DB.users.find(x=>x.roles.some(r=>r.clubId===c.id&&r.role==='player')).id;
      const p = userById(pid);
      const amt = Number(S.form.fAmount)||0;
      if (!amt) return alert('请填写金额');
      DB.fines.unshift({ id:'f'+uid(), clubId:c.id, playerId:pid, playerName:p.nickname, amount:amt, reason:S.form.fReason||'', settled:false, createdBy:u.id, createdAt:Date.now() });
      S.form = {}; persist(); render();
    },

    /* 记录 */
    recMode() { S.tabs.recMode = el.dataset.v; render(); },
    delOrder() { if (!confirm('确定删除这条记录？')) return; DB.orders = DB.orders.filter(x=>x.id!==el.dataset.id); persist(); render(); },

    /* 审核 */
    reviewTab() { S.tabs.review = el.dataset.v; render(); },
    grabApp() {
      const a = DB.applications.find(x=>x.id===el.dataset.id);
      a.status = 'reviewing'; a.reviewerId = u.id; a.reviewerName = u.nickname; a.updatedAt = Date.now();
      persist(); render();
    },
    passApp() {
      const a = DB.applications.find(x=>x.id===el.dataset.id);
      a.status = 'passed'; a.updatedAt = Date.now();
      a.reviewLog.push({ reviewer:u.nickname, result:'passed', at:Date.now() });
      const applicant = DB.users.find(x=>x.id===a.userId);
      if (applicant) {
        const rr = applicant.roles.find(r=>r.clubId===c.id);
        if (rr) rr.role = 'player';
        pushNotice(c.id, a.userId, '审核通过 🎉', c.settings.popup.content, { type:'review', isPopup:true });
      }
      persist(); render();
    },
    rejectApp() {
      const a = DB.applications.find(x=>x.id===el.dataset.id);
      a.status = 'rejected'; a.updatedAt = Date.now();
      a.reviewLog.push({ reviewer:u.nickname, result:'rejected', at:Date.now() });
      pushNotice(c.id, a.userId, '审核未通过', '很遗憾，你的审核未通过。可以修改资料后重新提交。', { type:'review' });
      persist(); render();
    },

    /* 待审 */
    pendingTab() { S.tabs.pending = el.dataset.v; render(); },
    submitApp() {
      const game = S.form.aGame || DB.games.find(g=>g.clubId===c.id).name;
      DB.applications.unshift({ id:'a'+uid(), clubId:c.id, userId:u.id, userName:u.nickname, game, position:S.form.aPos||'', wechat:S.form.aWechat||'', intro:S.form.aIntro||'', images:S.form.aImages||[], status:'waiting', roundsNeeded:1, roundsDone:0, reviewerId:null, reviewerName:null, reviewLog:[], createdAt:Date.now(), updatedAt:Date.now() });
      S.form = {}; persist(); alert('提交成功，请耐心等待审核'); render();
    },
    bindCodeSubmit() {
      const code = (S.form.bindCode||'').trim();
      if (code !== c.playerCode) return alert('绑定码不正确');
      const rr = u.roles.find(r=>r.clubId===c.id);
      if (rr) rr.role = 'player';
      persist(); alert('绑定成功，欢迎加入！'); S.nav='home'; S.sub=null; render();
    },

    /* 流水 */
    finTab() { S.tabs.finance = el.dataset.v; render(); },
    finDim() { S.tabs.finDim = el.dataset.v; render(); },
    exportXls() {
      const data = '陪玩,单数,流水,实得\n小星,10,500,400\n月亮,8,360,288\n';
      const blob = new Blob(['\ufeff'+data], { type:'application/vnd.ms-excel' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '工资表.xls'; a.click();
      alert('已生成 Excel，可分享给伙伴核对');
    },

    /* 榜单 */
    rankType() { S.tabs.rankType = el.dataset.v; render(); },
    rankDim() { S.tabs.rankDim = el.dataset.v; render(); },

    /* 设置 */
    togglePanel() { const k = el.dataset.k; S.tabs.panels = S.tabs.panels||{}; S.tabs.panels[k] = !S.tabs.panels[k]; render(); },
    saveNick() { u.nickname = S.form.sNick || u.nickname; persist(); alert('已保存'); render(); },
    switchRole() {
      u.currentClubId = el.dataset.club;
      persist(); S.nav = 'home'; S.sub = null; S.form = {}; S.tabs = {};
      render();
      alert('已切换，页面已刷新');
    },
    joinClub() {
      const name = $('#joinClubName').value.trim(), code = $('#joinClubCode').value.trim();
      const cc = DB.clubs.find(x=>x.name===name);
      if (!cc) return alert('俱乐部不存在');
      let role = code===cc.staffCode?'staff':code===cc.playerCode?'player':null;
      if (!role) return alert('绑定码不正确');
      if (u.roles.some(r=>r.clubId===cc.id)) return alert('你已在该俱乐部');
      u.roles.push({ clubId:cc.id, role, jobs:role==='staff'?['派单']:[], joinedAt:Date.now() });
      persist(); alert('加入成功'); render();
    },
    toggleJob() { const j = el.dataset.j; const jobs = curRole().jobs||[]; curRole().jobs = jobs.includes(j)?jobs.filter(x=>x!==j):[...jobs,j]; persist(); render(); },
    saveJobs() { alert('岗位已保存'); render(); },
    setTheme() { u.theme = el.dataset.v; persist(); render(); },
    logout() { session = null; localStorage.removeItem('pw_session'); S.screen='login'; S.sub=null; render(); },

    /* 管理员设置 */
    saveClub() { if (S.form.cName) c.name = S.form.cName; persist(); alert('已保存'); render(); },
    regenCodes() {
      c.playerCode = 'PW-'+uid().slice(0,4).toUpperCase();
      c.staffCode = 'ST-'+uid().slice(0,4).toUpperCase();
      c.reviewCode = 'RV-'+uid().slice(0,4).toUpperCase();
      persist(); alert('已重新生成'); render();
    },
    saveBiz() {
      const s = c.settings;
      ['baseCommission','dispatchRate','directRate','topBonus'].forEach(k=>{ if (S.form[k]!=null) s[k] = Number(S.form[k]); });
      persist(); alert('已保存'); render();
    },
    toggleTop() { const id = el.dataset.id; const arr = c.settings.topPlayers||[]; c.settings.topPlayers = arr.includes(id)?arr.filter(x=>x!==id):[...arr,id]; persist(); render(); },
    tierMin() { c.settings.tiers[el.dataset.i].min = Number(el.value)||0; persist(); },
    tierReduce() { c.settings.tiers[el.dataset.i].reduce = Number(el.value)||0; persist(); },
    delTier() { c.settings.tiers.splice(el.dataset.i,1); persist(); render(); },
    addTier() { c.settings.tiers = c.settings.tiers||[]; c.settings.tiers.push({ min:0, reduce:0 }); persist(); render(); },
    addProject() {
      const name = $('#newProjName').value.trim();
      const gid = $('#newProjGame').value;
      if (!name) return alert('请输入项目名称');
      const g = DB.games.find(x=>x.id===gid);
      g.projects.push({ id:'p'+uid(), name, durations:[{ id:'d'+uid(), name:'1小时', price:30 }] });
      persist(); render();
    },
    setMemberRole() { /* select change handled below */ },
    toggleReward() { c.settings.rewards.enabled = !c.settings.rewards.enabled; persist(); render(); },
    rewardBasis() { c.settings.rewards.basis = el.value; persist(); },
    rewardCycle() { c.settings.rewards.cycle = el.value; persist(); },
    rewardTarget() { c.settings.rewards.tiers[el.dataset.k][el.dataset.i].target = Number(el.value)||0; persist(); },
    rewardAmount() { c.settings.rewards.tiers[el.dataset.k][el.dataset.i].amount = Number(el.value)||0; persist(); },
    delRewardTier() { c.settings.rewards.tiers[el.dataset.k].splice(el.dataset.i,1); persist(); render(); },
    addRewardTier() { const k = el.dataset.k; c.settings.rewards.tiers[k] = c.settings.rewards.tiers[k]||[]; c.settings.rewards.tiers[k].push({ target:0, amount:0 }); persist(); render(); },
    saveRewards() { alert('奖励设置已保存'); render(); },
    addReqBlock() { const g = el.dataset.game; c.settings.requirements[g] = c.settings.requirements[g]||[]; c.settings.requirements[g].push({ title:'新板块', items:['新要求'] }); persist(); render(); },
    savePending() {
      const s = c.settings;
      if (S.form.popTitle) s.popup.title = S.form.popTitle;
      if (S.form.popContent) s.popup.content = S.form.popContent;
      persist(); alert('待审设置已保存'); render();
    },

    /* 图片 */
    previewImg() { S.modal = `<div class="mask" data-act="closeModal"><img src="${el.dataset.src}" style="max-width:92%;max-height:80vh;border-radius:16px"></div>`; render(); },
    closeModal() { S.modal = null; render(); },
    delImg() { const t = el.dataset.t; S.form[t].splice(el.dataset.i,1); render(); },
    uploadImg() { /* handled by change event below */ },

    /* 保存资料 */
    saveProfile() { u.nickname = S.form.eNick || u.nickname; persist(); alert('已保存'); S.sub = null; render(); }
  };

  if (handlers[act]) { handlers[act](); }
});

/* input / select / file change */
document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (el.dataset.model) {
    if (el.type === 'number') S.form[el.dataset.model] = el.value === '' ? '' : Number(el.value);
    else S.form[el.dataset.model] = el.value;
  }
  if (act === 'changeSelect') {
    if (el.dataset.model === 'rGame') { S.form.rProj = null; S.form.rDur = null; }
    if (el.dataset.model === 'rProj') S.form.rDur = null;
    if (el.dataset.model === 'aGame') S.form.aGame = el.value;
    render();
  }
  if (act === 'changeInput') {
    if (el.dataset.model === 'recSearch') { render(); }
    if (el.dataset.model === 'topSearch') { render(); }
  }
  if (act === 'setMemberRole') {
    const x = userById(el.dataset.uid), c = curClub();
    const rr = x.roles.find(r=>r.clubId===c.id); if (rr) rr.role = el.value;
    persist(); alert('已更新'); render();
  }
  if (act === 'finDate') { render(); }
  if (act === 'uploadImg') {
    const files = el.files;
    if (!files || !files.length) return;
    const target = el.dataset.target;
    [...files].slice(0,3).forEach(f => {
      const reader = new FileReader();
      reader.onload = ev => { S.form[target] = S.form[target]||[]; S.form[target].push(ev.target.result); render(); };
      reader.readAsDataURL(f);
    });
  }
});

/* ==================== 启动 ==================== */
loadDB();
if (session) {
  const u = me();
  if (u) {
    document.body.dataset.theme = u.theme || 'glass';
    S.screen = 'main'; S.nav = 'home';
  } else { session = null; localStorage.removeItem('pw_session'); }
}
render();
</script>
</body>
</html>
